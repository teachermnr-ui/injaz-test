<!DOCTYPE html>
<!-- إصدار: 2026-10-29.1 · الاختبار — وكيل الشؤون المدرسية: نسخة طبق الأصل من النموذج المعتمد مربوطة بالبيانات الحقيقية -->
<html lang="ar" dir="rtl">
<head>
<script src="fb-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>لوحة وكيل الشؤون المدرسية</title>
<meta name="theme-color" content="#3f6659">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: RTL dashboard — header, 6 stat cards (3x2 / 6x1), then two cards: curriculum list + daily follow-up tile grid */
:root{
  --bg:#f1f5f3; --surface:#ffffff; --fg:#1b2a25; --muted:#5b6d66; --line:#d8e3de;
  --brand:#3f6659; --brand-soft:#e2ede8; --brand-fg:#ffffff;
  --ok:#2f7d4f; --ok-soft:#dff1e5; --warn:#a8650f; --warn-soft:#fbeed6; --bad:#b4412f; --bad-soft:#f9e1dc;
  --font:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a17; --surface:#1b2622; --fg:#e6efeb; --muted:#9bb0a8; --line:#2e3d37;
    --brand:#7fb5a2; --brand-soft:#243630; --brand-fg:#10201a;
    --ok:#6fcf97; --ok-soft:#1f3a2b; --warn:#e5ad5c; --warn-soft:#3b2f18; --bad:#ef8b78; --bad-soft:#3d221d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a17; --surface:#1b2622; --fg:#e6efeb; --muted:#9bb0a8; --line:#2e3d37;
  --brand:#7fb5a2; --brand-soft:#243630; --brand-fg:#10201a;
  --ok:#6fcf97; --ok-soft:#1f3a2b; --warn:#e5ad5c; --warn-soft:#3b2f18; --bad:#ef8b78; --bad-soft:#3d221d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{direction:rtl}
body{direction:rtl;text-align:right;
  background:var(--bg); color:var(--fg); font-family:var(--font); font-size:15px; line-height:1.6;
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mock{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.top h1{margin:0;font-size:24px;font-weight:800;text-wrap:balance}
.top .sub{color:var(--muted);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (min-width:900px){.stats{grid-template-columns:repeat(6,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .n{font-size:28px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;font-weight:700}
.stat .d{font-size:12px;color:var(--muted)}
.stat.bad .n{color:var(--bad)} .stat.warn .n{color:var(--warn)} .stat.ok .n{color:var(--ok)}

.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:17px;font-weight:800}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.list li:first-child{border-top:0}
.nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.nm small{display:block;color:var(--muted);font-size:12px}
.pill-no{background:var(--bad-soft);color:var(--bad);border-radius:99px;padding:2px 12px;font-size:12px;font-weight:700;white-space:nowrap}
button{font-family:inherit;font-size:inherit;color:inherit}
.btn{background:var(--brand-soft);color:var(--brand);border:0;border-radius:8px;padding:5px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.solid{background:var(--brand);color:var(--brand-fg)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.bar{height:10px;border-radius:99px;background:var(--brand-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .25s}
.prog{display:flex;align-items:center;gap:10px}
.prog b{font-variant-numeric:tabular-nums;white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{position:relative;min-height:72px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);text-align:right;cursor:pointer;font-weight:500;font-size:14px;line-height:1.4;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.tile:hover{border-color:var(--brand)}
.tile .mk{font-size:12px;color:var(--muted)}
.tile.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tile.done .mk{color:var(--ok);font-weight:700}
.tile.sel{outline:2px solid var(--brand);outline-offset:2px}
.tile.add{border-style:dashed;align-items:center;justify-content:center;color:var(--brand);font-weight:700}
.panel{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.panel strong{font-size:15px}
textarea,input[type=text]{width:100%;font-family:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
textarea{min-height:64px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov .box{background:var(--surface);color:var(--fg);border-radius:12px;max-width:440px;width:100%;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow:auto}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.doc i{display:block;height:8px;border-radius:4px;background:var(--line)}
.doc .t{height:12px;width:55%;background:var(--muted);opacity:.5}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-weight:700;border-radius:999px;padding:7px 16px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{background:var(--brand-soft)}
nav.tabs button.active{background:var(--brand);color:var(--brand-fg)}
button.stat{font:inherit;color:inherit;text-align:right;cursor:pointer}
button.stat:hover{border-color:var(--brand)}
.pane[hidden]{display:none}
.tag{border-radius:99px;padding:2px 12px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--brand-soft);color:var(--brand)}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.ok{background:var(--ok-soft);color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.trow{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);scroll-margin-top:12px}
.trow.flash{outline:3px solid var(--brand)}
#dRows,#sRows{display:flex;flex-direction:column;gap:10px}
.trow .nm{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-weight:800}
.trow .nm small{display:inline;font-weight:500}
.trow.abs{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;opacity:.75;background:var(--bg)}
.btns{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:6px}
@media (max-width:700px){.btns{grid-template-columns:repeat(2,minmax(0,1fr))}.btns .tg:last-child:nth-child(odd){grid-column:1/-1}}
.tg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1.5px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;padding:7px 6px;min-height:50px;text-align:center;line-height:1.3;font-weight:700;font-size:13px;cursor:pointer}
.tg .s{font-size:11px;font-weight:500}
.tg:hover{border-color:var(--brand)}
.tg.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tg.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tg.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.tg.dis,.tg:disabled{opacity:.5;cursor:default;border-style:dashed;background:var(--bg);border-color:var(--line);color:var(--muted)}
.sums{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:6px;padding:11px;border:2px solid var(--brand);border-radius:12px;background:var(--brand-soft)}
.sums::before{content:attr(data-t);grid-column:1/-1;color:var(--brand);font-weight:800;font-size:14px}
@media (max-width:700px){.sums{grid-template-columns:repeat(2,minmax(0,1fr))}.sums .sm:last-child:nth-child(odd){grid-column:1/-1}}
.sm{border:0;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--brand);color:var(--brand-fg);border-radius:8px;padding:6px 4px;min-height:56px;text-align:center;font-size:13px;font-weight:700;line-height:1.3}
.sm b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.sm.sel{outline:3px solid var(--fg);outline-offset:2px}
.nl{border:2px dashed var(--brand);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.nl[hidden]{display:none}
.nl strong{color:var(--brand)}
.nl .names{display:flex;flex-wrap:wrap;gap:6px}
.nmb{border:0;background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:4px 14px;font-weight:700;cursor:pointer}
.dp{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:8px}
.dp .t{font-weight:800;font-size:14px}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kd{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 14px;font-weight:700;font-size:13px;cursor:pointer}
.kd.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pc{border:1.5px solid var(--ok);background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:4px 12px;font-weight:700;font-size:13px;cursor:pointer}
.pc.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.dp .sub2{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.seg{display:inline-flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;border-radius:99px;padding:3px 14px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-fg)}
.tag{border-radius:99px;padding:2px 12px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--brand-soft);color:var(--brand)}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.ok{background:var(--ok-soft);color:var(--ok)}
.dp label{font-size:13px;color:var(--muted)}
.dp select,.dp input[type=date],.dp input[type=time]{font-family:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);max-width:100%}
.dp textarea{min-height:48px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fgrid>div{display:flex;flex-direction:column;gap:3px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.rep{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.rep th,table.rep td{padding:9px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
table.rep thead th{background:var(--brand-soft);color:var(--brand);border-top:0;font-size:13px}
table.rep td.num,table.rep th.num{text-align:center;font-variant-numeric:tabular-nums}
table.rep td.hi{color:var(--bad);font-weight:800}
table.rep tfoot td{font-weight:800;background:var(--bg)}
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.demo input[type=range]{flex:1;min-width:140px;accent-color:var(--brand)}
.rtitle{font-size:16px;font-weight:800;text-wrap:balance}
.hd2{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.nl .names{display:flex;flex-wrap:wrap;gap:8px}
.nrow{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 4px}
.nrow .btn{padding:2px 12px;font-size:13px}
.okmsg{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px}
.letter{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.8;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0}
.lt{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
#lRows{display:flex;flex-direction:column;gap:10px}
.lh{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:var(--brand-soft);color:var(--brand);padding:12px;cursor:pointer;text-align:right;font-family:inherit;font-size:15px}
.lhn{display:flex;flex-direction:column;font-weight:800;min-width:0}
.lhn small{font-weight:500;color:var(--fg);opacity:.85;font-size:12px}
.lb{padding:4px 12px 12px}
.lrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px dashed var(--line)}
.lrow:first-child{border-top:0}
.l1,.l2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.l1 .grow{flex:1;font-weight:700}
.l2 .muted{font-size:12px}
.btn:disabled{opacity:.55;cursor:default}
.trow.uns{border-color:var(--bad);border-width:2px}

.ov[hidden]{display:none}
.ov .box textarea{min-height:90px}
.ov .box .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.ov .box .kv b{color:var(--muted);font-weight:700}

.lhn small .redw{color:var(--bad);font-weight:800;opacity:1}
.hud{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:16px}
.hud img{border-radius:12px;background:#fff;padding:4px;width:150px;height:150px}
.hud>div{text-align:center}
.hud strong{font-size:18px;color:var(--brand)}
.stat .src{color:var(--brand);font-weight:700}
.hud2{align-items:center;text-align:center;padding:12px 8px}
.hud2 img{background:#fff;border-radius:12px;padding:4px;margin:auto;width:100%;max-width:170px;height:auto;aspect-ratio:1}
.ci.sel{width:auto;max-width:100%}
.ci{width:76px;font-family:inherit;font-size:14px;text-align:center;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-variant-numeric:tabular-nums}
.dp[hidden],#mRep[hidden],#mList[hidden]{display:none}
.rc{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.rc>.rtitle{margin-bottom:10px}
.rc>.rtitle:first-child,.rc>.hd2:first-child{margin-top:0}
.okw{color:var(--ok);font-weight:800}
.stat .hi{background:#fff;border-radius:6px;padding:1px;vertical-align:middle}
/* النموذج المعتمد معروض بوضع التوافق (بلا DOCTYPE) حيث لا ترث الجداول ارتفاع السطر؛ نُعيد السلوك نفسه هنا ليتطابق الشكل تمامًا */
table{line-height:normal}
</style>
<template id="saTpl">
<div class="wrap">
  <header class="top">
    <div><h1>لوحة وكيل الشؤون المدرسية</h1><div class="sub" id="today"></div></div>
    <div class="row"><button type="button" class="btn" id="back">← الموقع</button><span class="chip">وكيل الشؤون المدرسية</span></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="أقسام الشؤون المدرسية">
    <button type="button" data-t="q" class="active">الوصول السريع</button>
    <button type="button" data-t="d">دوام الموظفين</button>
    <button type="button" data-t="l">الاستئذان</button>
    <button type="button" data-t="m">الصيانة</button>
    <button type="button" data-t="r">تقرير التأخر</button>
    <button type="button" data-t="c">قرارات الحسم</button>
  </nav>

<script>
const SA_MARKUP = document.getElementById('saTpl').innerHTML;
/* وكيل الشؤون المدرسية — البيانات:
   schoolAffairs/{sid}/late/{period}__{uid}   خلايا الدقائق + آخر إجراء + السجل + الأرشيف
   schoolAffairs/{sid}/maint/{id}             طلبات الصيانة
   schoolAffairs/{sid}/decisions/{id}         قرارات الحسم (اعتماد المدير)
   staffDocs/{sid}/items/{id}                 النماذج المرسلة للموظف (تنبيه خطي، تعهدان، لفت نظر) ويوقّعها في «الإشعارات والمساءلات» */
Dash.boot({
  title:'وكيل الشؤون المدرسية', bare:true,
  allow:(u,ctx,sid,isSA)=>{
    if(isSA) return true;
    const p = ctx && ctx.permissions && ctx.permissions['tools.agentSchool'];
    return (p && (p.access || p.edit)) ? true : 'هذه الصفحة لصاحب صلاحية «وكيل الشؤون المدرسية» أو لمدير المدرسة.';
  },
  render: async env=>{
    const {db, sid, period, me, isSA} = env;
    const perm = (env.ctx && env.ctx.permissions && env.ctx.permissions['tools.agentSchool']) || {};
    const canEdit = !isSA && !!perm.edit;           // الوكيل صاحب التعديل
    const canApprove = !!isSA;                       // الاعتماد حق للمدير لا صلاحية
    env.main.innerHTML = SA_MARKUP;
    /* ---- الوصول السريع (أول تبويب): يُركَّب فورًا قبل تحميل البيانات حتى لا يظهر الشكل القديم ثم يتبدّل ---- */
    try{
      let q = null; const G = t=>()=>q && q.go(t);
      q = QA.bind({ style:'ring', stats:'.stats', cards:()=>{
        const teachers = STAFF.filter(x=>x.raw==='teacher'), openM = MT.filter(m=>m.st!=='done');
        return [
          {t:'دوام الموظفين', n:teachers.length, p:EDAY===null?null:teachers.filter(x=>EDAY.has(x.id)).length, l:'غائبون اليوم', go:G('d')},
          {t:'الاستئذان', n:'—', l:'من الموقع', go:G('l')},
          {t:'الصيانة', n:MT.length, p:openM.length, l:'طلبات مفتوحة', go:G('m')},
          {t:'تقرير التأخر', n:E().length, p:E().reduce((a,e)=>a+due(e),0), l:'إجراءات مستحقة', go:G('r')},
          {t:'قرارات الحسم', n:DEC.length, p:DEC.filter(d=>d.st==='wait').length, l:'بانتظار المدير', go:G('c')}
        ]; } });
    }catch(e){ console.warn('QA', e); }
    const $ = s=>document.querySelector(s);
    const A = n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
    const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const hijri = d=>{ try{ const o={}; new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d).forEach(x=>o[x.type]=x.value); return A(o.year+'/'+o.month+'/'+o.day); }catch(e){ return A(d.toLocaleDateString('en-GB')); } };
    const hijriLong = d=>{ try{ return d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long'}); }catch(e){ return d.toLocaleDateString('ar'); } };
    let dt=''; try{ dt=new Date().toLocaleDateString('ar-SA-u-ca-islamic-umalqura',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }catch(e){ dt=new Date().toLocaleDateString('ar'); }
    $('#today').textContent = dt; ['#dDate','#lDate'].forEach(s=>$(s).textContent=dt);
    $('#back').onclick = ()=>location.href='index.html';
    $('#rYear').textContent = env.school.year ? 'العام الدراسي '+A(env.school.year)+'هـ' : 'العام الدراسي';
    if(!canEdit){ $('#mNew').hidden = true; }
    const toast = m=>{ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2600); };
    const fail = e=>{ console.error(e); toast('تعذّر الحفظ: '+(e && e.message ? e.message : e)); };

    /* ---- مراجع Firestore ---- */
    const base = db.collection('schoolAffairs').doc(sid);
    const lateCol = base.collection('late'), mtCol = base.collection('maint'), decCol = base.collection('decisions');
    const sdCol = db.collection('staffDocs').doc(sid).collection('items');
    const lateRef = uid=>lateCol.doc(period+'__'+uid);
    const feedCol = base.collection('eduFeed');

    /* ---- الموظفون ---- */
    const ROLE = { agent:'وكيل', counselor:'موجه طلابي', assistant:'كادر إداري', teacherAssistant:'مساعد معلم', teacher:'معلم' };
    const STAFF = [];
    try{
      const snap = await window.UsersAPI.listSnap(sid);
      snap.forEach(d=>{
        const u = d.data(), c = (u.schools||{})[sid];
        const isAdm = u.role==='schoolAdmin' && (u.adminSchools||[]).includes(sid);
        if(isAdm || !c || c.active===false) return;
        STAFF.push({ id:d.id, name:u.username||'', role:ROLE[c.role]||c.role||'', raw:c.role||'' });
      });
    }catch(e){ console.warn('staff', e); }
    STAFF.sort((a,b)=>a.name.localeCompare(b.name,'ar'));

    /* ---- بداية الفصل (التقويم المركزي عبر وثيقة المدرسة) ---- */
    const per = (env.school.periods||[]).find(p=>p.id===period) || null;
    let startMs = per && per.fromMs ? per.fromMs : (env.school.yearFromMs || 0);
    const WEEK = 7*86400000;
    const wkOf = ms=>Math.max(1, Math.floor((ms - startMs)/WEEK) + 1);

    /* ---- الحالة الحية ---- */
    let LATE = {}, MT = [], DEC = [], DOCS = {};
    const ready = { late:false, mt:false, dec:false, docs:false, feed:false };
    /* دقائق أرسلها وكيل الشؤون التعليمية (الانصراف المبكر والحصص) ولم يُتخذ بشأنها إجراء بعد: تُضاف لخلايا الجدول */
    let FEED = {}, EDAY = null;
    let rOrd = null, mF = 'all', mrF = 'all', mOpenNote = null, rDirty = false;

    const LV = [
      {m:30,k:'تنبيه شفوي'}, {m:60,k:'تنبيه خطي'}, {m:120,k:'تعهد خطي (١)'},
      {m:240,k:'تعهد خطي (٢)'}, {m:420,k:'لفت نظر',days:1}, {m:840,k:'مساءلة'}
    ];
    const CELLS = ['late','early','pl','pt','po'];
    const total = e=>e.last.min + CELLS.reduce((a,k)=>a+e[k],0);
    const nextIdx = e=>e.last.k ? LV.findIndex(l=>l.k===e.last.k)+1 : 0;
    const due = e=>{ const n=nextIdx(e); return n<=5 && total(e)>=LV[n].m ? 1 : 0; };
    const stOf = h=>{ if(h.k==='تنبيه شفوي') return 'ok'; if(h.k==='مساءلة') return 'sent'; const d=h.docId && DOCS[h.docId]; return d && d.status==='signed' ? 'ok' : 'wait'; };
    const strip = h=>{ const o={k:h.k,min:h.min,date:h.date}; if(h.docId) o.docId=h.docId; return o; };
    function viewOf(s){
      const r = LATE[s.id] || {};
      const e = { id:s.id, n:s.name, r:s.role, archive:r.archive||[] };
      const fd = FEED[s.id] || {};
      CELLS.forEach(k=>{ e[k] = (r[k]||0) + (fd[k]||0); });
      e.feedDocs = fd.docs || [];
      e.hist = (r.hist||[]).map(h=>Object.assign({}, h, {st:stOf(h)}));
      e.last = r.last && r.last.k ? { min:r.last.min, k:r.last.k, st:stOf(r.last) } : { min:0, k:'', st:'' };
      return e;
    }
    const E = ()=>STAFF.map(viewOf);
    const nameOf = id=>{ const s=STAFF.find(x=>x.id===id); return s ? s.name : id; };

    /* ---- سياق الطباعة (الترويسة الموحدة) ---- */
    let PCTX = null;
    const printCtx = async ()=> PCTX || (PCTX = await FormHdr.resolve({db, session:env.session, period}));

    /* ---- تبويبات ---- */
    function showTab(t){
      document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active', x.dataset.t===t));
      document.querySelectorAll('.pane').forEach(p=>p.hidden = p.id!=='p-'+t);
    }
    $('#tabs').addEventListener('click', ev=>{
      const b = ev.target.closest('button[data-t]'); if(!b) return;
      showTab(b.dataset.t); rOrd = null; renderAll();
    });
    { const h = (location.hash||'').replace('#',''); if(['d','l','m','r','c'].includes(h)) showTab(h); }

    /* ---- المؤشرات ---- */
    function stats(){
      const L = E(), open = MT.filter(m=>m.st!=='done');
      const teachers = STAFF.filter(x=>x.raw==='teacher');
      if(EDAY===null){ $('#s1').textContent = '—'; $('#s1d').textContent = 'لا بيانات من الشؤون التعليمية'; }
      else{ const absn = teachers.filter(x=>EDAY.has(x.id)).length; $('#s1').textContent = A(teachers.length-absn); $('#s1d').textContent = 'من '+A(teachers.length)+' معلمًا'; }
      $('#s4').textContent = A(L.reduce((a,e)=>a+due(e),0));
      $('#s5').textContent = A(open.length); $('#s5d').textContent = A(open.filter(m=>m.pri==='عاجلة').length)+' عاجلة';
      $('#s6').textContent = A(DEC.filter(d=>d.st==='wait').length);
    }

    /* ---- تقرير التأخر ---- */
    const hm = m=> m>=60 ? A(Math.floor(m/60))+' س '+(m%60?A(m%60)+' د':'') : A(m)+' د';
    const num = v=>Math.max(0, parseInt(v||'0',10)||0);
    function lastTag(e){
      const l = e.last; if(!l.k) return '';
      const n = LV.findIndex(x=>x.k===l.k);
      if(l.st==='ok') return `<span class="tag ok">${n===0?'نُبّه شفويًا':(n===1?'أكّد المعلم اطلاعه':'وقّع المعلم')}</span>`;
      return `<span class="tag warn">${n===1?'أُرسل الإشعار · بانتظار تأكيد المعلم':'أُرسل النموذج · بانتظار التوقيع'}</span>`;
    }
    function rRender(){
      const fa = document.activeElement, fkey = fa && fa.dataset && fa.dataset.ce ? fa.dataset.ce+'|'+fa.dataset.id : null;
      const all = E();
      if(!rOrd) rOrd = [...all].sort((x,y)=>total(y)-total(x)).map(x=>x.id);
      const L = rOrd.map(id=>all.find(x=>x.id===id)).filter(Boolean);
      const dis = canEdit ? '' : ' disabled';
      const inp = (e,k)=>`<td class="num"><input type="number" min="0" class="ci" data-ce="${k}" data-id="${esc(e.id)}" value="${e[k]}"${dis}></td>`;
      $('#rBody').innerHTML = L.map(e=>{
        const t = total(e), n = nextIdx(e), nx = n<=5 ? LV[n] : null, d = due(e);
        return `<tr><td>${esc(e.n)}<div class="muted">${esc(e.r)}</div></td>`+
          `<td style="white-space:normal;min-width:260px">${e.last.k?`<div><b>${esc(e.last.k)}</b> · ${A(e.last.min)} دقيقة</div><div>${lastTag(e)}</div>`:'—'}</td>`+
          CELLS.map(k=>inp(e,k)).join('')+
          `<td class="num${d?' hi':''}">${A(t)}</td><td class="num">${t?hm(t):'—'}</td>`+
          `<td>${d?(canEdit?`<button type="button" class="btn solid" data-act="${esc(e.id)}">${esc(nx.k)}</button>`:`<span class="tag bad">${esc(nx.k)}</span>`):'—'}</td>`+
          `<td class="num">${nx&&!d?A(nx.m-t)+' د':'—'}</td><td><button type="button" class="btn" data-st="${esc(e.id)}">بيان</button></td></tr>`;
      }).join('') || '<tr><td colspan="12" class="muted">لا موظفين.</td></tr>';
      if(fkey){ const [ck, ci] = fkey.split('|'); const el = [...document.querySelectorAll('#rBody [data-ce]')].find(x=>x.dataset.ce===ck && x.dataset.id===ci); if(el){ el.focus(); try{ el.select(); }catch(e){} } }
    }
    const MSG = ['سُجّل التنبيه الشفوي','أُرسل الإشعار للمعلم، ويصله في «الإشعارات والمساءلات»','أُرسل النموذج للمعلم ليوقّعه','أُرسل النموذج للمعلم ليوقّعه','أُرسل النموذج للمعلم ليوقّعه'];
    let acting = false;
    async function act(uid){
      if(!canEdit || acting) return;
      const s = STAFF.find(x=>x.id===uid); if(!s) return;
      const e = viewOf(s); if(!due(e)) return;
      acting = true;
      try{
        const n = nextIdx(e), t = total(e), dateT = hijri(new Date()), now = Date.now();
        const lr = lateRef(uid), batch = db.batch();
        const zero = {late:0, early:0, pl:0, pt:0, po:0};
        const head = {uid, name:e.n, period, updatedAt:now};
        if(n===5){
          const full = e.hist.map(strip).concat([{k:'مساءلة', min:t, date:dateT}]);
          batch.set(decCol.doc(), { empId:uid, empName:e.n, empRole:e.r, why:'مساءلة تراكم التأخر', days:'', st:'wait', hist:full, period, createdAt:now, createdBy:me.id });
          batch.set(lr, Object.assign({}, head, zero, { last:{min:0,k:''}, hist:[], archive:(e.archive||[]).concat([{date:dateT, hist:full}]) }), {merge:true});
          toast('أُرسلت المساءلة للمدير، وانتقل السجل إلى قرارات الحسم، وصُفّر ملف الموظف');
        }else{
          const ent = { k:LV[n].k, min:t, date:dateT };
          if(n>=1){
            const kind = StaffDocs.LEVEL_KIND[LV[n].k];
            const d = StaffDocs.make(kind, {empName:e.n, minutes:t});
            const ref = sdCol.doc(); ent.docId = ref.id;
            batch.set(ref, { empId:uid, empName:e.n, empRole:e.r, kind, title:d.title, text:d.text, needSign:d.needSign, minutes:t, dateText:dateT, period, status:'sent', createdAt:now, createdBy:me.id, createdByName:me.name });
          }
          batch.set(lr, Object.assign({}, head, zero, { last:ent, hist:e.hist.map(strip).concat([ent]) }), {merge:true});
          toast(MSG[n]);
        }
        (e.feedDocs||[]).forEach(id=>batch.update(feedCol.doc(id), { consumed:true, consumedAt:now }));
        await batch.commit();
      }catch(err){ fail(err); }
      acting = false;
    }
    $('#rBody').addEventListener('change', async ev=>{
      const i = ev.target.closest('[data-ce]'); if(!i || !canEdit) return;
      const s = STAFF.find(x=>x.id===i.dataset.id); if(!s) return;
      try{ const fdv = (FEED[s.id]||{})[i.dataset.ce]||0; await lateRef(s.id).set({ uid:s.id, name:s.name, period, [i.dataset.ce]:Math.max(0, num(i.value)-fdv), updatedAt:Date.now() }, {merge:true}); }catch(e){ fail(e); }
    });
    $('#rBody').addEventListener('click', ev=>{
      const ab = ev.target.closest('[data-act]'); if(ab){ act(ab.dataset.act); return; }
      const b = ev.target.closest('[data-st]'); if(!b) return;
      const s = STAFF.find(x=>x.id===b.dataset.st); if(!s) return;
      const e = viewOf(s);
      $('#stT').textContent = 'بيان دقائق التأخر والإجراء المتخذ';
      $('#stSub').textContent = `${e.n} · ${e.r} · المجموع ${A(total(e))} دقيقة`;
      const VP = {'تنبيه شفوي':'نبّه شفويًا','تنبيه خطي':'أرسل إشعارًا نصيًا','تعهد خطي (١)':'أرسل نموذج التعهد','تعهد خطي (٢)':'أرسل نموذج التعهد','لفت نظر':'أرسل نموذج لفت النظر','مساءلة':'أرسل المساءلة للمدير'};
      const TE = x=>{
        if(x.k==='تنبيه شفوي') return '<span class="tag">لا يتطلب تأكيدًا</span>';
        if(x.k==='مساءلة') return '<span class="tag ok">مكتمل</span>';
        const sg = x.k==='تنبيه خطي' ? ['أكّد اطلاعه','لم يؤكد بعد'] : ['وقّع','لم يوقّع بعد'];
        const v = x.docId && DOCS[x.docId] ? ` <button type="button" class="btn" data-vd="${esc(x.docId)}">عرض النموذج</button>` : '';
        return (stOf(x)==='ok' ? '<span class="tag ok">'+sg[0]+'</span>' : '<span class="tag warn">'+sg[1]+'</span>') + v;
      };
      const row = x=>`<tr><td>${esc(x.k)}</td><td class="num">${A(x.min)}</td><td>${esc(x.date)}</td><td>${VP[x.k]}</td><td>${TE(x)}</td></tr>`;
      let rows = '';
      e.archive.forEach(c=>{ rows += `<tr><td colspan="5" style="background:var(--ok-soft);color:var(--ok);font-weight:800">دورة مكتملة: بلغ النصاب وأُرسلت المساءلة للمدير (${esc(c.date)})</td></tr>` + c.hist.map(row).join(''); });
      if(e.hist.length || !e.archive.length) rows += `<tr><td colspan="5" style="background:var(--brand-soft);color:var(--brand);font-weight:800">الدورة الحالية</td></tr>` + (e.hist.length ? e.hist.map(row).join('') : '<tr><td colspan="5" class="muted">لم يُتخذ إجراء بعد.</td></tr>');
      if(due(e)) rows += `<tr><td>${esc(LV[nextIdx(e)].k)}</td><td class="num">${A(total(e))}</td><td>—</td><td><span class="tag bad">مستحق، لم يُتخذ بعد</span></td><td>—</td></tr>`;
      $('#stBody').innerHTML = rows;
      $('#stOv').hidden = false;
    });
    $('#stBody').addEventListener('click', async ev=>{
      const b = ev.target.closest('[data-vd]'); if(!b) return;
      const d = DOCS[b.dataset.vd]; if(d) StaffDocs.print(d, await printCtx());
    });
    $('#stClose').onclick = ()=>$('#stOv').hidden = true;

    /* ---- الصيانة ---- */
    const MS = {new:['جديد','bad'], run:['قيد التنفيذ','warn'], done:['منجز','ok']};
    const LT = {'':null, wait:['الخطاب بانتظار اعتماد المدير','warn'], ok:['اعتمد المدير الخطاب','ok'], no:['لم يعتمد المدير الخطاب','bad'], ret:['أعاده المدير للتعديل','bad']};
    const wkDate = ms=>ms ? hijriLong(new Date(ms)) : '—';
    $('#mNew').onclick = ()=>{ $('#mForm').hidden = false; };
    $('#mCancel').onclick = ()=>$('#mForm').hidden = true;
    $('#mSave').onclick = async ()=>{
      if(!canEdit) return;
      const loc = $('#mLoc').value.trim(), d = $('#mDesc').value.trim();
      if(!loc || !d){ toast('أدخل الموقع ووصف العطل'); return; }
      try{
        await mtCol.add({ loc, d, pri:$('#mPri').value, st:'new', l:'', note:'', createdAt:Date.now(), byId:me.id, byName:me.name, period });
        $('#mLoc').value = ''; $('#mDesc').value = ''; $('#mForm').hidden = true; toast('سُجّل طلب الصيانة');
      }catch(e){ fail(e); }
    };
    $('#mSeg').addEventListener('click', ev=>{ const b=ev.target.closest('button'); if(!b) return; mF=b.dataset.f; document.querySelectorAll('#mSeg button').forEach(x=>x.classList.toggle('on',x===b)); mRender(); });
    $('#mView').addEventListener('click', ev=>{
      const b = ev.target.closest('button'); if(!b) return;
      document.querySelectorAll('#mView button').forEach(x=>x.classList.toggle('on',x===b));
      const rep = b.dataset.v==='rep'; $('#mList').hidden = rep; $('#mRep').hidden = !rep; $('#mNew').hidden = rep || !canEdit; if(rep) mrRender();
    });
    function mRender(){
      const L = MT.filter(m=>mF==='all' || m.st===mF);
      $('#mRows').innerHTML = L.map(m=>{
        const lt = LT[m.l||''];
        let letter = '';
        if(canEdit && (m.l===''||m.l==='no'||m.l==='ret'||!m.l)) letter = `<button type="button" class="btn" data-ml="${m.id}">${(m.l==='no'||m.l==='ret')?'إعادة رفع الخطاب':'رفع خطاب طلب'}</button>`;
        if(canApprove && m.l==='wait') letter = `<button type="button" class="btn solid" data-mok="${m.id}:ok">اعتماد المدير</button> <button type="button" class="btn" data-mok="${m.id}:no">عدم الاعتماد</button>`;
        if(m.l) letter += ` <button type="button" class="btn" data-mpr="${m.id}">طباعة الخطاب</button>`;
        const stT = m.st==='run'&&m.l==='wait' ? ['warn','قيد التنفيذ - بانتظار اعتماد المدير'] : (m.st==='run'&&m.l==='ok' ? ['warn','قيد التنفيذ - <b class="okw">اعتمد المدير</b>'] : (m.st==='run'&&m.l==='no' ? ['warn','قيد التنفيذ - لم يعتمد المدير'] : [MS[m.st][1], MS[m.st][0]]));
        const noteBox = mOpenNote===m.id ? `<div class="dp"><div class="t">ملاحظة الإنجاز (ماذا أُصلح ومن نفّذ)</div><textarea id="mn${m.id}" placeholder="ملاحظة اختيارية"></textarea><div class="row"><button type="button" class="btn solid" data-mdone="${m.id}">تسجيل الإنجاز</button><button type="button" class="btn" data-mcn="1">إلغاء</button></div></div>` : '';
        const stBtn = canEdit ? `<button type="button" class="btn" data-ms="${m.id}"><span class="tag ${stT[0]}">${stT[1]}</span></button>` : `<span class="tag ${stT[0]}">${stT[1]}</span>`;
        return `<div class="trow"><div class="nm">${esc(m.loc)}<small>${esc(m.d)} · ${wkDate(m.createdAt)}</small></div><div class="row">${m.pri==='عاجلة'?'<span class="tag bad">عاجلة</span>':'<span class="tag">عادية</span>'}${stBtn}${m.st==='done'&&!m.l?'':letter}</div>${m.st==='done'&&m.note?`<div class="muted">ملاحظة الإنجاز: ${esc(m.note)}</div>`:''}${noteBox}</div>`;
      }).join('') || '<div class="muted">لا طلبات.</div>';
    }
    $('#mRows').addEventListener('click', async ev=>{
      const g = k=>{ const b=ev.target.closest('['+k+']'); return b ? b.getAttribute(k) : null; };
      let v; const now = Date.now();
      try{
        if((v=g('data-ms'))){ if(!canEdit) return; const m = MT.find(x=>x.id===v);
          if(m.st==='new') await mtCol.doc(m.id).update({st:'run', runAt:now});
          else if(m.st==='run'){ mOpenNote = m.id; mRender(); }
          else await mtCol.doc(m.id).update({st:'new', doneAt:null, runAt:null, note:''});
          return; }
        if((v=g('data-mdone'))){ if(!canEdit) return; const m = MT.find(x=>x.id===v); const f=$('#mn'+m.id); mOpenNote=null;
          await mtCol.doc(m.id).update({st:'done', doneAt:now, note:((f&&f.value)||'').trim()}); toast('سُجّل الإنجاز'); return; }
        if(g('data-mcn')){ mOpenNote=null; mRender(); return; }
        if((v=g('data-ml'))){ if(!canEdit) return; const m = MT.find(x=>x.id===v); const upd = {l:'wait', lAt:now}; if(m.st==='new'){ upd.st='run'; upd.runAt=now; }
          await mtCol.doc(m.id).update(upd); toast('رُفع الخطاب للمدير، والطلب الآن قيد التنفيذ'); return; }
        if((v=g('data-mok'))){ if(!canApprove) return; const [id,r] = v.split(':'); await mtCol.doc(id).update({l:r, lAt:now, lBy:me.id}); toast(r==='ok'?'اعتُمد الخطاب':'سُجّل عدم الاعتماد'); return; }
        if((v=g('data-mpr'))){ const m = MT.find(x=>x.id===v); StaffDocs.printMaint(Object.assign({}, m, {dateText:wkDate(m.lAt||m.createdAt)}), await printCtx()); return; }
      }catch(e){ fail(e); }
    });

    /* ---- تقرير الصيانة ---- */
    const ORD = ['','الأول','الثاني','الثالث','الرابع'], WKL = ['','وأسبوع','وأسبوعان','وثلاثة أسابيع'], MON = ['','الأول','الثاني','الثالث','الرابع','الخامس','السادس'];
    const periodLabel = n=>{ const m=Math.floor(n/4), w=n%4; return m===0 ? 'الأسبوع '+ORD[n] : 'الشهر '+MON[m]+(w?' '+WKL[w]:''); };
    const wk = m=>wkOf(m.createdAt||0);
    function stAt(m,n){ if(m.st==='done' && m.doneAt && wkOf(m.doneAt)<=n) return 'done'; if(m.runAt && wkOf(m.runAt)<=n && m.st!=='new') return 'run'; return 'new'; }
    function mrData(){
      const n = Math.max(1, wkOf(Date.now()));
      const L = MT.filter(m=>wk(m)<=n);
      return {n, L};
    }
    function mrRender(){
      const {n, L} = mrData();
      $('#mrTitle').textContent = 'تقرير الصيانة حتى '+periodLabel(n);
      const cnt = s=>L.filter(m=>stAt(m,n)===s).length;
      const dn = L.filter(m=>stAt(m,n)==='done');
      const avg = dn.length ? Math.round(dn.reduce((a,m)=>a+(wkOf(m.doneAt)-wk(m))*7,0)/dn.length) : 0;
      const pend = L.filter(m=>m.l==='wait').length;
      $('#mrStats').innerHTML = [['إجمالي الطلبات',L.length,''],['جديد',cnt('new'),'bad'],['قيد التنفيذ',cnt('run'),'warn'],['منجز',cnt('done'),'ok'],['خطابات بانتظار المدير',pend,'warn'],['متوسط مدة الإنجاز',dn.length?A(avg)+' يوم':'—','']].map(x=>`<div class="stat ${x[2]}"><span class="n">${typeof x[1]==='number'?A(x[1]):x[1]}</span><span class="l">${x[0]}</span></div>`).join('');
      const grp = key=>{ const o={}; L.forEach(m=>{ (o[m[key]]=o[m[key]]||[]).push(m); }); return Object.keys(o).sort((a,b)=>o[b].length-o[a].length).map(k=>[k,o[k]]); };
      $('#mrLoc').innerHTML = grp('loc').map(([k,a])=>{ const d=a.filter(m=>stAt(m,n)==='done').length; return `<tr><td>${esc(k)}</td><td class="num">${A(a.length)}</td><td class="num">${A(d)}</td><td class="num${a.length-d?' hi':''}">${A(a.length-d)}</td><td><button type="button" class="btn" data-mloc="${esc(k)}">بيان</button></td></tr>`; }).join('') || '<tr><td colspan="5" class="muted">لا طلبات.</td></tr>';
      $('#mrBody').innerHTML = L.map(m=>{
        const s = stAt(m,n), lt = LT[m.l||''];
        if(mrF!=='all' && s!==mrF) return '';
        const dd = s==='done' ? wkOf(m.doneAt)-wk(m) : 0;
        return `<tr><td>${esc(m.loc)}</td><td style="white-space:normal;min-width:170px">${esc(m.d)}</td><td>${m.pri==='عاجلة'?'<span class="tag bad">عاجلة</span>':'عادية'}</td><td>${wkDate(m.createdAt)}</td><td>${lt?`<span class="tag ${lt[1]}">${m.l==='wait'?'بانتظار المدير':(m.l==='ok'?'اعتمد':'لم يعتمد')}</span>`:'لم يُرفع'}</td><td><span class="tag ${MS[s][1]}">${MS[s][0]}</span></td><td>${s==='done'?wkDate(m.doneAt):'—'}</td><td class="num">${s==='done'?(dd?A(dd*7)+' يوم':'أقل من أسبوع'):'—'}</td></tr>`;
      }).join('') || '<tr><td colspan="8" class="muted">لا طلبات حتى هذا الأسبوع.</td></tr>';
    }
    $('#mrSeg').addEventListener('click', ev=>{ const b=ev.target.closest('button'); if(!b) return; mrF=b.dataset.f; document.querySelectorAll('#mrSeg button').forEach(x=>x.classList.toggle('on',x===b)); mrRender(); });
    const printTable = async (title, tableHtml)=>{
      const c = await printCtx();
      const w = window.open('', '_blank'); if(!w){ toast('اسمح بالنوافذ المنبثقة للطباعة'); return; }
      w.document.open(); w.document.write(FormHdr.doc({ title, formTitle:title, ctx:c, body:tableHtml, margin:'10mm', extraCss:'table{border-collapse:collapse;width:100%}th,td{border:1px solid #888;padding:5px 7px;font-size:13px;text-align:right}th{background:#eef2f1}.sub{margin:6px 0;font-weight:700}' })); w.document.close();
    };
    $('#mrPdf').addEventListener('click', ()=>{
      const {n, L} = mrData();
      const lab = ({all:'الكل',new:'جديد',run:'قيد التنفيذ',done:'منجز'})[mrF];
      const rows = L.filter(m=>mrF==='all' || stAt(m,n)===mrF).map((m,i)=>`<tr><td>${A(i+1)}</td><td>${esc(m.loc)}</td><td>${esc(m.d)}</td><td>${m.pri}</td><td>${wkDate(m.createdAt)}</td><td>${MS[stAt(m,n)][0]}</td><td>${stAt(m,n)==='done'?wkDate(m.doneAt):'—'}</td></tr>`).join('');
      printTable('تقرير الصيانة', `<div class="sub">${periodLabel(n)} · الحالة: ${lab}</div><table><thead><tr><th>م</th><th>الموقع</th><th>الوصف</th><th>الأولوية</th><th>تاريخ الرفع</th><th>الحالة</th><th>تاريخ الإنجاز</th></tr></thead><tbody>${rows}</tbody></table>`);
    });
    let mlLoc = null;
    $('#mrLoc').addEventListener('click', ev=>{
      const b = ev.target.closest('[data-mloc]'); if(!b) return;
      const {n, L} = mrData(); const loc = b.dataset.mloc, a = L.filter(m=>m.loc===loc); mlLoc = {loc, n, a};
      $('#mlT').textContent = 'بيان صيانة: '+loc; $('#mlSub').textContent = periodLabel(n)+' · '+A(a.length)+' طلب';
      $('#mlBody').innerHTML = a.map((m,i)=>{ const s = stAt(m,n); return `<tr><td class="num">${A(i+1)}</td><td style="white-space:normal;min-width:180px">${esc(m.d)}</td><td>${wkDate(m.createdAt)}</td><td>${m.pri==='عاجلة'?'<span class="tag bad">عاجلة</span>':'عادية'}</td><td><span class="tag ${MS[s][1]}">${MS[s][0]}</span></td><td>${s==='done'?wkDate(m.doneAt):'—'}</td></tr>`; }).join('');
      $('#mlOv').hidden = false;
    });
    $('#mlClose').onclick = ()=>$('#mlOv').hidden = true;
    $('#mlPdf').onclick = ()=>{
      if(!mlLoc) return; const {loc, n, a} = mlLoc;
      const rows = a.map((m,i)=>`<tr><td>${A(i+1)}</td><td>${esc(m.d)}</td><td>${wkDate(m.createdAt)}</td><td>${m.pri}</td><td>${MS[stAt(m,n)][0]}</td><td>${stAt(m,n)==='done'?wkDate(m.doneAt):'—'}</td></tr>`).join('');
      printTable('بيان صيانة: '+loc, `<div class="sub">${periodLabel(n)} · ${A(a.length)} طلب</div><table><thead><tr><th>م</th><th>البند</th><th>تاريخ الرفع</th><th>الأولوية</th><th>الحالة</th><th>تاريخ الإنجاز</th></tr></thead><tbody>${rows}</tbody></table>`);
    };

    /* ---- قرارات الحسم ---- */
    const DS = {wait:['بانتظار اعتماد المدير','warn'], ok:['معتمد','ok'], sent:['رُفع لشؤون الموظفين','ok'], no:['رفضه المدير','bad'], ret:['أعاده المدير للتعديل','bad']};
    function cRender(){
      $('#cCount').textContent = A(DEC.length)+' قرارات';
      $('#cRows').innerHTML = DEC.map(d=>{
        const hist = (d.hist||[]).length ? `<div class="tw"><table class="rep" style="min-width:420px"><thead><tr><th>الإجراء</th><th class="num">الدقائق</th><th>التاريخ</th></tr></thead><tbody>${d.hist.map(x=>`<tr><td>${esc(x.k)}</td><td class="num">${A(x.min)}</td><td>${esc(x.date)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="muted">مساءلة غياب معتمدة من سجل الإشعارات والمساءلات.</div>';
        const days = d.st==='wait'
          ? (canApprove ? `<div class="row"><label class="muted" for="dd${d.id}">أيام الحسم (يحددها المدير)</label><input type="number" min="0" class="ci" id="dd${d.id}" data-dd="${d.id}" value="${d.days===''?'':d.days}"></div>` : `<div class="muted">أيام الحسم: يحددها المدير عند الاعتماد.</div>`)
          : `<div class="muted">أيام الحسم: ${A(d.days||0)}</div>`;
        let btn = '';
        if(d.st==='wait' && canApprove) btn = `<button type="button" class="btn solid" data-dk="${d.id}">اعتماد المدير</button>`;
        if(d.st==='ok' && canEdit) btn = `<button type="button" class="btn solid" data-dk="${d.id}">رفع لشؤون الموظفين</button>`;
        if(d.st==='ret' && canEdit) btn = `<button type="button" class="btn solid" data-drs="${d.id}">إعادة رفع للمدير</button>`;
        if(d.st!=='wait' && d.st!=='no' && d.st!=='ret') btn += ` <button type="button" class="btn" data-dpr="${d.id}">طباعة القرار</button>`;
        return `<div class="trow"><div class="nm">${esc(d.empName||nameOf(d.empId))}<small>${esc(d.why)}</small></div>${hist}${days}<div class="row"><span class="tag ${DS[d.st][1]}">${DS[d.st][0]}</span>${btn}</div></div>`;
      }).join('') || '<div class="muted">لا قرارات.</div>';
    }
    $('#cRows').addEventListener('click', async ev=>{
      const pr = ev.target.closest('[data-dpr]');
      if(pr){ const d = DEC.find(x=>x.id===pr.dataset.dpr); if(d) StaffDocs.printDecision(d, await printCtx()); return; }
      const rs = ev.target.closest('[data-drs]');
      if(rs && canEdit){ try{ await decCol.doc(rs.dataset.drs).update({st:'wait', decisionNote:''}); toast('أُعيد رفع القرار للمدير'); }catch(e){ fail(e); } return; }
      const b = ev.target.closest('[data-dk]'); if(!b) return;
      const d = DEC.find(x=>x.id===b.dataset.dk); if(!d) return;
      try{
        if(d.st==='wait' && canApprove){
          const f = $('#dd'+d.id); const days = num(f ? f.value : d.days);
          await decCol.doc(d.id).update({st:'ok', days, approvedAt:Date.now(), approvedBy:me.id}); toast('اعتُمد القرار');
        }else if(d.st==='ok' && canEdit){
          await decCol.doc(d.id).update({st:'sent', sentAt:Date.now(), sentBy:me.id}); toast('رُفع القرار لشؤون الموظفين');
        }
      }catch(e){ fail(e); }
    });

    /* ---- العرض ---- */
    let raf = 0, typing = false;
    document.addEventListener('input', ev=>{ if(ev.target.closest('[data-ce],[data-dd]')) typing = true; });
    document.addEventListener('change', ev=>{ if(ev.target.closest('[data-ce],[data-dd]')) typing = false; });
    function renderAll(){
      if(!(ready.late && ready.mt && ready.dec && ready.docs && ready.feed)) return;
      if(typing){ rDirty = true; return; }
      cancelAnimationFrame(raf); raf = requestAnimationFrame(()=>{ stats(); mRender(); rRender(); cRender(); if(!$('#mRep').hidden) mrRender(); });
    }
    document.addEventListener('focusout', ev=>{ if(rDirty && !typing){ rDirty = false; setTimeout(renderAll, 50); } });
    const onErr = k=>e=>{ console.error(k, e); ready[k] = true; toast('تعذّر تحميل بعض البيانات'); renderAll(); };
    lateCol.where('period','==',period).onSnapshot(s=>{ LATE = {}; s.forEach(d=>{ LATE[d.data().uid] = d.data(); }); ready.late = true; renderAll(); }, onErr('late'));
    feedCol.where('period','==',period).onSnapshot(s=>{
      FEED = {};
      s.forEach(d=>{ const f = d.data(); if(f.consumed) return; const o = FEED[f.uid] = FEED[f.uid] || { docs:[] }; o[f.key] = (o[f.key]||0) + (+f.min||0); o.docs.push(d.id); });
      ready.feed = true; renderAll();
    }, e=>{ console.warn('feed', e); ready.feed = true; renderAll(); });
    try{
      const d0 = new Date(), tk = d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0')+'-'+String(d0.getDate()).padStart(2,'0');
      db.collection('eduDaily').doc(sid).collection('items').where('date','==',tk).onSnapshot(s=>{ EDAY = new Set(); s.forEach(d=>{ const x = d.data(); if(x.abs) EDAY.add(x.uid); }); renderAll(); }, e=>console.warn('eduDaily', e));
    }catch(e){ console.warn(e); }
    mtCol.onSnapshot(s=>{ MT = s.docs.map(d=>Object.assign({id:d.id}, d.data())).filter(m=>!m.period || m.period===period).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); ready.mt = true; renderAll(); }, onErr('mt'));
    decCol.onSnapshot(s=>{ DEC = s.docs.map(d=>Object.assign({id:d.id}, d.data())).filter(m=>!m.period || m.period===period).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); ready.dec = true; renderAll(); }, onErr('dec'));
    sdCol.where('period','==',period).onSnapshot(s=>{ DOCS = {}; s.forEach(d=>{ DOCS[d.id] = Object.assign({id:d.id}, d.data()); }); ready.docs = true; renderAll(); }, onErr('docs'));

  }
});

</script>
</body>
</html>
