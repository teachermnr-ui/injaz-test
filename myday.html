<style>
/* «يومي» — واجهة الجوال. الألوان من theme.css (الياسمين/الأساسي، فاتح/داكن) */
:root{
  --bg:#f4f7f6; --surface:#ffffff; --surface-2:#eef4f3;
  --brand:#0f766e; --brand-2:#0b5a54; --brand-l:#d5ece9;
  --ink:#15242b; --muted:#56696f; --line:#dde6e4;
  --warn:#b45309; --warn-ink:#8a4a00; --warn-l:#fff4e2; --warn-line:#f3dcb3;
  --blue:#1e5aaa; --blue-l:#e9f1fd; --vio:#6b3fa0; --vio-l:#f2ebfa;
  --r:18px; --shadow:0 1px 2px rgba(16,40,40,.05),0 10px 28px rgba(16,40,40,.07);
}
@media screen{
  html.dark{ --warn-ink:#f0b45c; --warn-l:#2a2013; --warn-line:#4a3618; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Tajawal',"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,a.btn{font-family:inherit;cursor:pointer;border:none}
a{color:inherit;text-decoration:none}
.hidden{display:none !important}
.ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}

/* شاشة البداية: .ijs في theme.css */

/* ---------- الترويسة ---------- */
.hero{background:var(--head,var(--bg-0f766e,#0f766e));color:var(--fg-ffffff,#fff);padding:calc(18px + env(safe-area-inset-top)) 20px 62px;position:relative}
html.t-jasmine .hero{border-top:3px solid var(--gold,var(--bd-c99a3b,#c99a3b))}
.hero .in{max-width:720px;margin:0 auto;position:relative}
.hero .top{display:flex;align-items:center;gap:12px}
.hero .ava{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 auto}
.hero .who{flex:1;min-width:0;font-size:12.5px;opacity:.82;line-height:1.45}
.hero .who div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .hb{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.16);color:var(--fg-ffffff,#fff);display:flex;align-items:center;justify-content:center}
.hero h1{margin:20px 0 2px;font-size:26px;font-weight:800;line-height:1.3}
.hero .dt{font-size:14px;opacity:.88}
.hero .gl{position:absolute;right:0;bottom:-20px;width:36px;height:3px;border-radius:2px;background:var(--gold,var(--bg-c99a3b,#c99a3b))}

main{max-width:720px;margin:-40px auto 0;padding:0 16px calc(104px + env(safe-area-inset-bottom));position:relative;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:14px 6px;font-size:14px}
main > *{animation:rise .32s ease both}
main > *:nth-child(2){animation-delay:.04s} main > *:nth-child(3){animation-delay:.08s} main > *:nth-child(4){animation-delay:.12s} main > *:nth-child(5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- الآن / التالي ---------- */
.now .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--brand-l);color:var(--brand-2)}
.pill.warn{background:var(--warn-l);color:var(--warn-ink)}
.now .meta{font-size:12.5px;color:var(--muted)}
.now .main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:12px}
.now .t{font-size:21px;font-weight:800;line-height:1.3}
.now .c{font-size:13.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;padding:0 16px;border-radius:12px;border:1.5px solid var(--brand);background:transparent;color:var(--brand-2);min-height:44px;text-decoration:none}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand,var(--fg-ffffff,#fff))}
.prog{margin-top:14px;height:6px;border-radius:999px;background:var(--track,var(--bg-e7eeec,#e7eeec));overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:var(--gold,var(--bg-c8a24a,#c8a24a));transition:width .6s ease}
.prog-l{display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px;color:var(--muted)}

/* ---------- العدّادات ---------- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:800;line-height:1.3}
.stat span{font-size:12px;color:var(--muted)}
.stat.w{background:var(--warn-l);border-color:var(--warn-line)}
.stat.w b,.stat.w span{color:var(--warn-ink)}

/* ---------- خط اليوم ---------- */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;align-items:stretch;gap:10px;padding:5px 0}
.tl .when{flex:0 0 58px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.tl .when b{font-size:13.5px;font-weight:700}
.tl .when span{font-size:11.5px;color:var(--muted)}
.tl .rail{flex:0 0 12px;display:flex;flex-direction:column;align-items:center}
.tl .rail i{flex:1;width:2px;background:var(--line)}
.tl .rail .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:0 0 auto}
.tl li:first-child .rail i:first-child, .tl li.last .rail i:last-child{background:transparent}
.tl .what{flex:1;min-width:0;border-radius:14px;padding:10px 12px;background:var(--surface);border:1px solid var(--line)}
.tl .what .h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tl .what b{font-size:15px;font-weight:700}
.tl .what .s{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.now{background:var(--brand);color:var(--on-brand,var(--fg-ffffff,#fff))}
.tag.dbl{background:var(--brand-l);color:var(--brand-2)}
.tag.vis{background:var(--vio-l);color:var(--vio)}
.tag.warn{background:var(--warn-line);color:var(--warn-ink)}
.tl li.done .what{opacity:.62}
.tl li.done .rail .dot{background:var(--brand);border-color:var(--brand)}
.tl li.done .rail i, .tl li.now .rail i:first-child{background:var(--brand)}
.tl li.now .rail .dot{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-l)}
.tl li.now .when b{color:var(--brand-2)}
.tl li.now .what{border-color:var(--brand);background:var(--brand-l)}
.tl li.free .what{background:var(--surface-2);border-color:transparent}
.tl li.free .what b{color:var(--muted);font-weight:500;font-size:14px}
.tl li.wait .what{background:var(--warn-l);border-color:var(--warn-line)}
.tl li.wait .what b{color:var(--warn-ink)}
.tl li.wait .rail .dot{border-color:var(--warn)}
.tl li.sup .what{background:var(--blue-l);border-color:transparent}
.tl li.duty .what{background:var(--vio-l);border-color:transparent}
.tl li.sup .when .ico, .tl li.duty .when .ico{color:var(--muted);margin:0 auto 2px}
.tl li.mark{padding:6px 0;align-items:center;color:var(--muted);font-size:12.5px}
.tl li.mark .when{font-size:12px}
.tl li.mark .ln{flex:1;height:1px;background:var(--line)}
.tl li.mark .lb{padding:0 8px;white-space:nowrap}
.stage-h{font-size:13px;font-weight:800;color:var(--muted);margin:10px 0 2px}

/* ---------- التنبيهات ---------- */
.als{padding:4px 16px}
.al{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-height:44px}
.al:first-child{border-top:none}
.al .ai{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--brand-l);color:var(--brand-2)}
.al .ai.g{background:var(--gold-l,var(--bg-f6eedb,#f6eedb));color:var(--gold-ink,var(--fg-7a5c14,#7a5c14))}
.al .ai.w{background:var(--warn-l);color:var(--warn-ink)}
.al .ai.v{background:var(--vio-l);color:var(--vio)}
.al .ai.b{background:var(--blue-l);color:var(--blue)}
.al .at{flex:1;min-width:0}
.al .at b{display:block;font-size:14.5px;font-weight:700}
.al .at span{display:block;font-size:12.5px;color:var(--muted)}
.al .go{color:var(--muted);display:flex}
.al-h{display:flex;align-items:center;justify-content:space-between;padding:12px 0 2px}
.al-h h3{margin:0}

.banner{border-radius:16px;padding:14px 16px;font-weight:700;display:flex;align-items:center;gap:10px;background:var(--warn-l);color:var(--warn-ink);border:1px solid var(--warn-line)}

/* ---------- بطاقة الإشعارات ---------- */
.nt{display:flex;gap:12px;align-items:flex-start}
.nt .ai{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--surface-2);color:var(--muted)}
.nt .tx{flex:1;min-width:0;font-size:13.5px;color:var(--muted);line-height:1.6}
.nt .tx b{color:var(--ink)}
.nt .bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#nErr{color:var(--danger,var(--fg-b42318,#b42318));margin-top:6px;font-size:12.5px}

/* ---------- الهيكل أثناء التحميل ---------- */
.sk{background:linear-gradient(90deg,var(--surface-2) 0,var(--track,var(--bg-e7eeec,#e7eeec)) 40%,var(--surface-2) 80%);background-size:300% 100%;border-radius:8px;animation:sk 1.3s ease-in-out infinite}
@keyframes sk{from{background-position:100% 0}to{background-position:0 0}}

/* ---------- الشريط السفلي ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;font-size:11.5px;font-weight:500;color:var(--muted);position:relative}
.bnav a .ic{height:30px;width:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;position:relative;transition:background .2s}
.bnav a.on{color:var(--brand-2);font-weight:700}
.bnav a.on .ic{background:var(--brand-l)}
.bnav .bd{position:absolute;top:0;left:6px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--gold,var(--bg-c8a24a,#c8a24a));color:var(--fg-1b1405,#1b1405);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.bnav .dt{position:absolute;top:3px;left:12px;width:8px;height:8px;border-radius:50%;background:var(--gold,var(--bg-c8a24a,#c8a24a))}
@media (min-width:760px){ .bnav{max-width:720px;margin:0 auto;left:0;right:0;border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0} }
@media (prefers-reduced-motion:reduce){ main > *, .sk{animation:none !important} }
@media print{ .bnav{display:none !important} }
</style>

<div id="app" class="hidden">

      <div class="top">
        <div class="ava" id="tbAva" aria-hidden="true"></div>
        <div class="who"><div id="tbSchool">—</div><div id="tbPeriod"></div></div>
        <a class="hb" href="index.html?home=1" aria-label="الصفحة الرئيسية" title="الصفحة الرئيسية"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></a>

    </div>
  </header>
  <main id="main"></main>
  <nav class="bnav" id="bnav" aria-label="التنقل"></nav>
</div>

<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
<script src="pwa.js"></script>
<script>
'use strict';
/* =========================================================================
   «يومي» — أول صفحة للمعلم في تطبيق إنجاز (ص-١٢). قراءة فقط.
   جدول اليوم مرتبًا: حصصه (الجدول المنشور) + الانتظار المُرسَل له + المناوبة + الإشراف بمكانه،
   وتحته تنبيهاته (تعاميم تحتاج توقيعه، زيارة صفية، مواعيد، تغيّر جدوله) + أزرار سريعة.
   المدير والوكيل: يفتح لهم التطبيق الصفحة الرئيسية كاملة (التحويل عند ?src=app)، ويمكنهم فتح «يومي» من «لوحتي».
   ========================================================================= */
const firebaseConfig = window.FB_CONFIG;
let db = null;
const WEEKDAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const ORD = ['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة'];
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arN = n=>String(n).replace(/\d/g, d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const dk = d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const wdOf = k=>new Date(k+'T12:00:00').getDay();
const addDays = (k,n)=>{ const d=new Date(k+'T12:00:00'); d.setDate(d.getDate()+n); return dk(d); };
const ordP = p=>ORD[p]||arN(p+1);
function hijriLong(k){ try{ return new Date(k+'T12:00:00').toLocaleDateString('ar-SA-u-ca-islamic-umalqura',{year:'numeric',month:'long',day:'numeric'}); }catch(e){ return k; } }
function hijriShort(k){ try{ return new Date(k+'T12:00:00').toLocaleDateString('ar-SA-u-ca-islamic-umalqura',{month:'long',day:'numeric'}); }catch(e){ return k; } }
const fmtTime = t=>{ if(!t || !/^\d{1,2}:\d{2}$/.test(t)) return t||''; const [h,m]=t.split(':').map(Number); const hh=((h+11)%12)+1; return arN(hh)+':'+arN(String(m).padStart(2,'0'))+(h>=12?' م':' ص'); };
function fatal(msg){
  const bv = $('#bootView'); bv.classList.remove('hidden','out'); bv.classList.add('err');
  bv.innerHTML = `<div class="card" style="max-width:460px;text-align:center"><h3 style="justify-content:center;margin-bottom:14px">${esc(msg)}</h3>
    <a class="btn pri" href="index.html?home=1">العودة للرئيسية</a></div>`;
}

const MD = { session:null, sid:null, me:null, role:'', ctx:null, period:'first', today:dk(new Date()) };
(function start(){
  let s=null; try{ s = JSON.parse(localStorage.getItem('cls_session')||'null'); }catch(e){}
  if(!s || !s.userId){ location.replace('index.html'); return; }
  if(s.role==='soloTeacher' || s.role==='admin' || !s.schoolId){ location.replace('index.html?home=1'); return; }
  MD.session = s; MD.sid = s.schoolId; MD.period = s.period || 'first';
  try{ firebase.initializeApp(firebaseConfig); db = firebase.firestore(); }
  catch(e){ fatal('تعذّر الاتصال بقاعدة البيانات.'); return; }
  firebase.auth().onAuthStateChanged(async au=>{
    if(!au){ try{ localStorage.removeItem('cls_session'); }catch(e){} location.replace('index.html'); return; }
    try{ await boot(au); }catch(e){ console.error(e); fatal('تعذّر تحميل يومك: '+(e.message||e)); }
  });
})();

async function boot(au){
  const us = await db.collection('users').doc(MD.session.userId).get();
  if(!us.exists || us.data().authUid !== au.uid){ await firebase.auth().signOut(); location.replace('index.html'); return; }
  const u = us.data();
  if(u.active===false){ fatal('حسابك موقوف.'); return; }
  MD.me = { id: us.id, name: u.username||MD.session.username||'' };
  if(u.role==='schoolAdmin'){
    if(!(u.adminSchools||[]).includes(MD.sid)){ fatal('لا يمكن الوصول لهذه المدرسة.'); return; }
    MD.role = 'schoolAdmin';
  } else {
    const ctx = (u.schools||{})[MD.sid];
    if(!ctx || ctx.active===false){ fatal('ليست لديك صلاحية الوصول لهذه المدرسة.'); return; }
    MD.ctx = ctx; MD.role = ctx.role||'';
  }
  // التطبيق يبدأ من هنا: المدير والوكيل تُفتح لهم الصفحة الرئيسية كاملة
  if(/[?&]src=app\b/.test(location.search) && (MD.role==='schoolAdmin' || MD.role==='agent')){ location.replace('index.html?home=1'); return; }
  try{ const sd = await db.collection('schoolData').doc(MD.sid).get(); $('#tbSchool').textContent = sd.exists ? (sd.data().name||MD.sid) : MD.sid; }catch(e){ $('#tbSchool').textContent = MD.sid; }
  const h = new Date().getHours();
  $('#hello').textContent = (h<12?'صباح الخير':'مساء الخير')+'، '+(MD.me.name.split(' ')[0]||'');
  $('#today').textContent = WEEKDAYS[wdOf(MD.today)]+' '+hijriLong(MD.today);
  $('#tbAva').textContent = window.InjazTheme ? InjazTheme.initials(MD.me.name) : MD.me.name.charAt(0);
  $('#tbPeriod').textContent = MD.period==='second' ? 'الفصل الثاني' : 'الفصل الأول';
  /* المظهر العام (الياسمين/الأساسي) كما اختاره الأدمن */
  try{ db.collection('settings').doc('appearance').onSnapshot(s=>{ if(window.InjazTheme) InjazTheme.applyRemote(s.exists ? (s.data().theme||'') : ''); }, ()=>{}); }catch(e){}
  $('#app').classList.remove('hidden');
  $('#bootView').classList.add('out'); setTimeout(()=>$('#bootView').classList.add('hidden'), 320);
  bottomNav(null);
  skeleton();
  if(window.InjazPWA) InjazPWA.init({ db, uid:MD.me.id, sid:MD.sid, role:MD.role });
  const data = await loadAll();
  render(data);
}

/* ---------- التحميل (كل مصدر مستقل؛ تعذّر أحدها لا يكسر الصفحة) ---------- */
const ttDoc = id=>db.collection('timetables').doc(MD.sid).collection('data').doc(id).get()
  .then(s=>{ if(!s.exists) return null; try{ return JSON.parse(s.data().value||'null'); }catch(e){ return null; } }).catch(()=>null);
function expandHolidays(list){
  const out = {};
  (list||[]).forEach(h=>{ if(!h || !h.from) return; const end = h.to && h.to>=h.from ? h.to : h.from; let k = h.from, g=0;
    while(k <= end && g++ < 400){ if(wdOf(k)<=4) out[k] = h.label||'إجازة'; k = addDays(k,1); } });
  return out;
}
async function loadAll(){
  const today = MD.today, tomorrow = addDays(today,1), me = MD.me.id;
  const D = { lessons:[], layouts:{}, published:false, sig:'', waits:[], duty:[], visits:[], circ:0, appts:[], holidays:{} };
  await Promise.all([
    db.collection('schoolCalendar').doc(MD.sid).get().then(s=>{ D.holidays = expandHolidays(s.exists ? s.data().holidays : []); }).catch(()=>{}),
    ttDoc(MD.period+'_published').then(p=>{
      if(!p) return; D.published = true; D.layouts = p.layouts||{};
      const mine = (p.byUser||{})[me]; if(mine){ D.lessons = mine.lessons||[]; D.sig = mine.sig||''; }
    }),
    Promise.all([today, tomorrow].map(k=>ttDoc(MD.period+'_wday_'+k).then(v=>{
      if(!v || !v.sent) return;
      (v.items||[]).filter(it=>it.subUid===me).forEach(it=>D.waits.push(Object.assign({ date:k }, it)));
    }))),
    db.collection('dutyPlans').where('members','array-contains',me).get().then(q=>{
      D.duty = q.docs.map(d=>d.data()).filter(v=>v.schoolId===MD.sid && v.period===MD.period && v.pub);
    }).catch(()=>{}),
    db.collection('classVisits').where('teacherId','==',me).get().then(q=>{
      const plan = q.docs.map(d=>d.data()).find(v=>v.kind==='plan' && v.schoolId===MD.sid && v.period===MD.period);
      if(plan) D.visits = [['الأولى',plan.v1],['الثانية',plan.v2]].filter(x=>x[1] && x[1].date).map(x=>Object.assign({ label:x[0] }, x[1]));
    }).catch(()=>{}),
    db.collection('circulars').doc(MD.sid).collection('items').where('recipients','array-contains',me).get().then(async q=>{
      let n = 0;
      await Promise.all(q.docs.map(async d=>{
        if(!d.data().mandatory) return;
        try{ const s = await d.ref.collection('signatures').doc(me).get(); if(!s.exists) n++; }catch(e){}
      }));
      D.circ = n;
    }).catch(()=>{}),
    db.collection('guidanceAppointments').where('byUserId','==',me).get().then(q=>{
      D.appts = q.docs.map(d=>d.data()).filter(a=>a.schoolId===MD.sid && a.date===today && a.status==='scheduled').sort((a,b)=>String(a.time).localeCompare(String(b.time)));
    }).catch(()=>{}),
  ]);
  // تغيّر الجدول منذ آخر اطّلاع («جدولي»)
  let seen = '';
  if(MD.role==='schoolAdmin'){ try{ seen = localStorage.getItem('injaz_schedSeen_'+me+'_'+MD.sid+'_'+MD.period) || ''; }catch(e){} }
  else seen = (((MD.ctx||{}).schedSeenSig)||{})[MD.period] || '';
  D.schedChanged = D.published && !!D.sig && D.sig !== seen;
  return D;
}

/* ---------- البناء (شكل فقط — نفس البيانات) ---------- */
const IC = (n, s, w)=> window.InjazTheme ? InjazTheme.icon(n, s||20, w) : '';
const toMin = t=>{ if(!t || !/^\d{1,2}:\d{2}$/.test(t)) return null; const [h,m]=t.split(':').map(Number); return h*60+m; };
const nowMin = ()=>{ const d=new Date(); return d.getHours()*60+d.getMinutes(); };
function dutyToday(D, k){
  const w = wdOf(k), out = { morning:false, sup:[] };
  D.duty.forEach(v=>{
    const pub = v.pub;
    if(((pub.dutyDays||{})[k]||[]).includes(MD.me.id)) out.morning = true;
    const evL = {}; (pub.events||[]).forEach(e=>evL[e.key]=e.label);
    const plL = {}; (pub.places||[]).forEach(p=>plL[p.id]=p.name);
    const byEv = (pub.sup||{})[w] || {};
    Object.keys(byEv).forEach(ev=>Object.keys(byEv[ev]||{}).forEach(pl=>{
      if((byEv[ev][pl]||[]).includes(MD.me.id)) out.sup.push({ stage:v.stage, ev, evLabel:evL[ev]||'', place:plL[pl]||'' });
    }));
  });
  return out;
}
/* يبني عناصر اليوم مرتبة (حصص/انتظار/فراغ/فسحة/إشراف/مناوبة) مع أوقات البداية والنهاية إن وُجدت */
function dayItems(D){
  const k = MD.today, w = wdOf(k);
  const L = D.lessons.filter(l=>l.d===w);
  const W = D.waits.filter(x=>x.date===k);
  const dt = dutyToday(D, k);
  const visitP = new Set(D.visits.filter(v=>v.date===k && v.p!=='' && v.p!=null).map(v=>+v.p));
  const stages = [...new Set(L.map(l=>l.st).concat(W.map(x=>x.st)).concat(dt.sup.map(s=>s.stage)))];
  const items = [];
  if(dt.morning) items.push({ kind:'duty', icon:'sun', whenTxt:'قبل الطابور', title:'المناوبة الصباحية', sub:'استقبال الطلاب صباحًا' });
  stages.forEach(sk=>{
    const lay = D.layouts[sk];
    const SL = L.filter(l=>l.st===sk), SW = W.filter(x=>x.st===sk), SS = dt.sup.filter(s=>s.stage===sk);
    if(stages.length>1) items.push({ kind:'stage', title:(lay&&lay.label)||sk });
    const at = {}; SL.forEach(l=>{ for(let i=0;i<(l.n||1);i++) at[l.p+i] = l; });
    const wAt = {}; SW.forEach(x=>wAt[x.p] = x);
    const cols = lay && lay.cols ? lay.cols : Array.from({ length: Math.max(0, ...SL.map(l=>l.p+(l.n||1)), ...SW.map(x=>x.p+1)) }, (_,p)=>({ k:'p', p, t:'' }));
    const ppd = lay && lay.ppd ? (+lay.ppd[w]||0) : 99;
    const startOf = i=> toMin(cols[i] && cols[i].t);
    const endOf = i=>{ for(let j=i+1;j<cols.length;j++){ const m = toMin(cols[j].t); if(m!=null) return m; } const s = startOf(i); return s!=null ? s+45 : null; };
    const colIdx = p=> cols.findIndex(c=>c.k==='p' && c.p===p);
    let after = 0;
    const lastBusy = Math.max(-1, ...Object.keys(at).map(Number), ...Object.keys(wAt).map(Number));
    cols.forEach((c, ci)=>{
      if(c.k!=='p'){
        const type = c.type==='prayer' ? 'prayer' : 'break';
        const key = type+'_'+after;
        const mine = SS.filter(s=>s.ev===key);
        if(mine.length) mine.forEach(s=>items.push({ kind:'sup', icon:type==='prayer'?'pray':'apple', whenTxt:c.t?fmtTime(c.t):'', start:startOf(ci), end:endOf(ci),
          title:'إشراف '+(s.evLabel||(type==='prayer'?'الصلاة':'الفسحة')), sub:'المكان: '+(s.place||'—') }));
        else if(after>0 && after<=lastBusy) items.push({ kind:'mark', whenTxt:c.t?fmtTime(c.t):'', title: type==='prayer'?'الصلاة':'الفسحة' });
        return;
      }
      after = c.p+1;
      if(c.p >= ppd) return;
      const l = at[c.p], x = wAt[c.p];
      const base = { p:c.p, whenB:ordP(c.p), whenTxt:c.t?fmtTime(c.t):'', start:startOf(ci) };
      if(l){
        if(l.p !== c.p) return;   // الحصة المزدوجة تُعرض مرة واحدة
        const lastI = colIdx(l.p+(l.n||1)-1);
        items.push(Object.assign(base, { kind:'lesson', end: endOf(lastI>=0?lastI:ci), title:l.s||'', sub:l.cl||l.c||'', dbl:(l.n||1)>1, visit:visitP.has(c.p) }));
      } else if(x){
        items.push(Object.assign(base, { kind:'wait', end:endOf(ci), title:'انتظار', sub:(x.clsLabel||x.cls||'')+(x.subj?' · '+x.subj:''), absent:x.absentName||'' }));
      } else if(c.p < lastBusy){
        items.push(Object.assign(base, { kind:'free', end:endOf(ci), title:'فراغ' }));
      }
    });
  });
  if(dt.morning) items.push({ kind:'duty', icon:'flag', whenTxt:'نهاية الدوام', title:'المناوبة بعد الدوام', sub:'حتى خروج آخر طالب' });
  // الحالة الزمنية
  const n = nowMin();
  items.forEach(it=>{ if(it.start!=null && it.end!=null){ it.state = n>=it.end ? 'done' : (n>=it.start ? 'now' : 'next'); } });
  return { items, L, W, dt };
}
function timelineHTML(items){
  const rows = items.filter(it=>it.kind!=='stage');
  let lastRow = -1; items.forEach((it,i)=>{ if(it.kind!=='mark' && it.kind!=='stage') lastRow = i; });
  return items.map((it, i)=>{
    if(it.kind==='stage') return `<li style="padding:0"><div class="stage-h">${esc(it.title)}</div></li>`;
    if(it.kind==='mark') return `<li class="mark"><span class="when">${esc(it.whenTxt)}</span><span class="ln"></span><span class="lb">${esc(it.title)}</span><span class="ln"></span></li>`;
    const cls = [it.kind==='lesson'?'':it.kind, it.state==='done'?'done':'', it.state==='now'?'now':'', i===lastRow?'last':''].filter(Boolean).join(' ');
    const when = it.icon ? `<div class="when"><span class="ico">${IC(it.icon,18)}</span><span>${esc(it.whenTxt)}</span></div>`
                         : `<div class="when"><b>${esc(it.whenB||'')}</b><span>${esc(it.whenTxt||'')}</span></div>`;
    const tags = [];
    if(it.state==='now') tags.push('<span class="tag now">الآن</span>');
    if(it.dbl) tags.push('<span class="tag dbl">مزدوجة</span>');
    if(it.visit) tags.push(`<span class="tag vis">${IC('eye',13,2)}زيارة صفية</span>`);
    if(it.kind==='wait' && it.absent) tags.push(`<span class="tag warn">بدلًا من ${esc(it.absent)}</span>`);
    return `<li class="${cls}">${when}<div class="rail" aria-hidden="true"><i></i><span class="dot"></span><i></i></div>
      <div class="what"><div class="h"><b>${esc(it.title)}</b>${tags.join('')}</div>${it.sub?`<span class="s">${esc(it.sub)}</span>`:''}</div></li>`;
  }).join('');
}
/* بطاقة «الآن» أو «التالي» */
function nowCard(items){
  const act = items.filter(it=>(it.kind==='lesson'||it.kind==='wait'||it.kind==='sup') && it.start!=null && it.end!=null);
  const cur = act.find(it=>it.state==='now'), nxt = act.find(it=>it.state==='next');
  const it = cur || nxt; if(!it) return '';
  const label = it.kind==='sup' ? '' : (it.whenB ? 'الحصة '+it.whenB : '');
  const pill = cur ? `<span class="pill${it.kind==='wait'?' warn':''}">الآن${label?' · '+esc(label):''}</span>` : `<span class="pill">التالي${label?' · '+esc(label):''}</span>`;
  const hm = m=>fmtTime(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));
  const meta = cur ? 'تنتهي '+hm(it.end) : 'تبدأ '+hm(it.start);
  const go = it.kind==='sup' ? '' : `<a class="btn pri" href="omr.html">${IC('omr',18,2)}تحضير</a>`;
  let prog = '';
  if(cur){
    const n = nowMin(), pct = Math.max(2, Math.min(100, Math.round((n-it.start)*100/Math.max(1,it.end-it.start))));
    prog = `<div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      <div class="prog-l"><span>${esc(hm(it.start))}</span><span>بقي ${arN(Math.max(0,it.end-n))} دقيقة</span><span>${esc(hm(it.end))}</span></div>`;
  } else {
    const left = it.start - nowMin();
    prog = `<div class="prog-l" style="justify-content:flex-start;margin-top:10px"><span>بعد ${arN(left)} دقيقة</span></div>`;
  }
  return `<section class="card now"><div class="row">${pill}<span class="meta">${esc(meta)}</span></div>
    <div class="main"><div><div class="t">${esc(it.title)}</div><div class="c">${esc(it.sub||'')}</div></div>${go}</div>${prog}</section>`;
}
function alertRows(D){
  const k = MD.today, out = [];
  const row = (icon, tone, title, sub, href)=> href
    ? `<a class="al" href="${esc(href)}"><span class="ai ${tone}">${IC(icon,20)}</span><span class="at"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</span><span class="go">${IC('chevL',18,2)}</span></a>`
    : `<div class="al"><span class="ai ${tone}">${IC(icon,20)}</span><span class="at"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</span></div>`;
  if(D.circ) out.push(row('sign','g', D.circ===1?'تعميم يحتاج توقيعك':arN(D.circ)+' تعاميم تحتاج توقيعك', 'اضغط للتوقيع', 'circulars.html'));
  D.waits.filter(x=>x.date!==k).forEach(x=>out.push(row('clock','w', 'انتظار غدًا — الحصة '+esc(ordP(x.p)), esc(x.clsLabel||x.cls||'')+(x.subj?' · '+esc(x.subj):'')+' · بدلًا من '+esc(x.absentName||''))));
  D.visits.filter(v=>v.date>=k && v.date<=addDays(k,7)).forEach(v=>out.push(row('eye','v',
    'الزيارة الصفية '+esc(v.label)+(v.date===k?' — اليوم':' — '+esc(WEEKDAYS[wdOf(v.date)])+' '+esc(hijriShort(v.date))),
    (v.p!==''&&v.p!=null?'الحصة '+esc(ordP(+v.p))+' · ':'')+esc(v.cls||'')+' · الزائر: مدير المدرسة')));
  const nextDuty = [];
  D.duty.forEach(v=>Object.keys(v.pub.dutyDays||{}).forEach(d=>{ if(d>k && d<=addDays(k,7) && (v.pub.dutyDays[d]||[]).includes(MD.me.id)) nextDuty.push(d); }));
  nextDuty.sort().slice(0,2).forEach(d=>out.push(row('shield','b', 'مناوبتك القادمة: '+esc(WEEKDAYS[wdOf(d)])+(d===addDays(k,1)?' (غدًا)':''), esc(hijriLong(d))+' · صباحًا وبعد الدوام')));
  if(D.appts.length) out.push(row('people','', D.appts.length===1?'موعد ولي أمر اليوم':arN(D.appts.length)+' مواعيد أولياء أمور اليوم',
    D.appts.map(a=>esc(fmtTime(a.time))+' — '+esc(a.name||'')).join('، ')));
  if(D.schedChanged) out.push(row('calCheck','', 'تغيّر جدولك', 'اضغط للاطّلاع على الجدول الجديد', 'myschedule.html'));
  return out;
}
function bottomNav(D){
  const it = (href, icon, label, extra, on)=>`<a href="${href}"${on?' class="on" aria-current="page"':''}><span class="ic">${IC(icon,21,on?1.9:1.8)}${extra||''}</span>${label}</a>`;
  $('#bnav').innerHTML =
    it('myday.html', 'sun', 'يومي', '', true) +
    it('omr.html', 'omr', 'التحضير') +
    it('circulars.html', 'mail', 'التعاميم', D && D.circ ? `<span class="bd">${arN(D.circ)}</span>` : '') +
    it('myschedule.html', 'cal', 'جدولي', D && D.schedChanged ? '<span class="dt"></span>' : '') +
    it('index.html?home=1&board=1', 'grid', 'لوحتي');
}
function skeleton(){
  const line = (w,h)=>`<div class="sk" style="width:${w};height:${h||10}px"></div>`;
  $('#main').innerHTML = `
    <section class="card" style="display:flex;flex-direction:column;gap:12px">${line('38%',16)}${line('62%',20)}${line('100%',6)}</section>
    <div class="stats"><div class="stat">${line('30%',18)}<div style="height:6px"></div>${line('70%')}</div><div class="stat">${line('30%',18)}<div style="height:6px"></div>${line('70%')}</div><div class="stat">${line('30%',18)}<div style="height:6px"></div>${line('70%')}</div></div>
    <section class="card" style="display:flex;flex-direction:column;gap:14px">${line('30%',14)}${line('100%',44)}${line('100%',44)}${line('100%',44)}</section>`;
}
function render(D){
  const k = MD.today, w = wdOf(k);
  const hol = D.holidays[k];
  let top = '';
  if(hol) top = `<div class="banner">${IC('beach',20)}<span>اليوم إجازة${hol!=='إجازة'?' — '+esc(hol):''}</span></div>`;
  else if(w>4) top = `<div class="banner">${IC('moon',20)}<span>لا دوام اليوم — إجازة نهاية الأسبوع</span></div>`;
  const off = !!(hol || w>4);
  const T = off ? { items:[], L:[], W:[] } : dayItems(D);
  const any = T.items.some(it=>it.kind!=='stage' && it.kind!=='mark');
  const al = alertRows(D);
  const nLessons = T.items.filter(it=>it.kind==='lesson').length;
  const stats = off ? '' : `<div class="stats">
      <div class="stat"><b>${arN(nLessons)}</b><span>حصص اليوم</span></div>
      <div class="stat${T.W.length?' w':''}"><b>${arN(T.W.length)}</b><span>انتظار</span></div>
      <div class="stat"><b>${arN(al.length)}</b><span>تنبيهات</span></div></div>`;
  const tlCard = off ? '' : `<section class="card"><h3>جدول اليوم</h3>${any ? `<ul class="tl">${timelineHTML(T.items)}</ul>` :
    `<div class="empty">${D.published?'لا حصص ولا تكليفات لك اليوم.':'لم يُنشر الجدول بعد لهذا الفصل الدراسي.'}</div>`}</section>`;
  const alCard = `<section class="card als"><div class="al-h"><h3>تنبيهاتك</h3></div>${al.length ? al.join('') : '<div class="empty">لا توجد تنبيهات جديدة.</div>'}</section>`;
  $('#main').innerHTML = top + (off ? '' : nowCard(T.items)) + stats + tlCard + alCard + notifCard();
  bottomNav(D);
  bindNotif();
  MD.lastData = D;
}
/* تحديث «الآن» والتقدّم كل دقيقة دون إعادة التحميل */
setInterval(()=>{ if(MD.lastData && !document.hidden && dk(new Date())===MD.today) render(MD.lastData); }, 60000);
window.addEventListener('injaz-push-changed', ()=>{ const c = document.getElementById('notifCard'); if(c){ c.outerHTML = notifCard() || '<div id="notifCard"></div>'; bindNotif(); } });
function notifCard(){
  if(!window.InjazPWA) return '';
  const st = InjazPWA.notifState(), standalone = InjazPWA.isStandalone();
  const btns = [];
  if(st==='default') btns.push(`<button class="btn pri" id="nOn">${IC('bell',18,2)}تفعيل الإشعارات</button>`);
  if(!standalone) btns.push(`<button class="btn" id="nInstall">${IC('phone',18,2)}تثبيت التطبيق</button>`);
  const MSG = {
    granted:'<b>الإشعارات مفعّلة على هذا الجهاز.</b>',
    denied:'<b>الإشعارات متوقفة على هذا الجهاز.</b> يمكنك تفعيلها من إعدادات المتصفح لهذا الموقع.',
    'ios-install-first':'<b>في الآيفون:</b> ثبّت التطبيق (مشاركة ← إضافة إلى الشاشة الرئيسية) ثم افتحه لتفعيل الإشعارات.',
    unsupported:'هذا المتصفح لا يدعم الإشعارات.'
  };
  const msg = MSG[st] || (btns.length ? 'فعّل الإشعارات ليصلك تنبيه فوري بحصص الانتظار والتعاميم والمناوبة والزيارات، وتذكير صباحي بيومك.' : '');
  if(!msg && !btns.length) return '<div id="notifCard"></div>';
  return `<section class="card" id="notifCard"><div class="nt"><span class="ai">${IC(st==='denied'?'bellOff':'bell',20)}</span>
    <div class="tx">${msg}${btns.length?`<div class="bt">${btns.join('')}</div>`:''}<div id="nErr"></div></div></div></section>`;
}
function bindNotif(){
  const on = $('#nOn');
  if(on) on.onclick = async()=>{ on.disabled = true; const r = await InjazPWA.enable(); if(r.ok){ /* يُحدَّث عبر حدث injaz-push-changed */ } else { on.disabled = false; $('#nErr').textContent = r.msg; } };
  const ins = $('#nInstall');
  if(ins) ins.onclick = ()=>InjazPWA.showBanner();
}
