<!DOCTYPE html>
<!-- إصدار: 2026-10-29.1 · الاختبار — وكيل الشؤون الطلابية: المرحلة ١ (الهيكل) + المرحلة ٢ (غياب الطلاب والأعذار والسلّم) + المرحلة ٣ (التحويلات) + المرحلة ٤ (المخالفات والحسم والسلوك والمواظبة) + المرحلة ٥ (اللجنة والإعانة والموافقات) (طبق الأصل من النموذج المعتمد) -->
<html lang="ar" dir="rtl">
<head>
<script src="fb-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>لوحة وكيل الشؤون الطلابية</title>
<meta name="theme-color" content="#3f6659">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: RTL dashboard — header, 6 stat cards (3x2 / 6x1), then two cards: curriculum list + daily follow-up tile grid */
:root{
  --bg:#f1f5f3; --surface:#ffffff; --fg:#1b2a25; --muted:#5b6d66; --line:#d8e3de;
  --brand:#3f6659; --brand-soft:#e2ede8; --brand-fg:#ffffff;
  --sum-bg:#f0f9f3; --ok:#2f7d4f; --ok-soft:#dff1e5; --warn:#a8650f; --warn-soft:#fbeed6; --bad:#b4412f; --bad-soft:#f9e1dc;
  --font:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a17; --surface:#1b2622; --fg:#e6efeb; --muted:#9bb0a8; --line:#2e3d37;
    --brand:#7fb5a2; --brand-soft:#243630; --brand-fg:#10201a;
    --sum-bg:#18271f; --ok:#6fcf97; --ok-soft:#1f3a2b; --warn:#e5ad5c; --warn-soft:#3b2f18; --bad:#ef8b78; --bad-soft:#3d221d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a17; --surface:#1b2622; --fg:#e6efeb; --muted:#9bb0a8; --line:#2e3d37;
  --brand:#7fb5a2; --brand-soft:#243630; --brand-fg:#10201a;
  --sum-bg:#18271f; --ok:#6fcf97; --ok-soft:#1f3a2b; --warn:#e5ad5c; --warn-soft:#3b2f18; --bad:#ef8b78; --bad-soft:#3d221d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{direction:rtl}
body{direction:rtl;text-align:right;
  background:var(--bg); color:var(--fg); font-family:var(--font); font-size:15px; line-height:1.6;
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mock{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.top h1{margin:0;font-size:24px;font-weight:800;text-wrap:balance}
.top .sub{color:var(--muted);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (min-width:760px){.stats{grid-template-columns:repeat(6,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .n{font-size:28px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;font-weight:700}
.stat .d{font-size:12px;color:var(--muted)}
.stat.bad .n{color:var(--bad)} .stat.warn .n{color:var(--warn)} .stat.ok .n{color:var(--ok)}

.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:760px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:17px;font-weight:800}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.list li:first-child{border-top:0}
.nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.nm small{display:block;color:var(--muted);font-size:12px}
.pill-no{background:var(--bad-soft);color:var(--bad);border-radius:99px;padding:2px 12px;font-size:12px;font-weight:700;white-space:nowrap}
button{font-family:inherit;font-size:inherit;color:inherit}
.btn{background:var(--brand-soft);color:var(--brand);border:0;border-radius:8px;padding:5px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.solid{background:var(--brand);color:var(--brand-fg)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.bar{height:10px;border-radius:99px;background:var(--brand-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .25s}
.prog{display:flex;align-items:center;gap:10px}
.prog b{font-variant-numeric:tabular-nums;white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{position:relative;min-height:72px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);text-align:right;cursor:pointer;font-weight:500;font-size:14px;line-height:1.4;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.tile:hover{border-color:var(--brand)}
.tile .mk{font-size:12px;color:var(--muted)}
.tile.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tile.done .mk{color:var(--ok);font-weight:700}
.tile.sel{outline:2px solid var(--brand);outline-offset:2px}
.tile.add{border-style:dashed;align-items:center;justify-content:center;color:var(--brand);font-weight:700}
.panel{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.panel strong{font-size:15px}
textarea,input[type=text]{width:100%;font-family:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
textarea{min-height:64px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov .box{background:var(--surface);color:var(--fg);border-radius:12px;max-width:440px;width:100%;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow:auto}
.doc{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.doc i{display:block;height:8px;border-radius:4px;background:var(--line)}
.doc .t{height:12px;width:55%;background:var(--muted);opacity:.5}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-weight:700;border-radius:999px;padding:7px 16px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{background:var(--brand-soft)}
nav.tabs button.active{background:var(--brand);color:var(--brand-fg)}
button.stat{font:inherit;color:inherit;text-align:right;cursor:pointer}
button.stat:hover{border-color:var(--brand)}
.pane[hidden]{display:none}
.tag{border-radius:99px;padding:2px 12px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--brand-soft);color:var(--brand)}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.ok{background:var(--ok-soft);color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.trow{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);scroll-margin-top:12px}
.trow.flash{outline:3px solid var(--brand)}
#dRows,#sRows{display:flex;flex-direction:column;gap:10px}
.trow .nm{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-weight:800}
.trow .nm small{display:inline;font-weight:500}
.trow.abs{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;opacity:.75;background:var(--bg)}
.btns{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:6px}
@media (max-width:700px){.btns{grid-template-columns:repeat(2,minmax(0,1fr))}.btns .tg:last-child:nth-child(odd){grid-column:1/-1}}
.tg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1.5px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;padding:7px 6px;min-height:50px;text-align:center;line-height:1.3;font-weight:700;font-size:13px;cursor:pointer}
.tg .s{font-size:11px;font-weight:500}
.tg:hover{border-color:var(--brand)}
.tg.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tg.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tg.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.tg.dis,.tg:disabled{opacity:.5;cursor:default;border-style:dashed;background:var(--bg);border-color:var(--line);color:var(--muted)}
.sums{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:6px;padding:11px;border:2px solid var(--brand);border-radius:12px;background:var(--brand-soft)}
.sums::before{content:attr(data-t);grid-column:1/-1;color:var(--brand);font-weight:800;font-size:14px}
@media (max-width:700px){.sums{grid-template-columns:repeat(2,minmax(0,1fr))}.sums .sm:last-child:nth-child(odd){grid-column:1/-1}}
.sm{border:0;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--brand);color:var(--brand-fg);border-radius:8px;padding:6px 4px;min-height:56px;text-align:center;font-size:13px;font-weight:700;line-height:1.3}
.sm b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.sm.sel{outline:3px solid var(--fg);outline-offset:2px}
.nl{border:2px dashed var(--brand);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.nl[hidden]{display:none}
.nl strong{color:var(--brand)}
.nl .names{display:flex;flex-wrap:wrap;gap:6px}
.nmb{border:0;background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:4px 14px;font-weight:700;cursor:pointer}
.dp{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:8px}
.dp .t{font-weight:800;font-size:14px}
#vForm.fromTr{background:#fff1df;border-color:#e08a2e;box-shadow:0 0 0 2px #f3b778 inset}#vForm.fromTr #vTr{color:#8a4b08;font-weight:700}#vForm.fromTr #vQ,#vForm.fromTr #vSg{display:none}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kd{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 14px;font-weight:700;font-size:13px;cursor:pointer}
.kd.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pc{border:1.5px solid var(--ok);background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:4px 12px;font-weight:700;font-size:13px;cursor:pointer}
.pc.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.dp .sub2{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.seg{display:inline-flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;border-radius:99px;padding:3px 14px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-fg)}
.tag{border-radius:99px;padding:2px 12px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--brand-soft);color:var(--brand)}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.ok{background:var(--ok-soft);color:var(--ok)}
.dp label{font-size:13px;color:var(--muted)}
.dp select,.dp input[type=date],.dp input[type=time]{font-family:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);max-width:100%}
.dp textarea{min-height:48px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fgrid>div{display:flex;flex-direction:column;gap:3px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.rep{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.rep th,table.rep td{padding:9px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
table.rep thead th{background:var(--brand-soft);color:var(--brand);border-top:0;font-size:13px}
table.rep td.num,table.rep th.num{text-align:center;font-variant-numeric:tabular-nums}
table.rep td.hi{color:var(--bad);font-weight:800}
table.rep tfoot td{font-weight:800;background:var(--bg)}
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.demo input[type=range]{flex:1;min-width:140px;accent-color:var(--brand)}
.rtitle{font-size:16px;font-weight:800;text-wrap:balance}
.hd2{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.nl .names{display:flex;flex-wrap:wrap;gap:8px}
.nrow{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 4px}
.nrow .btn{padding:2px 12px;font-size:13px}
.okmsg{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px}
.letter{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.8;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0}
.lt{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
#lRows{display:flex;flex-direction:column;gap:10px}
.lh{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:var(--brand-soft);color:var(--brand);padding:12px;cursor:pointer;text-align:right;font-family:inherit;font-size:15px}
.lhn{display:flex;flex-direction:column;font-weight:800;min-width:0}
.lhn small{font-weight:500;color:var(--fg);opacity:.85;font-size:12px}
.lb{padding:4px 12px 12px}
.lrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px dashed var(--line)}
.lrow:first-child{border-top:0}
.l1,.l2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.l1 .grow{flex:1;font-weight:700}
.l2 .muted{font-size:12px}
.btn:disabled{opacity:.55;cursor:default}
.trow.uns{border-color:var(--bad);border-width:2px}

.ov[hidden]{display:none}
.ov .box textarea{min-height:90px}
.ov .box .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.ov .box .kv b{color:var(--muted);font-weight:700}

.lhn small .redw{color:var(--bad);font-weight:800;opacity:1}
.hud{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:16px}
.hud img{border-radius:12px;background:#fff;padding:4px;width:150px;height:150px}
.hud>div{text-align:center}
.hud strong{font-size:18px;color:var(--brand)}
.stat .src{color:var(--brand);font-weight:700}
.hud2{align-items:center;text-align:center;padding:12px 8px}
.hud2 img{background:#fff;border-radius:12px;padding:4px;margin:auto;width:100%;max-width:170px;height:auto;aspect-ratio:1}
.ci.sel{width:auto;max-width:100%}
.ci{width:76px;font-family:inherit;font-size:14px;text-align:center;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-variant-numeric:tabular-nums}
.dp[hidden],#mRep[hidden],#mList[hidden]{display:none}
.row[hidden],.seg[hidden],.dp[hidden],.muted[hidden]{display:none}
.rc{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.rc>.rtitle{margin-bottom:10px}
.rc>.rtitle:first-child,.rc>.hd2:first-child{margin-top:0}
.okw{color:var(--ok);font-weight:800}
.stat .hi{background:#fff;border-radius:6px;padding:1px;vertical-align:middle}
.lnk{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.lk{display:flex;flex-direction:column;gap:4px;text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.lk:hover{border-color:var(--brand)}
.lk b{font-size:15px;color:var(--brand)}
.lk span{font-size:12px;color:var(--muted)}
.lk em{font-style:normal;font-size:12px;font-weight:700;color:var(--brand)}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.sw input{position:absolute;opacity:0}
.sw .knob{width:44px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw .knob::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+.knob{background:var(--ok)}
.sw input:checked+.knob::after{transform:translateX(-20px)}
.sw input:focus-visible+.knob{outline:2px solid var(--brand);outline-offset:2px}
.hud[hidden]{display:none}
.drow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:6px}
.drow input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand)}
.drow .dl{min-width:92px;font-weight:700}
.dp[hidden]{display:none}
.lst{white-space:normal;min-width:240px;max-width:340px}
.srow{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.subs{margin:8px 0}
.r1{flex-wrap:nowrap}.r1 .btn{padding:6px 9px;font-size:13px}
details summary{cursor:pointer}
.sp[hidden]{display:none}
#vRes .btn{white-space:normal}
.srow{border-top:3px solid var(--line);margin-top:4px;padding-top:10px}
.trow,.rpc{border:2px solid var(--fg)}
.srow .st{font-weight:800;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}.kv dt{color:var(--muted);font-weight:700}.kv dd{margin:0}
.pickb{width:100%;text-align:right;font-family:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.vwl{display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto;font-size:14px}
.vwh{font-weight:800;padding:6px 10px;border-radius:8px;margin-top:8px;background:var(--brand-soft);color:var(--brand);display:flex;justify-content:space-between}
.vwh.d3,.vwh.d4,.vwh.d5{background:var(--bad-soft);color:var(--bad)}.vwh.d2{background:var(--warn-soft);color:var(--warn)}
.vwi{text-align:right;font-family:inherit;font-size:14px;background:transparent;border:0;border-right:4px solid var(--brand);padding:6px 10px;cursor:pointer;color:var(--fg);border-radius:0 6px 6px 0}
.vwi.d2{border-right-color:var(--warn)}.vwi.d3,.vwi.d4,.vwi.d5{border-right-color:var(--bad)}.vwi:hover{background:var(--bg)}
.rpc{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px}
.rpc summary{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;list-style:none}.rpc summary::-webkit-details-marker{display:none}
.rpc .rpn{font-size:13px;color:var(--muted);white-space:nowrap}.rpc[open] summary{border-bottom:3px solid var(--line);padding-bottom:8px;margin-bottom:8px}

<script>
const ST_MARKUP = document.getElementById('stTpl').innerHTML;
/* وكيل الشؤون الطلابية — المرحلة ١ (البطاقات) والمرحلة ٢ (غياب الطلاب):
   البطاقات الثلاث الأولى من سجلي الغياب والاستئذان الموجودين (attendance, leaves) لليوم والفترة الحالية.
   الصلاحية: tools.agentStudents (الوصول = اطّلاع، التعديل = كتابة). المدير يفتحها للاطّلاع (حق للمدير لا صلاحية). */
Dash.boot({
  title:'وكيل الشؤون الطلابية', bare:true,
  allow:(u,ctx,sid,isSA)=>{
    if(isSA) return true;
    const p = ctx && ctx.permissions && ctx.permissions['tools.agentStudents'];
    return (p && (p.access || p.edit)) ? true : 'هذه الصفحة لصاحب صلاحية «وكيل الشؤون الطلابية» أو لمدير المدرسة.';
  },
  render: async env=>{
    const {db, sid, period} = env;
    env.main.innerHTML = ST_MARKUP;
    /* ---- الوصول السريع (أول تبويب): يُركَّب فورًا قبل تحميل البيانات حتى لا يظهر الشكل القديم ثم يتبدّل ---- */
    try{
      let q = null; const G = (t,sub)=>()=>q && q.go(t,sub);
      q = QA.bind({ style:'head', stats:'.stats', cards:()=>{
        const trNew = TR.filter(r=>r.st==='new').length, noDed = VL.filter(v=>!DD.some(d=>d.id===v.id)).length;
        const hrWait = HR.filter(h=>h.st==='pending').length, dueN = [...AB.values()].filter(due).length;
        const bus = [...APR.keys()].filter(k=>k.indexOf('bus__')===0).length;
        return [
          {t:'الحضور والانضباط', n:TODAY.length, l:'غائبون اليوم', go:G('a')},
          {t:'غياب الطلاب', n:AB.size, p:dueN, l:'إجراءات مستحقة', go:G('g'), tabs:[['غياب الطلاب',G('g','.subs[data-grp="g"] [data-s="a"]')],['إشعار ولي الأمر',G('g','.subs[data-grp="g"] [data-s="n"]')],['قرارات الغياب',G('g','.subs[data-grp="g"] [data-s="d"]')]]},
          {t:'التحويلات', n:TR.length, p:trNew, l:'جديدة', go:G('r'), tabs:[['جديد',G('r','#rSeg [data-f="new"]')],['تحت الملاحظة',G('r','#rSeg [data-f="obs"]')],['إحالات للتوجيه',G('r','#rSeg [data-f="ref"]')],['منتهٍ',G('r','#rSeg [data-f="done"]')]]},
          {t:'المخالفات السلوكية', n:VL.length, p:noDed, l:'بلا حسم', go:G('v'), tabs:[['سجل المخالفات',G('v','.subs[data-grp="v"] [data-s="v"]')],['حسم السلوك',G('v','.subs[data-grp="v"] [data-s="b"]')],['تقارير',G('v','.subs[data-grp="v"] [data-s="t"]')]]},
          {t:'السلوك والمواظبة', n:RO.length, l:'طالبًا', go:G('k')},
          {t:'التوجيه الطلابي', n:HR.length+CMR.length, p:hrWait, l:'بانتظار المدير', go:G('l'), tabs:[['لجنة التوجيه والإرشاد',G('l','.subs[data-grp="l"] [data-s="c"]')],['حالات عالية الخطورة',G('l','.subs[data-grp="l"] [data-s="h"]')]]},
          {t:'الإعانة والمكافأة', n:AIDS.length, l:'مسجّلة', go:G('e')},
          {t:'موافقات أولياء الأمور', n:RO.length, p:Math.max(0,RO.length-bus), l:'لم تصل (النقل)', go:G('p'), tabs:[['النقل المدرسي',G('p','#pSeg [data-k="bus"]')],['المشاركة في نشاط',G('p','#pSeg [data-k="act"]')]]}
        ]; } });
    }catch(e){ console.warn('QA', e); }
    const $ = s=>document.querySelector(s);
    const A = n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
    const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const toast = m=>{ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2600); };
    let dt=''; try{ dt=new Date().toLocaleDateString('ar-SA-u-ca-islamic-umalqura',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }catch(e){ dt=new Date().toLocaleDateString('ar'); }
    $('#today').textContent = dt; $('#aDate').textContent = dt; $('#gDate').textContent = dt;
    $('#back').onclick = ()=>location.href='index.html';

    /* ---- الأقسام ---- */
    $('#tabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
      document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));
      document.querySelectorAll('.pane').forEach(p=>p.hidden = p.id!=='p-'+b.dataset.t); });

    /* ---- الحضور والانضباط: روابط للصفحات المنفذة في الموقع ---- */
    const LN = [
      ['غياب الطلاب اليومي','تسجيل الغياب وأعذاره','صفحة الحضور','index.html?tab=absence'],
      ['التأخر الصباحي','كشف المتأخرين صباحًا','صفحة التأخر','index.html?tab=absence'],
      ['استئذان الطلاب','الخروج أثناء الدوام','صفحة الاستئذان','index.html?tab=classes'],
      ['حالات الطلاب','الحالات المرضية وإبلاغ الحالة','صفحة الحالات','index.html?tab=studentStatus'],
      ['الأندية والأنشطة','التكليفات والاعتماد والحضور','منصة النشاط','activity.html']
    ];
    $('#lnks').innerHTML = LN.map(x=>'<button type="button" class="lk" data-h="'+esc(x[3])+'"><b>'+x[0]+'</b><span>'+x[1]+'</span><em>يُفتح من الموقع ←</em></button>').join('');
    $('#lnks').addEventListener('click', e=>{ const b=e.target.closest('[data-h]'); if(b) location.href = b.dataset.h; });

    /* ---- بطاقات اليوم من الموقع (غياب، تأخر، استئذان) ---- */
    const dk = (()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); })();
    try{
      const [att, lv] = await Promise.all([
        db.collection('attendance').where('schoolId','==',sid).where('date','==',dk).get(),
        db.collection('leaves').where('schoolId','==',sid).where('date','==',dk).get()
      ]);
      const rows = att.docs.map(d=>d.data()).filter(a=>!a.period || a.period===period);
      const seats = st=>new Set(rows.filter(a=>a.status===st).map(a=>String(a.seat))).size;
      $('#s1').textContent = A(seats('absent'));
      $('#s2').textContent = A(seats('late'));
      $('#s3').textContent = A(new Set(lv.docs.map(d=>d.data()).filter(l=>!l.period || l.period===period).map(l=>String(l.seat))).size);
    }catch(e){ console.error(e); toast('تعذّر تحميل أرقام اليوم'); }

    /* =====================================================================
       المرحلة ٢ — غياب الطلاب والأعذار والسلّم وإشعار ولي الأمر وقرارات الغياب
       البيانات:
         studentAffairs/{sid}/absence/{period}__{seat}   أعذار الطالب وسجل إجراءاته وحالة قراره (مستند لكل طالب في كل فصل)
         studentAffairs/{sid}/notices/{period}__{seat}__{date}   توثيق إشعار ولي الأمر بغياب اليوم
         مرفقات الأعذار: studentAffairs/{sid}/excuses/{period}__{seat}/{ملف} في التخزين (أقل من ٥٠٠ كيلوبايت)
       مصدر أيام الغياب: attendance (حالة غائب) للفصل الحالي، ولا يُعدَّل. كل يوم «بدون عذر» ما لم يُسجَّل له عذر. */
    const perm = (env.ctx && env.ctx.permissions && env.ctx.permissions['tools.agentStudents']) || {};
    const canEdit = !env.isSA && !!perm.edit, canApprove = !!env.isSA;
    const base = db.collection('studentAffairs').doc(sid), abCol = base.collection('absence'), ntCol = base.collection('notices');
    const abId = seat=>period+'__'+seat;
    const fail = e=>{ console.error(e); toast('تعذّر الحفظ: '+(e && e.message ? e.message : e)); };
    const hij = k=>{ try{ const o={}; new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(k+'T12:00:00')).forEach(x=>o[x.type]=x.value); return A(o.year+'/'+o.month+'/'+o.day); }catch(e){ return A(k.replace(/-/g,'/')); } };
    const LV = [
      {d:3,k:'تحويل واستدعاء',v:'حوّل الطالب للموجه، واستدعى ولي الأمر وأخذ التعهد الخطي',g:['حضر ووقّع التعهد','لم يحضر أو رفض (يُوثَّق)']},
      {d:5,k:'إحالة للجنة',v:'استدعى ولي الأمر وأحال الطالب للجنة التوجيه واجتمع لمراجعة الخطة',g:['حضر ولي الأمر','لم يحضر بعد']},
      {d:10,k:'مخاطبة الجهات',v:'خاطب جهات الاختصاص (حماية الطفل) وأشعر إدارة التعليم',g:['خوطبت الجهات','لم تُخاطب بعد']}
    ];
    const ETYPES = ['إجازة مرضية (منصة صحتي)','مراجعة مستشفى','كوارث وظروف قاهرة','وفاة قريب حتى الدرجة الثالثة','مرافقة صحية لقريب','مراجعة جهة رسمية','مرافقة قريب من الدرجة الأولى لجهة رسمية','مشاركة في مسابقة','ظروف صحية أخرى (تقرير طبي)','ما تقرره أنظمة حماية الطفل','أخرى'];
    const MAXF = 512000, OKF = /^(application\/pdf|image\/(jpeg|png|webp))$/;
    let AB = new Map();          // seat -> {seat,name,cls,dates:[],doc:{excuses,actions,moved,decision}}
    let NT = new Map();          // seat -> إشعار اليوم
    let TODAY = [];              // طلاب غابوا اليوم
    const ensure = (seat,name,cls)=>{ if(!AB.has(seat)) AB.set(seat,{seat,name:name||'',cls:cls||'',dates:[],doc:{excuses:[],actions:[],moved:false}}); const s=AB.get(seat); if(name&&!s.name) s.name=name; if(cls&&!s.cls) s.cls=cls; return s; };
    const exMap = s=>{ const m={}; (s.doc.excuses||[]).forEach(e=>(e.dates||[]).forEach(d=>m[d]=e)); return m; };
    const un = s=>{ const m=exMap(s); return s.dates.filter(d=>!m[d]).length; };
    const exn = s=>s.dates.length-un(s);
    const nxt = s=>(s.doc.actions||[]).length;
    const due = s=>!s.doc.moved && nxt(s)<LV.length && un(s)>=LV[nxt(s)].d;
    const sOf = seat=>AB.get(seat);
    async function loadAbs(){
      AB = new Map(); NT = new Map(); TODAY = [];
      const [at, ab, nt] = await Promise.all([
        db.collection('attendance').where('schoolId','==',sid).get(),
        abCol.where('period','==',period).get().catch(()=>({docs:[]})),
        ntCol.where('date','==',dk).get().catch(()=>({docs:[]}))
      ]);
      const seen = new Set();
      at.docs.map(d=>d.data()).filter(a=>a.period===period && a.status==='absent' && a.date).forEach(a=>{
        const seat=String(a.seat), key=seat+'|'+a.date; if(seen.has(key)) return; seen.add(key);
        const s = ensure(seat,a.name,a.className||a.classCode); s.dates.push(a.date);
        if(a.date===dk) TODAY.push(seat);
      });
      AB.forEach(s=>s.dates.sort());
      ab.docs.forEach(d=>{ const x=d.data(); const s=ensure(String(x.seat),x.name,x.className);
        s.doc = { excuses:x.excuses||[], actions:x.actions||[], moved:!!x.moved, decision:x.decision||null }; });
      nt.docs.forEach(d=>{ const x=d.data(); NT.set(String(x.seat),x); });
    }
    async function saveDoc(s, extra){
      const rec = Object.assign({ period, seat:s.seat, name:s.name, className:s.cls, excuses:s.doc.excuses||[], actions:s.doc.actions||[], moved:!!s.doc.moved, updatedAt:Date.now() }, extra||{});
      await abCol.doc(abId(s.seat)).set(rec,{merge:true});
    }
    /* بطاقة الطالب: قابلة للانكماش وافتراضها منكمش (قاعدة دائمة)، وتحفظ حالة الفتح عند إعادة الرسم */
    const OPENV = new Set();
    document.addEventListener('toggle', e=>{ const d=e.target; if(d && d.classList && d.classList.contains('vc')){ if(d.open) OPENV.add(d.dataset.vk); else OPENV.delete(d.dataset.vk); } }, true);
    const tfold = (key,nm,tags,inner,cls)=>'<details class="trow vc'+(cls?' '+cls:'')+'" data-vk="'+esc(key)+'"'+((OPENV.has(key)||window.__saOpenAll)?' open':'')+'><summary><div class="nm">'+nm+'</div>'+(tags?'<div class="row">'+tags+'</div>':'')+'</summary><div class="vcb">'+inner+'</div></details>';
    const card = (s,tags,inner)=>tfold('t|'+s.name+'|'+s.cls, esc(s.name)+'<small>'+esc(s.cls)+'</small>', tags, inner);
    function stats(){
      $('#s4').textContent = A([...AB.values()].filter(due).length);
      $('#s6').textContent = A([...AB.values()].filter(s=>s.doc.moved && s.doc.decision && s.doc.decision.st==='wait').length);
    }

    const nCol = db.collection('notes');
    const RSM = {new:['جديد','bad'],obs:['تحت الملاحظة','warn'],ref:['محال للتوجيه','warn'],done:['منتهٍ','ok']};
    let TR = [], rF = 'new';
    const trFile = seat=>{ const rs=TR.filter(r=>r.seat===seat && !trConv(r)); return rs.some(r=>r.st==='new')?'new':rs.some(r=>r.st==='ref')?'ref':rs.some(r=>r.st==='obs')?'obs':'done'; };

    /* «تحويل لمخالفة»: يظهر للوكيل في تحويلات «مشاغبة» و«أخرى»، ويفتح نموذج المخالفة بالطالب وتاريخ التحويل */

    /* ---- حالات اللجنة ---- */
    function cases(){
      const out = [];
      VL.filter(v=>v.period===period && v.cm).forEach(v=>out.push({key:'v_'+v.id, seat:v.seat, name:v.name, cls:v.className, why:v.w+' (الدرجة '+DEGN[v.d]+')'}));
      AB.forEach(s=>{ const a=(s.doc.actions||[]).find(x=>x.k===1); if(a) out.push({key:'a_'+s.seat, seat:s.seat, name:s.name, cls:s.cls, why:'غياب '+A(a.n||5)+' أيام بدون عذر'}); });
      CMR.filter(r=>r.period===period && !out.some(o=>String(o.seat)===String(r.seat))).forEach(r=>out.push({key:'r_'+r.seat, seat:String(r.seat), name:r.name, cls:r.className, why:(r.why||'إحالة من الموجه الطلابي')+' (إحالة الموجه الطلابي)'}));

          else {
            const sg = MSIG.get(m.id)||{}, pr = (m.content.members||[]).filter(x=>x.present), done = pr.filter(x=>sg[x.id]).length, all = done===pr.length;

            else { st='<span class="tag warn">المحضر بانتظار التوقيع واعتماد الوكيل</span>'; if(canEdit && !env.isSA) act='<button type="button" class="btn solid" data-aa="'+m.id+'"'+(all?'':' disabled')+'>اعتماد الوكيل للمحضر</button>'+(all?'':'<span class="muted">يُفعَّل بعد اكتمال توقيع الأعضاء الحاضرين</span>'); else if(env.isSA) act='<span class="muted">بانتظار توقيع الأعضاء واعتماد الوكيل ثم اعتمادك</span>'; }

    /* نافذة المحضر */
    let mnCur = null;

    const nowT = ()=>{ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
    let hEdit = null;
    function hReset(){ hEdit=null; hSel=null; hBoxDraw(); $('#hD').value=''; $('#hTy').value=''; $('#hOb').value=env.me.name||''; $('#hOd').value=dk; $('#hOt').value=nowT();
      document.querySelectorAll('[data-hk]').forEach(c=>c.checked=false); $('#hAdd').textContent='رفع التقرير للمدير'; $('#hCancel').hidden=true; $('#hForm .t').textContent='تقرير جديد'; }
    hReset();
    const HST = {pending:['بانتظار اعتماد المدير','warn'], approved:['اعتمد المدير','ok'], returned:['أُعيد للتعديل','bad'], rejected:['رفضه المدير','bad']};
    function hRender(){
      const L = HR.filter(x=>x.period===period); $('#hCnt').textContent = A(L.length)+' تقارير'; $('#hForm').hidden = !canEdit;
      const seats = [...new Set(L.map(x=>x.seat))];
      $('#hRows').innerHTML = seats.map(seat=>{ const hs = L.filter(x=>x.seat===seat).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)), f = hs[0];
        return vcard(f.name, f.className, '<span class="tag cnr">'+cnt(hs.length,'تقرير واحد','تقريران','تقارير')+'</span>', hs.map(x=>{ const st = HST[x.st]||HST.pending, mine = env.isSA;
          return vrow((x.type?'<b>'+esc(x.type)+'</b>':'')+'<div>'+esc(x.desc)+'</div><div class="muted">الراصد: '+esc(x.observer||x.createdByName||'')+(x.obsDate?' · '+A(hijL(x.obsDate))+' هـ':'')+(x.obsTime?' · '+timeTxt(x.obsTime):'')+'</div>'
            +'<div class="row"><span class="tag '+st[1]+'">'+st[0]+'</span><span class="tag">'+cnt((x.checks||[]).length,'إجراء واحد','إجراءان','إجراءات')+'</span>'+(x.st==='approved'&&x.approvedByName?'<span class="muted">'+esc(x.approvedByName)+'</span>':'')+(x.handledAt?'<span class="tag ok">عالجها الموجه الطلابي'+(x.handledByName?' — '+esc(x.handledByName):'')+'</span>':'')+'</div>'
            +(x.st==='returned'&&x.returnNote?'<div class="muted">سبب الإعادة: '+esc(x.returnNote)+'</div>':'')
            +'<div class="row">'+(x.st==='pending'&&mine?'<button type="button" class="btn solid" data-ho="'+x.id+'">اعتماد</button>':'')
              +((x.st==='pending'||x.st==='approved')&&mine?'<input type="text" class="ci" data-hrn="'+x.id+'" placeholder="سبب الإعادة للتعديل (اختياري)" style="width:210px;text-align:right"><button type="button" class="btn" data-hrt="'+x.id+'">إعادة للتعديل</button>':'')
              +(x.st==='returned'&&canEdit?'<button type="button" class="btn solid" data-hed="'+x.id+'">تعديل التقرير</button>':'')+'</div>'
            +(typeof SAF!=='undefined'?SAF.hrBtn(x):'')+
            ((x.checks||[]).length?'<details><summary class="muted">الإجراءات المتخذة</summary><ul style="margin:6px 0">'+x.checks.map(i=>'<li>'+esc(HCK[i]||'')+'</li>').join('')+'</ul></details>':'')); }).join('')); }).join('') || '<div class="muted">لا تقارير.</div>';
    }
    $('#hAdd').onclick = async ()=>{
      const d = $('#hD').value.trim(), ty = $('#hTy').value, ob = $('#hOb').value.trim(), od = $('#hOd').value, ot = $('#hOt').value; if(!canEdit) return;
      if(!hSel){ toast('اختر الطالب'); return; } if(!ty){ toast('اختر نوع الحالة'); return; } if(!d){ toast('اكتب وصف الحالة'); return; }
      if(!ob){ toast('اكتب اسم راصد الحالة'); return; } if(!od || !ot){ toast('حدد تاريخ الرصد ووقته'); return; }
      const ck = [...document.querySelectorAll('[data-hk]')].filter(c=>c.checked).map(c=>+c.dataset.hk), now = Date.now();
      const body = {seat:hSel.seat, name:hSel.name, className:hSel.cls, type:ty, desc:d, observer:ob, obsDate:od, obsTime:ot, checks:ck};
      try{
        if(hEdit){
          const x = HR.find(y=>y.id===hEdit); const upd = Object.assign({}, body, {st:'pending', returnNote:'', resubmittedAt:now, updatedAt:now, updatedBy:env.me.id});
          await hrCol.doc(hEdit).update(upd); Object.assign(x, upd); toast('أُعيد رفع التقرير للمدير');
        }else{
          const ref = hrCol.doc(), rec = Object.assign({period, st:'pending', createdAt:now, createdBy:env.me.id, createdByName:env.me.name}, body);
          await ref.set(rec); HR.push(Object.assign({id:ref.id}, rec)); toast('رُفع التقرير للمدير');
        }
      }catch(er){ fail(er); return; }
      hReset(); hRender();
    };
    $('#hCancel').onclick = ()=>hReset();
    $('#hRows').addEventListener('click', async e=>{
      const ok = e.target.closest('[data-ho]'), rt = e.target.closest('[data-hrt]'), ed = e.target.closest('[data-hed]'), now = Date.now();
      if(ed && canEdit){ const x = HR.find(y=>y.id===ed.dataset.hed); if(!x) return;
        hEdit = x.id; hSel = RO.find(s=>s.seat===x.seat) || {seat:x.seat, name:x.name, cls:x.className}; hBoxDraw(); $('#hTy').value = x.type||''; $('#hD').value = x.desc||''; $('#hOb').value = x.observer||x.createdByName||''; $('#hOd').value = x.obsDate||dk; $('#hOt').value = x.obsTime||nowT();
        document.querySelectorAll('[data-hk]').forEach(c=>c.checked = (x.checks||[]).includes(+c.dataset.hk)); $('#hAdd').textContent='إعادة رفع التقرير للمدير'; $('#hCancel').hidden=false; $('#hForm .t').textContent='تعديل التقرير المُعاد'; $('#hForm').scrollIntoView({block:'center'}); return; }
      if(!env.isSA) return;
      if(ok){ const x = HR.find(y=>y.id===ok.dataset.ho); if(!x) return;
        try{ await hrCol.doc(x.id).update({st:'approved', approvedAt:now, approvedBy:env.me.id, approvedByName:env.me.name}); }catch(er){ fail(er); return; }
        x.st='approved'; x.approvedByName=env.me.name; hRender(); toast('اعتُمد التقرير'); return; }
      if(rt){ const x = HR.find(y=>y.id===rt.dataset.hrt); if(!x) return; const note = (document.querySelector('[data-hrn="'+x.id+'"]')||{}).value||'';
        const upd = {st:'returned', returnedAt:now, returnedBy:env.me.id, returnedByName:env.me.name, returnNote:note.trim(), approvedAt:null, approvedBy:null, approvedByName:null};
        try{ await hrCol.doc(x.id).update(upd); }catch(er){ fail(er); return; }
        Object.assign(x, upd); hRender(); toast('أُعيد التقرير للوكيل للتعديل'); }
    });

    /* ---- الإعانة والمكافأة (مغلقة افتراضيًا) ---- */
    function eRender(){
      const eMine = canEdit && AIDOWN==='agent';
      $('#eOn').checked = AIDON; $('#eOn').disabled = !canEdit; $('#eLab').textContent = AIDON?'مفتوحة':'مغلقة'; $('#eOff').hidden = AIDON; $('#eOnBox').hidden = !AIDON; $('#eForm').hidden = !eMine;
      $('#eOwn').value = AIDOWN; $('#eOwn').disabled = !(canEdit || canApprove);
      $('#eNote').hidden = !(AIDON && AIDOWN==='counselor'); $('#eNote').textContent = 'التسجيل حاليًا من اختصاص الموجه الطلابي، وتطّلع على السجل دون تعديل.';
      const cl = [...new Set(RO.map(s=>s.cls))].sort(ordA), cur = $('#eC').value || cl[0] || '';
      $('#eC').innerHTML = cl.map(c=>'<option'+(c===cur?' selected':'')+'>'+esc(c)+'</option>').join('');
      $('#eN').innerHTML = RO.filter(s=>s.cls===$('#eC').value).map(s=>'<option value="'+esc(s.seat)+'">'+esc(s.name)+'</option>').join('');
      $('#eBody').innerHTML = AIDS.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(x=>x.deleted?'<tr class="gone"><td><del>'+esc(x.name)+'</del></td><td><del>'+esc(x.className)+'</del></td><td><del>'+esc(x.type)+'</del></td><td><del>'+A(esc(x.dateH||''))+'</del></td><td><div class="muted">حُذف بواسطة: '+esc(x.deletedByName||'')+'</div></td></tr>':'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.className)+'</td><td><span class="tag '+(x.type==='إعانة'?'warn':'ok')+'">'+esc(x.type)+'</span>'+(x.byName?'<div class="muted">سجّله: '+esc(x.byName)+' ('+esc(x.byRole||'الوكيل')+')</div>':'')+'</td><td>'+A(esc(x.dateH||''))+'</td><td>'+(eMine?'<button type="button" class="btn danger" data-rm="'+x.id+'">حذف</button>':'')+'</td></tr>').join('') || '<tr><td colspan="5" class="muted">لا مستحقين.</td></tr>';
    }
    $('#eOn').addEventListener('change', async ()=>{
      const on = $('#eOn').checked;
      try{ await aidCfg.set({on, updatedAt:Date.now(), updatedBy:env.me.id}, {merge:true}); }catch(er){ fail(er); $('#eOn').checked=!on; return; }
      AIDON = on; eRender();
    });
    $('#eOwn').addEventListener('change', async ()=>{
      const v = $('#eOwn').value;
      try{ await aidCfg.set({owner:v, updatedAt:Date.now(), updatedBy:env.me.id}, {merge:true}); }catch(er){ fail(er); $('#eOwn').value = AIDOWN; return; }
      AIDOWN = v; eRender(); toast(v==='counselor' ? 'صار التسجيل للموجه الطلابي' : 'صار التسجيل للوكيل');
    });
    $('#eC').addEventListener('change', eRender);
    $('#eAdd').onclick = async ()=>{
      const seat = $('#eN').value, s = RO.find(x=>x.seat===seat); if(!s){ toast('اختر الطالب'); return; }
      const dg = $('#eD').value || dk, ref = aidCol.doc(), rec = {seat, name:s.name, className:s.cls, type:$('#eT').value, dateG:dg, dateH:hijL(dg), createdAt:Date.now(), createdBy:env.me.id, byName:env.me.name, byRole:'الوكيل'};
      if(AIDOWN!=='agent'){ toast('التسجيل حاليًا للموجه الطلابي'); return; }
      try{ await ref.set(rec); }catch(er){ fail(er); return; }
      AIDS.push(Object.assign({id:ref.id}, rec)); eRender(); toast('أُضيف المستحق');
    };
    $('#eBody').addEventListener('click', async e=>{
      const b = e.target.closest('[data-rm]'); if(!b) return;
      if(!confirm('حذف المستحق؟ سيبقى ظاهرًا مشطوبًا مع بيان من حذفه.')) return;
      const dd = {deleted:true, deletedAt:Date.now(), deletedBy:env.me.id, deletedByName:env.me.name};
      try{ await aidCol.doc(b.dataset.rm).set(dd, {merge:true}); }catch(er){ fail(er); return; }
      const ax = AIDS.find(x=>x.id===b.dataset.rm); if(ax) Object.assign(ax, dd); eRender();
    });

    /* ---- موافقات أولياء الأمور (ورقية، يسجل الوكيل حالتها) ---- */
    const PL = {yes:['موافق','ok'], no:['غير موافق','bad'], none:['لم تصل','warn']};
    let pk = 'bus';
    const apSt = seat=>{ const a=APR.get(pk+'__'+seat); return a ? a.st : 'none'; };
    function pRender(){
      const cl = [...new Set(RO.map(s=>s.cls))].sort(ordA), cur = $('#pCls').value;
      $('#pCls').innerHTML = '<option value="">كل الصفوف</option>'+cl.map(c=>'<option>'+esc(c)+'</option>').join(''); if(cl.includes(cur)) $('#pCls').value = cur;
      const L = RO.filter(s=>!$('#pCls').value || s.cls===$('#pCls').value), c = t=>L.filter(s=>apSt(s.seat)===t).length;
      $('#pSt').innerHTML = [['موافق',c('yes'),'ok'],['غير موافق',c('no'),'bad'],['لم تصل بعد',c('none'),'warn']].map(x=>'<div class="stat '+x[2]+'"><span class="n">'+A(x[1])+'</span><span class="l">'+x[0]+'</span></div>').join('');
      $('#pBody').innerHTML = L.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.cls)+'</td><td><div class="seg" data-p="'+esc(s.seat)+'">'+Object.keys(PL).map(t=>'<button type="button" data-v="'+t+'"'+(canEdit?'':' disabled')+' class="'+(apSt(s.seat)===t?'on':'')+'">'+PL[t][0]+'</button>').join('')+'</div></td></tr>').join('') || '<tr><td colspan="3" class="muted">لا طلاب في قائمة الصفوف.</td></tr>';
    }
    $('#pCls').addEventListener('change', pRender);
    $('#pSeg').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; pk=b.dataset.k; document.querySelectorAll('#pSeg button').forEach(x=>x.classList.toggle('on',x===b)); pRender(); });
    $('#pBody').addEventListener('click', async e=>{
      const b = e.target.closest('[data-v]'); if(!b || !canEdit) return; const seat = b.parentElement.dataset.p, s = RO.find(x=>x.seat===seat);
      const rec = {kind:pk, seat, name:s?s.name:'', className:s?s.cls:'', st:b.dataset.v, updatedAt:Date.now(), updatedBy:env.me.id};
      try{ await apCol.doc(pk+'__'+seat).set(rec); }catch(er){ fail(er); return; }
      APR.set(pk+'__'+seat, rec); pRender();
    });
    function refreshL(){ lRender(); hRender(); eRender(); pRender(); }

    /* ---- النماذج المطبوعة وتسجيل التوقيع الورقي (sa-forms.js) ---- */
    const SAF = SAForms.make({ env, db, sid, base, period, dk, A, hijL, DEGN, PN, LV, toast, fail, DD_dummy:0,
      vl:()=>VL, hr:()=>HR, vInfo, ddOf, un, exn, exMap, stageOf:seat=>{ const r=RO.find(x=>x.seat===seat); return r?r.stage:''; },
      absOf:seat=>AB.get(seat), dayOf, canEdit:()=>canEdit, fallback:()=>'',
      onChange:()=>{ try{ vRender(); }catch(e){} try{ rpRender(); }catch(e){} try{ hRender(); }catch(e){} if(bySeat && !$('#stOv').hidden) try{ openBayan(bySeat); }catch(e){} } });

    /* ---- التبويبات الفرعية ---- */
    document.addEventListener('click', e=>{ const b=e.target.closest('.subs button'); if(!b) return; const bar=b.parentElement, g=bar.dataset.grp;
      bar.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
      document.querySelectorAll('.sp[data-grp="'+g+'"]').forEach(p=>p.hidden=p.dataset.s!==b.dataset.s); });
    try{ await loadAbs(); gRender(); cRender(); tRender(); }
    catch(e){ console.error(e); toast('تعذّر تحميل أيام الغياب'); }
    try{ await loadTr(); rRender(); }
    catch(e){ console.error(e); toast('تعذّر تحميل التحويلات'); }
    try{ await Promise.all([loadRoster(), loadVio(), loadUnx()]); refreshV(); rRender(); }
    catch(e){ console.error(e); toast('تعذّر تحميل المخالفات'); }
    try{ await SAF.load(); }
    catch(e){ console.error(e); toast('تعذّر تحميل تواقيع النماذج'); }
    try{ await loadS5(); refreshL(); vRender(); rpRender(); $('#cmBox').open = !CMT || !!window.__saOpenAll; }
    catch(e){ console.error(e); toast('تعذّر تحميل التوجيه الطلابي'); }

  }
});
</script>
</body>
</html>
