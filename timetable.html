// شبكة أيام × حصص (للمعلم والشعبة)
function singleGridHTML(sk, cellFn, o){
  const sc = stageCfg(sk), mp = maxP(sk);
  // الأعمدة من اليوم الأطول حصصًا
  const refW = sc.days.reduce((a,w)=>(+sc.ppd[w]||0)>(+sc.ppd[a]||0)?w:a, sc.days[0]);
  const refBell = bell(sk, refW);
  const cols = [];
  for(let p=0;p<mp;p++){
    cols.push({ kind:'p', p, t: refBell.periods[p] });
    refBell.events.filter(e=>e.after===p+1).forEach(e=>{ if((e.type==='break' && o.showBr) || (e.type==='prayer' && o.showPr)) cols.push({ kind:'brk', type:e.type, t:e }); });
  }
  let h = `${o.title?`<h3 style="margin:12px 0 6px">${esc(o.title)}</h3>`:''}<div class="${o.forPrint?'':'tt-wrap'}" style="${o.forPrint?'':'max-height:none'}"><table class="${o.forPrint?'':'tt small'}"><thead><tr><th class="${o.forPrint?'dn':'dn nm'}"></th>`;
  cols.forEach(c=>{ h += c.kind==='p' ? `<th class="pn">${ar(c.p+1)}${o.times&&c.t?`<div style="font-size:9px;font-weight:500">${fmtRange(c.t.start,c.t.end)}</div>`:''}</th>` : `<th class="brk">${c.type==='prayer'?'صلاة':'فسحة'}</th>`; });
  h += '</tr></thead><tbody>';
  sc.days.forEach((w,d)=>{
    h += `<tr><td class="dn">${WEEKDAYS[w]}</td>`;
    cols.forEach(c=>{
      if(c.kind!=='p'){ h += '<td class="brk"></td>'; return; }
      if(c.p >= (+sc.ppd[w]||0)){ h += '<td class="cell" style="background:var(--bg-f3f3f3,#f3f3f3)"></td>'; return; }
      const v = cellFn(d, c.p);
      h += v ? `<td class="cell lesson"${v.def?' style="color:var(--danger)"':''}>${o.forPrint?`<span class="big">${esc(o.teacherMode?v.small:v.big)}</span><span class="small">${esc(o.teacherMode?(v.bigLabel||v.big):v.small)}</span>`:`<span class="c">${esc(o.teacherMode?v.small:v.big)}</span><span class="s">${esc(o.teacherMode?(v.bigLabel||v.big):v.small)}</span>`}</td>` : '<td class="cell"></td>';
    });
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}

/* ---------- التوليد في الخلفية ---------- */
async function generateStage(sk){
  const input = engineInput(sk, 'draft');
  if(!input.units.length){ toast('لا توجد حصص لتوليدها — أكمل الخطة الدراسية'); return; }
  if(!input.days.length){ toast('حدد أيام الدراسة للمرحلة'); return; }
  const draft = tableDoc(sk,'draft');
  const pinsN = input.units.filter(u=>u.pin).length;
  if(draft && (draft.lessons||[]).length){
    const ok = await confirmBox('إعادة التوليد', `سيُعاد توليد مسودة ${STAGE_BY_KEY[sk].label}.${pinsN?`\nالحصص المثبَّتة (${ar(pinsN)}) تبقى في أماكنها.`:''}\nالجدول المعتمد لا يتأثر.`, 'توليد');
    if(!ok) return;
  }
  const timeLimitMs = +($('#genTime') ? $('#genTime').value : 30000);
  $('#genProgress').classList.remove('hidden'); $('#genBtn').disabled = true;
  const done = (placement, report)=>{
    const lessons = placement.map(x=>{ const u = input.units.find(q=>q.id===x.id);
      return { id:x.id, c:u.classCode, s:u.subjectId, t:u.teacherId, d:x.day, p:x.p, n:u.len, pin: !!u.pin }; });
    const id = docIds.table(sk,'draft');
    TT.docs[id] = TT.docs[id] || { rev:0, data:null };
    TT.docs[id].data = { lessons, generatedAt: Date.now(), generatedBy: TT.me.id,
      report: { cost: report.cost, unplaced: report.unplaced.length, violations: report.violations.length } };
    markDirty(id); STAGE_STATE_CACHE.clear(); TT.sel=null; TT.preview=null; TT.ui.which='draft';
    renderTableBody(sk);
    toast(report.unplaced.length ? `وُلِّد الجدول — ${ar(report.unplaced.length)} حصة لم تُوزَّع` : 'وُلِّد الجدول بنجاح');
  };
  const progress = (f, cost, unp)=>{ const b=$('#genBar'); if(b) b.style.width = Math.round(f*100)+'%'; const s=$('#genStat'); if(s) s.textContent = `${ar(Math.round(f*100))}٪ — غير موزعة: ${ar(unp)}`; };
  let worker = null;
  try{ worker = new Worker('timetable-engine.js'); }catch(e){ worker = null; }
  if(worker){
    worker.onmessage = ev=>{
      const m = ev.data;
      if(m.type==='progress') progress(m.frac, m.cost, m.unplaced);
      if(m.type==='done'){ worker.terminate(); done(m.placement, m.report); }
      if(m.type==='error'){ worker.terminate(); toast('خطأ في التوليد: '+m.message); renderTableBody(sk); }
    };
    worker.onerror = e=>{ worker.terminate(); runInline(); };
    worker.postMessage({ cmd:'solve', input, opts:{ timeLimitMs, seed: Date.now()%100000 } });
  } else runInline();
  function runInline(){
    // احتياطي: التشغيل في الصفحة نفسها (قد تتجمد الصفحة أثناء التوليد)
    setTimeout(()=>{
      const pr = TTEngine.buildProblem(input);
      const st = TTEngine.solve(pr, { timeLimitMs: Math.min(timeLimitMs, 15000), seed: Date.now()%100000 });
      done(TTEngine.exportPlacement(pr, st), TTEngine.evaluate(pr, st));
    }, 50);
  }
}
async function approveStage(sk){
  const draft = tableDoc(sk,'draft'); if(!draft || !(draft.lessons||[]).length) return;
  const S = getStageState(sk,'draft');
  const unp = TTEngine.evaluate(S.pr, S.st).unplaced.length;
  const ok = await confirmBox('اعتماد الجدول', `ستُنسخ المسودة الحالية إلى الجدول المعتمد لـ${STAGE_BY_KEY[sk].label}.${unp?`\nتنبيه: ${ar(unp)} حصة غير موزعة.`:''}`, 'اعتماد');
  if(!ok) return;
  if(S.hasDoc && (S.added || S.extra || S.conflicts.length)) saveStageState(S);   // حفظ المسودة بعد المطابقة
  const id = docIds.table(sk,'approved');
  TT.docs[id] = TT.docs[id] || { rev:0, data:null };
  TT.docs[id].data = Object.assign(clone(D(docIds.table(sk,'draft'))), { approvedAt: Date.now(), approvedBy: TT.me.id });
  markDirty(id); STAGE_STATE_CACHE.clear();
  renderTableBody(sk); toast('تم اعتماد الجدول');
}

function printPage(title, inner, S, cls){ return `<div class="pg ${cls||'single'}"><h2>${esc(title)}</h2>${inner}${printFooter(S)}</div>`; }
function printMaster(sk, S){
  const { pr, st } = S; const sc = stageCfg(sk);
  const rows = masterRows(S);
  const days = sc.days.map((w,d)=>{
    const n=+sc.ppd[w]||0, cols=[]; const b=bell(sk,w);
    for(let p=0;p<n;p++){ cols.push({kind:'p',d,p}); b.events.filter(e=>e.after===p+1).forEach(e=>{ if((e.type==='break'&&sc.print.breaks)||(e.type==='prayer'&&sc.print.prayer)) cols.push({kind:'brk',type:e.type}); }); }
    return { w, cols };
  });
  const perPage = 18, pages=[];
  for(let i=0;i<rows.length;i+=perPage) pages.push(rows.slice(i,i+perPage));
  return pages.map((chunk,pi)=>{
    let h = `<table><thead><tr><th rowspan="2">م</th><th rowspan="2">المعلم</th>${days.map(dd=>`<th colspan="${dd.cols.length}">${WEEKDAYS[dd.w]}</th>`).join('')}</tr><tr>`;
    days.forEach(dd=>dd.cols.forEach(c=>{ h += c.kind==='p' ? `<th>${ar(c.p+1)}</th>` : `<th class="brk">${c.type==='prayer'?'صلاة':'فسحة'}</th>`; }));
    h += '</tr></thead><tbody>';
    chunk.forEach((r,i)=>{
      h += `<tr><td>${r.ti>=0?ar(pi*perPage+i+1):''}</td><td class="nm">${esc(r.name)}</td>`;
      days.forEach(dd=>dd.cols.forEach(c=>{
        if(c.kind!=='p'){ h+='<td class="brk"></td>'; return; }
        const uis = cellUnits(S, r, c.d, c.p);
        h += uis.length ? `<td class="cell"><div>${esc(shortSubj(pr.units[uis[0]].subjName))}</div><b>${uis.map(ui=>esc(pr.classes[pr.units[ui].ci])).join('، ')}</b></td>` : '<td class="cell"></td>';
      }));
      h += '</tr>';
    });
    h += '</tbody></table>';
    return `<div class="pg master"><h2>الجدول العام للمعلمين — ${esc(STAGE_BY_KEY[sk].label)}${pages.length>1?` (${ar(pi+1)}/${ar(pages.length)})`:''}</h2>${h}${printFooter(S)}</div>`;
  }).join('');
}

        ${(a.mode==='sub'||a.mode==='cancel')?` ← <select class="sm" data-exto="${t.id}"><option value="">— اختر المعلم البديل —</option>${candOpts(t.id, a.to)}<option value="__new__">＋ معلم جديد…</option></select>`:''}</td></tr>`;

async function runExport(sks){
  if(!sks.length) return;
  // التحقق من البدلاء
  const list = exportTeachersFor(sks), sub = {};
  for(const t of list){
    const a = TT.exp.actions[t.id] || { mode:'keep' };
    if(a.mode==='sub' || a.mode==='cancel'){
      if(!a.to){ toast('اختر المعلم البديل لـ«'+t.name+'»'); return; }
      sub[t.id] = a.to;
    }
  }
  if(pendingSaves.size) await flushSaves();
  const tgt = 'second';
  const [tc, ta, ...tt] = await Promise.all([ loadDocFresh(docIds.config(tgt)), loadDocFresh(docIds.assign(tgt)), ...sks.map(sk=>loadDocFresh(docIds.table(sk,'draft',tgt))) ]);
  const hasExisting = sks.some((sk,i)=>(tt[i].data && (tt[i].data.lessons||[]).length)) || sks.some(sk=>stagePlanKeys(sk).some(pk=>tc.data && tc.data.plans && (tc.data.plans[pk]||[]).length));
  if(hasExisting && !(await confirmBox('بيانات موجودة في الفصل الثاني', 'للمراحل المختارة إعدادات أو خطط أو جداول في الفصل الثاني. التصدير سيستبدلها.', 'استبدال', true))) return;
  const mapT = tid=> tid ? (sub[tid] || tid) : tid;
  // الإعدادات والخطط (بنفس معرّفات المواد حتى تبقى الحصص مطابقة)
  const cfgT = tc.data || { stages:{}, plans:{}, teacherStages:{} };
  cfgT.stages = cfgT.stages||{}; cfgT.plans = cfgT.plans||{}; cfgT.teacherStages = cfgT.teacherStages||{};
  sks.forEach(sk=>{ cfgT.stages[sk] = clone(stageCfg(sk)); stagePlanKeys(sk).forEach(pk=>{ cfgT.plans[pk] = clone(planOf(pk)); }); });
  list.forEach(t=>{
    const a = TT.exp.actions[t.id]||{};
    if(a.mode==='only') cfgT.teacherStages[t.id] = (t.stages||[]).filter(k=>sks.includes(k));
    else if(a.mode==='shared' || a.mode==='keep') delete cfgT.teacherStages[t.id];
  });
  // الإسناد
  const asgT = ta.data || { map:{} }; asgT.map = asgT.map||{};
  sks.forEach(sk=>stageClasses(sk).forEach(c=>{
    const src = amap()[c.code] || {}; const out = {};
    Object.entries(src).forEach(([sb,tid])=>{ out[sb] = mapT(tid); });
    asgT.map[c.code] = out;
  }));
  // الجداول: المعتمد إن وُجد وإلا المسودة
  const tblOut = sks.map(sk=>{
    const srcDoc = tableDoc(sk,'approved') || tableDoc(sk,'draft');
    const lessons = (srcDoc && srcDoc.lessons || []).map(l=>Object.assign({}, l, { t: mapT(l.t) }));
    return { sk, data: { lessons, generatedAt: srcDoc && srcDoc.generatedAt || null, exportedFrom:'first', exportedAt: Date.now(), exportedBy: TT.me.id } };
  });
  // تقرير التعارضات المتوقعة (معلم بديل له حصص في نفس الوقت)
  const conflicts = [];
  const occ = {};   // tid|w|start-end
  tblOut.forEach(({sk,data})=>data.lessons.forEach(l=>{
    if(!l.t || l.d==null) return;
    const b = bell(sk, l.d);
    for(let k=0;k<(l.n||1);k++){
      const pp = b.periods[l.p+k]; if(!pp) continue;
      const key = l.t+'|'+l.d;
      (occ[key] = occ[key]||[]).push({ start:pp.start, end:pp.end, l, sk });
    }
  }));
  Object.entries(occ).forEach(([key,arr])=>{
    arr.sort((a,b)=>a.start-b.start);
    for(let i=1;i<arr.length;i++) if(arr[i].start < arr[i-1].end && arr[i].l.id!==arr[i-1].l.id){
      const [tid,w] = key.split('|');
      conflicts.push(`${teacherName(tid)}: ${WEEKDAYS[+w]} — ${classLabel(arr[i].l.c)} و${classLabel(arr[i-1].l.c)}`);
    }
  });
  try{
    await saveDocExternal(docIds.config(tgt), cfgT, tc.rev);
    await saveDocExternal(docIds.assign(tgt), asgT, ta.rev);
    for(let i=0;i<tblOut.length;i++) await saveDocExternal(docIds.table(tblOut[i].sk,'draft',tgt), tblOut[i].data, tt[i].rev);
  }catch(e){
    if(e instanceof ConflictError){ toast('عُدِّلت بيانات الفصل الثاني أثناء التصدير — أعد المحاولة'); return; }
    toast('تعذّر التصدير: '+e.message); return;
  }
  modal(`<h2>✔ تم التصدير إلى الفصل الثاني</h2>
    <div>صُدِّرت: ${sks.map(sk=>esc(STAGE_BY_KEY[sk].label)).join('، ')} (الإعدادات، الخطة، الإسناد، والجدول كمسودة).</div>
    ${conflicts.length ? `<div class="alert warn" style="margin-top:10px"><b>تعارضات بسبب الاستبدال (${ar(conflicts.length)}):</b> ستُنقل الحصص المتعارضة إلى «غير موزعة» عند فتح الفصل الثاني، وتُحل بالتبديل أو بإعادة التوليد مع التثبيت.<ul class="viol-list">${conflicts.slice(0,40).map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>` : '<div class="alert ok" style="margin-top:10px">لا تعارضات متوقعة.</div>'}
    <div class="sub">راجع الجدول في الفصل الثاني ثم اعتمده. بعدها ولّد جدول الثانوي حوله.</div>
    <div class="modal-actions"><button class="btn" id="goSecond">الانتقال إلى الفصل الثاني</button><button class="btn sec" onclick="closeModal()">البقاء هنا</button></div>`);
  $('#goSecond').onclick = ()=>{ closeModal(); $('#tbPeriod').value='second'; reloadPeriod('second'); };
}

/* ---------- نشر الإسناد ---------- */
function periodAssignmentsFor(tid){
  const out = [], seen = new Set();
  enabledStages().forEach(s=>stageClasses(s.key).forEach(c=>planOf(planKeyOf(c)).forEach(sb=>{
    if(assignedTeacher(c.code, sb.id)!==tid || !(+sb.weekly) || !sb.name) return;
    const k = c.code+'::'+sb.name; if(seen.has(k)) return; seen.add(k);
    out.push({ classCode: String(c.code), subject: sb.name });
  })));
  return out;
}
const aKey = a=>String(a.classCode)+'::'+a.subject;
function dedupeAssign(list){ const m = new Map(); list.forEach(a=>m.set(aKey(a), { classCode:String(a.classCode), subject:a.subject })); return [...m.values()]; }
/* ---------- «جدولي»: نسخة منشورة من الجداول المعتمدة، مفهرسة بحساب كل مستخدم ---------- */
// توقيع مختصر لحصص المستخدم: يتغير فقط إن تغيّرت حصصه هو، فيصله الإشعار وحده
function schedSig(L){
  const s = L.map(l=>[l.st,l.d,l.p,l.n,l.c,l.s].join('|')).join(';');
  let h = 5381; for(let i=0;i<s.length;i++) h = ((h<<5) + h + s.charCodeAt(i)) >>> 0;
  return h.toString(36) + '.' + L.length;
}
function buildPublishedSchedule(idx){
  const per = {}, missing = [];
  enabledStages().forEach(s=>{
    const doc = tableDoc(s.key, 'approved');
    if(!doc || !(doc.lessons||[]).length){ missing.push(s.label); return; }
    const { pr, st } = getStageState(s.key, 'approved');
    pr.units.forEach((u,ui)=>{
      if(u.ti<0 || st.pos[ui]<0) return;
      const t = teacherById(pr.teachers[u.ti]); if(!t || !t.nid) return;
      const usr = idx.byNid[normDigits(t.nid).trim()]; if(!usr || usr.pending || !usr.active) return;
      const pos = st.pos[ui];
      (per[usr.id] = per[usr.id] || []).push({ st: s.key, sl: s.label, d: pr.days[Math.floor(pos/pr.P)], p: pos%pr.P, n: u.len,
        c: pr.classes[u.ci], cl: classLabel(pr.classes[u.ci]), s: u.subjName });
    });
  });
  const byUser = {};
  Object.keys(per).forEach(uid=>{
    const L = per[uid].sort((a,b)=>a.d-b.d || a.p-b.p || a.st.localeCompare(b.st));
    byUser[uid] = { sig: schedSig(L), lessons: L };
  });
  // شكل الشبكة لكل مرحلة (مطابق لـsingleGridHTML في «جدول معلم»): الأيام، حصص كل يوم، والأعمدة بالفسح والصلاة وأوقاتها
  const layouts = {};
  enabledStages().forEach(s=>{
    const doc = tableDoc(s.key, 'approved'); if(!doc || !(doc.lessons||[]).length) return;
    const sc = stageCfg(s.key), mp = maxP(s.key);
    const refW = sc.days.reduce((a,w)=>(+sc.ppd[w]||0)>(+sc.ppd[a]||0)?w:a, sc.days[0]);
    const refBell = bell(s.key, refW);
    const cols = [];
    for(let p=0;p<mp;p++){
      const t = refBell.periods[p];
      cols.push({ k:'p', p, t: t ? fmtTime(t.start)+' – '+fmtTime(t.end) : '' });
      refBell.events.filter(e=>e.after===p+1).forEach(e=>cols.push({ k:'b', type: e.type }));
    }
    const ppd = {}; sc.days.forEach(w=>ppd[w] = +sc.ppd[w]||0);
    layouts[s.key] = { label: s.label, days: sc.days.slice(), ppd, cols };
  });
  return { data: { publishedAt: Date.now(), by: TT.me.id, period: TT.period, layouts, byUser }, missing };
}
async function openPublish(){
  if(pendingSaves.size) await flushSaves();
  const idx = await ensureUserIndex(true);
  const P = TT.period, rows = [], seenUsers = new Set();
  teachers().forEach(t=>{
    const list = periodAssignmentsFor(t.id);
    const u = t.nid ? idx.byNid[t.nid] : null;
    if(!list.length && !(u && u.ctx && u.ctx.subjectAssignmentsByPeriod)) return;
    let status = 'none';
    if(u && !u.pending && u.active) status = 'linked';
    else if(u && u.pending) status = 'pending';
    const cur = (u && u.ctx && u.ctx.subjectAssignmentsByPeriod && u.ctx.subjectAssignmentsByPeriod[P]) || [];
    const curK = new Set(cur.map(aKey)), newK = new Set(list.map(aKey));
    rows.push({ t, u: status==='linked'?u:null, status, list,
      added: list.filter(a=>!curK.has(aKey(a))).length, removed: cur.filter(a=>!newK.has(aKey(a))).length });
    if(status==='linked') seenUsers.add(u.id);
  });
  // مستخدمون نُشر لهم سابقًا ولم يعد لهم إسناد في هذا الفصل الدراسي
  idx.list.forEach(u=>{
    if(seenUsers.has(u.id) || u.pending || !u.ctx || !u.ctx.subjectAssignmentsByPeriod) return;
    const cur = u.ctx.subjectAssignmentsByPeriod[P] || [];
    if(!cur.length) return;
    rows.push({ t:{ name:u.name }, u, status:'linked', list:[], added:0, removed:cur.length, orphan:true });
  });
  const linked = rows.filter(r=>r.status==='linked');
  const newSubjects = [...new Set(rows.flatMap(r=>r.list.map(a=>a.subject)))].filter(n=>!SYSTEM_FIXED_SUBJECTS.includes(n) && !TT.roster.customSubjects.includes(n));
  const noApproved = enabledStages().filter(s=>{ const d = tableDoc(s.key,'approved'); return !d || !(d.lessons||[]).length; }).map(s=>s.label);
  modal(`<h2>نشر إسناد ${esc(PERIOD_LABEL[P])}</h2>
    <div class="sub">يُكتب لكل معلم مرتبط: إسناد هذا الفصل الدراسي، ومجموع الفصلين في القائمة العامة (حتى لا يفقد أحد وصوله لو أُزيلت الأداة)، وتُضاف فصوله إلى فصوله المسندة.</div>
    <div class="alert info" style="margin-top:10px">ويُنشر الجدول <b>المعتمد</b> لكل مرحلة في «لوحتي ← جدولي» لدى كل مستخدم مرتبط، ويصل إشعار فقط لمن تغيّر جدوله منذ آخر نشر. أي اعتماد لاحق لا يظهر للمستخدمين حتى تنشر مرة أخرى.</div>
    ${noApproved.length?`<div class="alert warn" style="margin-top:8px">لا يوجد جدول معتمد لـ: ${noApproved.map(esc).join('، ')} — لن تُنشر حصصها في «جدولي».</div>`:''}
    <table class="tbl" style="margin-top:10px"><tr><th>المعلم</th><th>الحساب</th><th>المواد × الشعب</th><th>يُضاف</th><th>يُزال</th></tr>
    ${rows.map(r=>`<tr><td class="r">${esc(r.t.name)}${r.orphan?' <span class="chip warn">لم يعد في الجدول</span>':''}</td>

      <td>${ar(r.list.length)}</td><td>${r.added?`<span class="chip ok">${ar(r.added)}</span>`:'—'}</td><td>${r.removed?`<span class="chip err">${ar(r.removed)}</span>`:'—'}</td></tr>`).join('')}</table>
    ${newSubjects.length?`<div class="alert info" style="margin-top:10px">مواد جديدة ستُضاف لقائمة مواد المدرسة: ${newSubjects.map(n=>`<span class="chip">${esc(n)}</span>`).join(' ')}</div>`:''}
    ${rows.some(r=>r.status!=='linked')?'<div class="sub" style="margin-top:8px">غير المرتبطين لا يُكتب لهم شيء الآن؛ يُربط المعلم برقم هويته عند تفعيل حسابه، ثم يُعاد النشر.</div>':''}
    <div class="modal-actions"><button class="btn" id="pubGo" ${linked.length?'':'disabled'}>نشر إلى ${ar(linked.length)} حساب</button><button class="btn sec" onclick="closeModal()">إلغاء</button></div>`, 'wide');
  $('#pubGo').onclick = async ()=>{
    $('#pubGo').disabled = true; $('#pubGo').textContent = 'جارٍ النشر…';
    let ok=0, fail=[];
    for(const r of linked){
      try{
        const snap = await db.collection('users').doc(r.u.id).get();   // أحدث نسخة
        const ctx = ((snap.data()||{}).schools||{})[TT.sid]; if(!ctx) throw new Error('لا سياق مدرسة');
        const byP = Object.assign({}, ctx.subjectAssignmentsByPeriod||{}); byP[P] = dedupeAssign(r.list);
        const union = dedupeAssign(Object.values(byP).flat());
        // فصول هذا الشخص المشتقة من الجدول تحديدًا (تُستبدَل كل نشر، لا تتراكم) — تُستخدم لتمييز "من الجدول" عن "يدوي"
        const ttCodes = [...new Set(union.map(a=>a.classCode))];
        const patch = {
          ['schools.'+TT.sid+'.subjectAssignmentsByPeriod']: byP,
          ['schools.'+TT.sid+'.subjectAssignments']: union,
          ['schools.'+TT.sid+'.ttAssignedClasses']: ttCodes,
          _editCtx: TT.sid, updatedAt: Date.now() };
        // دور معلم: فصوله بالجدول تندمج بفصوله المسندة كما كانت (مصدر واحد للتحكم).
        // أي دور غير معلم: لا تُلمَس فصوله المسندة اليدوية إطلاقًا؛ فصول الجدول تبقى بحقل منفصل (ttAssignedClasses)
        // ليُعامل بهما كمعلم لهذي الفصول تحديدًا، مع بقاء دوره الإداري وفصوله اليدوية مستقلة وقابلة للتحرير.
        if((ctx.role||'')==='teacher'){
          let assigned = Array.isArray(ctx.assignedClasses) ? ctx.assignedClasses.map(String) : [];
          if(!assigned.includes('__all__')) assigned = [...new Set([...assigned, ...ttCodes])];
          patch['schools.'+TT.sid+'.assignedClasses'] = assigned;
        }
        await db.collection('users').doc(r.u.id).update(patch);
        ok++;
      }catch(e){ fail.push(r.t.name+' ('+(e.message||e)+')'); }
    }
    if(newSubjects.length){
      try{
        const ref = db.collection('schoolData').doc('roster_'+TT.sid);
        await db.runTransaction(async tx=>{
          const sn = await tx.get(ref); if(!sn.exists) return;
          let d = {}; try{ d = JSON.parse(sn.data().value||'{}'); }catch(e){ return; }
          const cs = Array.isArray(d.customSubjects) ? d.customSubjects : [];
          newSubjects.forEach(n=>{ if(!cs.includes(n) && !SYSTEM_FIXED_SUBJECTS.includes(n)) cs.push(n); });
          d.customSubjects = cs;
          tx.update(ref, { value: JSON.stringify(d), updatedAt: Date.now() });
        });
        TT.roster.customSubjects = TT.roster.customSubjects.concat(newSubjects);
      }catch(e){ fail.push('قائمة المواد ('+(e.message||e)+')'); }
    }
    // نشر «جدولي»: نسخة ثابتة من الجداول المعتمدة الآن، مفهرسة بحساب كل مستخدم (قراءة لأي موظف بالمدرسة)
    let schedUsers = 0;
    try{
      const { data } = buildPublishedSchedule(idx);
      await ttCol().doc(docIds.published(P)).set({ value: JSON.stringify(data), rev: Date.now(), updatedAt: Date.now(), updatedBy: TT.me.id, sid: TT.sid });
      schedUsers = Object.keys(data.byUser).length;
    }catch(e){ fail.push('نشر الجدول في «جدولي» ('+(e.message||e)+')'); }
    const meta = D(docIds.meta()); meta.published = meta.published||{};
    meta.published[P] = { at: Date.now(), by: TT.me.id, count: ok, unlinked: rows.filter(r=>r.status!=='linked').length };
    markDirty(docIds.meta());
    TT.userIndex = null;
    modal(`<h2>${fail.length?'⚠️ اكتمل النشر مع أخطاء':'✔ تم النشر'}</h2><div>نُشر الإسناد إلى ${ar(ok)} حساب.</div><div>ونُشر الجدول في «جدولي» لـ${ar(schedUsers)} مستخدم.</div>
      ${fail.length?`<div class="alert err" style="margin-top:10px">تعذّر: <ul>${fail.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>`:''}
      <div class="modal-actions"><button class="btn" onclick="closeModal();show('export')">حسنًا</button></div>`);
  };
}

/* =========================================================================
   حصص الانتظار (ص-٢)
   - جدول انتظار لكل مرحلة بنفس أيام وحصص الجدول المدرسي، لا علاقة له بالفصل أو المادة.
   - حد المعلم: النصاب + الانتظار ≤ حدّه (افتراضيًا نصابه النظامي ٢٤، ويُعدَّل لكل معلم)، وحصة انتظار واحدة في اليوم (إلزامي).
   - يتجنب يومه الذهبي؛ وإن تعذّر باختيار معلم آخر: بعد آخر حصة له مباشرة أو في فراغ قبلها.
   - الحصة الواحدة: من ١ إلى ٤ معلمين (انتظار١..٤)، ويُعبَّأ الجدول قدر الإمكان. المستثنى لا يدخل التوزيع الآلي ويُسنَد يدويًا.
   - النشر: «انتظار» في «جدولي» لكل معلم (بلا رقم)؛ الجدول العام للمدير وصاحب الصلاحية فقط.
   - التحديد اليومي: الغائبون (يوم كامل) ← حصصهم الرسمية ← اختيار البديل (من معلمي انتظار الحصة، أو أي فارغ عبر +)،
     مع عدد أيام انتظاره هذا الأسبوع؛ ثم «اعتماد وإرسال» يصل البديل في «لوحتي»، وطباعة «سجل توزيع حصص الانتظار» وإرساله واتساب PDF.
   ========================================================================= */
const W_MAX = 4;
const W_ORD = ['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة'];
TT.wsub = 'setup'; TT.wdate = null; TT.wdayCache = {};
function wdoc(){
  const id = docIds.waiting();
  if(!D(id)) TT.docs[id] = { rev: TT.docs[id] ? TT.docs[id].rev : 0, data:{ caps:{}, excluded:{}, grid:{} } };
  const d = D(id); d.caps = d.caps||{}; d.excluded = d.excluded||{}; d.grid = d.grid||{};
  return d;
}
const wKey = (d,p)=>d+'|'+p;
function wCell(sk, d, p){ const g = wdoc().grid[sk] || {}; return g[wKey(d,p)] || []; }
function wSetCell(sk, d, p, list){ const W = wdoc(); W.grid[sk] = W.grid[sk] || {}; if(list.length) W.grid[sk][wKey(d,p)] = list; else delete W.grid[sk][wKey(d,p)]; W.updatedAt = Date.now(); markDirty(docIds.waiting()); }
const wStages = ()=>enabledStages().filter(s=>{ const d=tableDoc(s.key,'approved'); return d && (d.lessons||[]).length; });
// حصص المعلم المعتمدة لكل مرحلة: {sk: {w: Set(p)}}
function wLessonMap(){
  if(TT._wLM) return TT._wLM;
  const m = {};
  STAGES.forEach(s=>{
    if(!stageCfg(s.key) || !stageCfg(s.key).enabled) return;
    const doc = tableDoc(s.key,'approved');
    (doc && doc.lessons || []).forEach(l=>{
      if(l.d==null || !l.t) return;
      const a = ((m[l.t] = m[l.t] || {})[s.key] = m[l.t][s.key] || {});
      const set = a[l.d] = a[l.d] || new Set();
      for(let k=0;k<(l.n||1);k++) set.add(l.p+k);
    });
  });
  TT._wLM = m; return m;
}
// مشغول في (مرحلة، يوم، حصة)؟ — حصته بالمرحلة نفسها، أو حصة بمرحلة أخرى يتقاطع وقتها
function wBusy(tid, sk, d, p){
  const m = wLessonMap()[tid] || {};
  if(m[sk] && m[sk][d] && m[sk][d].has(p)) return true;
  const pp = bell(sk, d).periods[p]; if(!pp) return true;
  return Object.keys(m).some(o=>{
    if(o===sk || !m[o][d]) return false;
    const b = bell(o, d);
    return [...m[o][d]].some(q=>{ const x=b.periods[q]; return x && x.start < pp.end && pp.start < x.end; });
  });
}
function wLast(tid, sk, d){ const m = wLessonMap()[tid] || {}; const set = m[sk] && m[sk][d]; return set && set.size ? Math.max(...set) : -1; }
function wGolden(tid, sk){
  try{ const S = getStageState(sk,'approved'); const ti = S.pr.teachers.indexOf(tid); return ti>=0 ? S.pr.goldenTarget[ti] : -1; }catch(e){ return -1; }
}
function wLoad(tid){ return ((teacherLoads()[tid])||{}).total || 0; }
function wCap(tid){ const W = wdoc(); if(W.caps[tid]!=null) return +W.caps[tid]; const t = teacherById(tid); return +(t && t.quota) || 24; }
function wTeachersOf(sk){ return teachers().filter(t=>(teacherStagesNow(t)||[]).includes(sk) && wLessonMap()[t.id]); }
// ما خُصِّص للمعلم: {count, days:Set(w)} عبر كل المراحل
function wAssigned(){
  const a = {};
  Object.entries(wdoc().grid).forEach(([sk,g])=>Object.entries(g||{}).forEach(([k,list])=>{ const d=+k.split('|')[0]; list.forEach(tid=>{ const x = a[tid] = a[tid] || { count:0, days:new Set() }; x.count++; x.days.add(d); }); }));
  return a;
}
function wNeed(tid){ return Math.max(0, wCap(tid) - wLoad(tid)); }
function wGoldenOk(tid, sk, d, p){ const g = wGolden(tid, sk); if(g!==d) return true; const last = wLast(tid, sk, d); return p <= last+1; }

/* ---------- التوزيع الآلي ---------- */
function wAutoDistribute(){
  const W = wdoc(); W.grid = {};
  const stages = wStages();
  const used = {};       // tid -> Set(days)
  const need = {};       // tid -> remaining
  const all = new Set();
  stages.forEach(s=>wTeachersOf(s.key).forEach(t=>all.add(t.id)));
  all.forEach(tid=>{ used[tid] = new Set(); need[tid] = W.excluded[tid] ? 0 : wNeed(tid); });
  const slots = [];
  stages.forEach(s=>{ const sc = stageCfg(s.key); sc.days.forEach(d=>{ for(let p=0;p<(+sc.ppd[d]||0);p++) slots.push({ sk:s.key, d, p }); }); });
  const cnt = sl=>((W.grid[sl.sk]||{})[wKey(sl.d,sl.p)]||[]).length;
  const cands = sl=>wTeachersOf(sl.sk).map(t=>t.id).filter(tid=>need[tid]>0 && !used[tid].has(sl.d) && !wBusy(tid, sl.sk, sl.d, sl.p) && wGoldenOk(tid, sl.sk, sl.d, sl.p));
  const isG = (tid, sl)=>wGolden(tid, sl.sk)===sl.d ? 1 : 0;
  const put = (tid, sl)=>{ W.grid[sl.sk] = W.grid[sl.sk] || {}; const k = wKey(sl.d,sl.p); (W.grid[sl.sk][k] = W.grid[sl.sk][k] || []).push(tid); used[tid].add(sl.d); need[tid]--; };
  // ١) تغطية الخانات الفارغة: الأصعب أولًا (أقل عدد مرشحين)
  let guard = 0;
  while(guard++ < 5000){
    let best = null, bestC = null;
    slots.forEach(sl=>{ if(cnt(sl)) return; const c = cands(sl); if(!c.length) return; if(!best || c.length < bestC.length){ best = sl; bestC = c; } });
    if(!best) break;
    bestC.sort((a,b)=> isG(a,best)-isG(b,best) || need[b]-need[a] || a.localeCompare(b));
    put(bestC[0], best);
  }
  // ٢) إكمال حصص كل معلم حتى حده (يوم واحد لكل يوم)، بالتناوب بين المعلمين، وأقل الخانات ازدحامًا أولًا
  let progress = true; guard = 0;
  while(progress && guard++ < 200){
    progress = false;
    [...all].filter(tid=>need[tid]>0).sort((a,b)=>need[b]-need[a]).forEach(tid=>{
      const opts = slots.filter(sl=>cnt(sl) < W_MAX && wTeachersOf(sl.sk).some(t=>t.id===tid) && !used[tid].has(sl.d) && !wBusy(tid, sl.sk, sl.d, sl.p) && wGoldenOk(tid, sl.sk, sl.d, sl.p));
      if(!opts.length) return;
      opts.sort((a,b)=> isG(tid,a)-isG(tid,b) || cnt(a)-cnt(b) || a.d-b.d || a.p-b.p);
      put(tid, opts[0]); progress = true;
    });
  }
  W.generatedAt = Date.now(); W.updatedAt = Date.now();
  markDirty(docIds.waiting());
}

/* ---------- القسم ---------- */
SECTIONS.waiting = function(main){
  TT._wLM = null;
  const stages = wStages();
  const W = wdoc();
  const pubTxt = W.publishedAt ? 'منشور '+new Date(W.publishedAt).toLocaleString('ar-SA') + (W.updatedAt > W.publishedAt ? ' — <b style="color:var(--warn)">عُدِّل بعد النشر</b>' : '') : 'لم يُنشر بعد';
  main.innerHTML = `<div class="card"><div class="card-head"><h3>⏳ حصص الانتظار</h3>
      <button class="btn sm ${TT.wsub==='setup'?'':'sec'}" data-ws="setup">جدول الانتظار</button>
      <button class="btn sm ${TT.wsub==='daily'?'':'sec'}" data-ws="daily">تحديد الانتظار اليومي</button></div>
      <div class="sub" style="margin-top:6px">${TT.canWait?'':'عرض فقط. '}الحالة: ${pubTxt}</div></div>
    <div id="wBody"></div>`;
  $$('[data-ws]').forEach(b=>b.onclick=()=>{ TT.wsub = b.dataset.ws; show('waiting'); });
  if(!stages.length){ $('#wBody').innerHTML = '<div class="empty">لا يوجد جدول معتمد بعد. اعتمد الجدول المدرسي أولًا — منه تُحسب أوقات فراغ المعلمين.</div>'; return; }
  if(TT.wsub==='daily') wRenderDaily($('#wBody')); else wRenderSetup($('#wBody'));
};
function wGridHtml(sk, cellFn){
  const sc = stageCfg(sk), mp = maxP(sk);
  let h = `<div class="tbl-wrap" style="overflow-x:auto"><table class="tbl" style="min-width:${120+mp*120}px"><tr><th style="width:80px">اليوم</th>${Array.from({length:mp},(_,p)=>`<th>${W_ORD[p]||ar(p+1)}</th>`).join('')}</tr>`;
  sc.days.forEach(d=>{
    h += `<tr><th>${WEEKDAYS[d]}</th>`;
    for(let p=0;p<mp;p++) h += p < (+sc.ppd[d]||0) ? cellFn(d,p) : '<td style="background:var(--bg-f3f3f3,#f3f3f3)"></td>';
    h += '</tr>';
  });
  return h + '</table></div>';
}
function wRenderSetup(body){
  const W = wdoc(), stages = wStages(), A = wAssigned();
  const allT = []; const seen = new Set();
  stages.forEach(s=>wTeachersOf(s.key).forEach(t=>{ if(!seen.has(t.id)){ seen.add(t.id); allT.push(t); } }));
  allT.sort((a,b)=>a.name.localeCompare(b.name,'ar'));

    const load = wLoad(t.id), cap = wCap(t.id), got = (A[t.id]||{}).count||0, target = W.excluded[t.id] ? 0 : Math.min(wNeed(t.id), 5);
    const gd = stages.map(s=>{ const g = wGolden(t.id, s.key); return g>=0 && (teacherStagesNow(t)||[]).includes(s.key) ? WEEKDAYS[g] : ''; }).filter(Boolean);
    return `<tr><td class="r">${esc(t.name)}</td><td>${ar(load)}</td>
      <td>${ed?`<input type="number" class="sm num" min="0" max="40" data-cap="${t.id}" value="${cap}" style="width:64px">`:ar(cap)}</td>
      <td>${ar(got)}${W.excluded[t.id]?'':` / ${ar(target)}`}${!W.excluded[t.id] && got<target?' <span class="chip warn">ناقص</span>':''}${got && load+got>cap?' <span class="chip err">تجاوز الحد</span>':''}${!got && load>=cap?' <span class="chip">نصابه مكتمل</span>':''}</td>
      <td>${esc([...new Set(gd)].join('، ')||'—')}</td>
      <td><label style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" data-exc="${t.id}" ${W.excluded[t.id]?'checked':''} ${ed?'':'disabled'}> مستثنى</label></td></tr>`;
  }).join('');
  const empty = stages.reduce((n,s)=>{ const sc=stageCfg(s.key); sc.days.forEach(d=>{ for(let p=0;p<(+sc.ppd[d]||0);p++) if(!wCell(s.key,d,p).length) n++; }); return n; }, 0);
  body.innerHTML = `
    <div class="card"><div class="card-head"><h3>التوزيع والنشر</h3>
      ${ed?'<button class="btn" id="wAuto">⚙️ توزيع تلقائي</button><button class="btn sec" id="wPub">✔ اعتماد ونشر</button>':''}
      <button class="btn sec" id="wPrint">🖨️ طباعة PDF</button></div>
      <div class="sub" style="margin-top:6px">حصة انتظار واحدة في اليوم لكل معلم، ونصابه مع الانتظار لا يتجاوز حدّه. يُتجنَّب يومه الذهبي ما أمكن. من ١ إلى ٤ معلمين في الحصة. ${empty?`<b style="color:var(--warn)">خانات بلا انتظار: ${ar(empty)}</b> — أسندها يدويًا بـ ＋.`:''}</div></div>
    <div class="card"><h3>المعلمون</h3>
      <div class="sub" style="margin-bottom:8px">الحد افتراضيًا النصاب النظامي للمعلم (٢٤)، ويُعدَّل لكل معلم. المستثنى لا يدخل التوزيع الآلي ويُسنَد له يدويًا.</div>
      <div style="overflow-x:auto"><table class="tbl"><tr><th>المعلم</th><th>النصاب</th><th>الحد</th><th>الانتظار (المخصص / المستهدف)</th><th>اليوم الذهبي</th><th></th></tr>${rows}</table></div></div>
    ${stages.map(s=>`<div class="card"><h3>جدول الانتظار — ${esc(s.label)}</h3>${wGridHtml(s.key,(d,p)=>{
        const list = wCell(s.key,d,p);
        return `<td class="${ed?'wcell':''}" data-wc="${s.key}|${d}|${p}" style="vertical-align:top;${list.length?'':'background:var(--bg-fff7e6,#fff7e6);'}${ed?'cursor:pointer':''}">${list.map((tid,i)=>`<div style="font-size:12px;white-space:nowrap">انتظار${ar(i+1)}: <b>${esc(teacherName(tid))}</b></div>`).join('')}${ed && list.length<W_MAX?'<div style="color:var(--brand);font-weight:800">＋</div>':''}</td>`;
      })}</div>`).join('')}`;
  $('#wPrint').onclick = wPrintGeneral;
  if(!ed) return;
  $('#wAuto').onclick = ()=>{
    const has = Object.values(W.grid).some(g=>Object.keys(g||{}).length);
    const go = ()=>{ wAutoDistribute(); toast('تم التوزيع'); show('waiting'); };
    if(has) confirmBox('إعادة التوزيع', 'يُستبدل جدول الانتظار الحالي (ومنه تعديلاتك اليدوية). متابعة؟', 'توزيع', true).then(ok=>{ if(ok) go(); }); else go();
  };
  $('#wPub').onclick = wPublish;
  $$('[data-cap]').forEach(i=>i.onchange=()=>{ const v = Math.max(0, Math.min(40, +i.value||0)); W.caps[i.dataset.cap] = v; markDirty(docIds.waiting()); show('waiting'); });
  $$('[data-exc]').forEach(c=>c.onchange=()=>{ if(c.checked) W.excluded[c.dataset.exc] = true; else delete W.excluded[c.dataset.exc]; markDirty(docIds.waiting()); show('waiting'); });
  $$('[data-wc]').forEach(td=>td.onclick=()=>{ const [sk,d,p] = td.dataset.wc.split('|'); wEditCell(sk, +d, +p); });
}
function wEditCell(sk, d, p){
  const list = wCell(sk, d, p).slice(), A = wAssigned();
  const draw = ()=>{
    const pool = wTeachersOf(sk).concat(teachers().filter(t=>!(teacherStagesNow(t)||[]).includes(sk) && wLessonMap()[t.id] && !wBusy(t.id, sk, d, p)))
      .filter((t,i,arr)=>arr.findIndex(x=>x.id===t.id)===i && !list.includes(t.id) && !wBusy(t.id, sk, d, p));
    const opts = pool.map(t=>{
      const dayUsed = (A[t.id] && A[t.id].days.has(d)) ? true : false;
      const over = wLoad(t.id) + ((A[t.id]||{}).count||0) >= wCap(t.id);
      const gold = wGolden(t.id, sk)===d;
      return { t, dayUsed, over, gold };

async function wLoadDay(date, fresh){

  return TT.wdayCache[date];
}
function wWeekDates(date){ const d = new Date(date+'T12:00:00'); d.setDate(d.getDate()-d.getDay()); const out=[]; for(let i=0;i<5;i++){ const x=new Date(d); x.setDate(d.getDate()+i); out.push(wDk(x)); } return out; }

function wToggleAbsent(tid, on){

  if(on) DY.items.forEach(it=>{ if(it.subTid===tid){ it.subTid = ''; it.subName = ''; } });   // صار غائبًا فلا يكون بديلًا
  if(on){
    const t = teacherById(tid);
    wAbsentLessons(tid, date).forEach(l=>{
      const it = Object.assign({ absentTid:tid, absentName:t?t.name:'', subTid:'', subName:'' }, l);
      // معلم انتظار واحد صالح في الحصة: يُحدَّد آليًا
      const valid = wCell(l.st, l.d, l.p).filter(x=>wSubValid(x, it, DY));

    const host = document.createElement('div'); host.style.cssText = 'position:fixed;left:-10000px;top:0;z-index:-1'; host.innerHTML = html; document.body.appendChild(host);
    const canvas = await window.html2canvas(host.firstElementChild, { scale:2, backgroundColor:'#ffffff' });
    host.remove();
    const pdf = new window.jspdf.jsPDF({ orientation:'p', unit:'mm', format:'a4' });
    const pw = 210, ph = 297, imgH = canvas.height * pw / canvas.width;
    const pageCanvasH = Math.floor(canvas.width * ph / pw);
    for(let y=0, n=0; y < canvas.height; y += pageCanvasH, n++){
      const c = document.createElement('canvas'); c.width = canvas.width; c.height = Math.min(pageCanvasH, canvas.height - y);
      c.getContext('2d').drawImage(canvas, 0, y, canvas.width, c.height, 0, 0, canvas.width, c.height);
      if(n) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, pw, c.height * pw / canvas.width);
    }
    const name = 'سجل-الانتظار-'+date+'.pdf';
    const blob = pdf.output('blob');
    const file = new File([blob], name, { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'سجل توزيع حصص الانتظار', text:'سجل توزيع حصص الانتظار — '+date });
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
      toast('نُزِّل الملف — أرفقه في واتساب');
    }
  }catch(e){ if(e && e.name==='AbortError') return; toast('تعذّر إنشاء PDF: '+(e.message||e)); }
}

/* =========================================================================
   ص-١٣) طريقة بناء الجدول: «إعداد من الصفر» أو «جدول جاهز»
   الجدول الجاهز بثلاث طرق تنتهي كلها بنفس الشيء: قائمة حصص موحّدة {sk,d,p,tid,code,subj}
   ← فحص كامل (أخطاء تمنع، والرغبات تنبيه فقط) ← مسودة مثبّتة الحصص + «تراجع عن الاستيراد».
     (أ) المستورد المرن لملفات البرامج الأخرى (Excel) + نافذة الربط (معلمون/شعب/مواد) + المعلم الجديد (تعميد المدير)
     (ب) قالب النظام (Excel بقوائم منسدلة) — يُرفع فيملأ شاشة الإدخال اليدوي
     (ج) الإدخال اليدوي داخل الموقع (الجدول العام: المعلمون صفوف، الخانة «الشعبة – المادة»)
   ========================================================================= */
docIds.manual    = (p)=>(p||TT.period)+'_manual';       // شبكة الإدخال اليدوي
docIds.impUndo   = (p)=>(p||TT.period)+'_importUndo';   // ما قبل آخر استيراد (للتراجع)
docIds.impJob    = (p)=>(p||TT.period)+'_importJob';    // استيراد معلّق بانتظار تعميد المدير
docIds.impMaps   = ()=>'importMaps';                    // الربط المحفوظ وأشكال البرامج (للمدرسة)
const IMP = { view:'hub', stage:null, flex:null, report:null };
const nz = s=>normDigits(String(s==null?'':s)).replace(/[ـً-ْ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim().toLowerCase();
const nzw = s=>nz(s).split(' ').map(w=>w.replace(/^ال(?=\S\S)/,'')).join(' ');
const nzc = s=>nz(s).replace(/[\s\/\\\-–_.|،,()]/g,'');
function buildMode(){ return (cfg() && cfg().buildMode) || ''; }
function hasAnyDraft(){ return enabledStages().some(s=>{ const d = tableDoc(s.key,'draft'); return d && (d.lessons||[]).length; }); }
function impPrereqs(){
  const miss = [];
  if(!enabledStages().length) miss.push(['settings','فعّل مرحلة واحدة على الأقل وحدّد أوقات حصصها']);
  else if(!enabledStages().some(s=>stageClasses(s.key).length)) miss.push(['classes','لا توجد شعب مسجّلة للمراحل المفعّلة']);
  if(!teachers().length) miss.push(['teachers','أضف المعلمين إلى سجل معلمي الأداة']);
  return miss;
}
// خيار المادة في خطة الشعبة بالاسم (معرّفات المواد خاصة بكل خطة)
function planSubjByName(code, name){ const c = classByCode(code); if(!c) return null; const k = nzw(name); return planOf(planKeyOf(c)).find(s=>nzw(s.name)===k) || null; }
function slotBusyTime(sk, d, p){ const b = bell(sk, d).periods[p]; return b ? { start:b.start, end:b.end } : null; }

/* ---------- الفحص الكامل ---------- */
// entries: [{sk,d,p,tid,code,subj}] — يُرجع {errors:[{t,msg}], missingSubjects:[{code,pk,name,count}], plan}
function impValidate(entries){
  const errors = [], E = (t,msg)=>errors.push({ t, msg });
  const stagesIn = [...new Set(entries.map(e=>e.sk))].filter(Boolean);
  if(!entries.length){ E('empty','لا توجد حصص في الجدول.'); return { errors, missingSubjects:[], stagesIn }; }
  // ١) الشعب: تطابق تام لكل مرحلة مستوردة
  stagesIn.forEach(sk=>{
    const reg = new Set(stageClasses(sk).map(c=>String(c.code)));
    const got = new Set(entries.filter(e=>e.sk===sk).map(e=>String(e.code)));
    const missing = [...reg].filter(x=>!got.has(x)), extra = [...got].filter(x=>!reg.has(x));
    if(missing.length) E('classes', `${STAGE_BY_KEY[sk].label}: شعب مسجّلة غير موجودة في الجدول المستورد — ${missing.map(classLabel).join('، ')}`);
    if(extra.length) E('classes', `${STAGE_BY_KEY[sk].label}: شعب في الجدول المستورد غير مسجّلة — ${extra.join('، ')}`);
  });
  if(errors.length) return { errors, missingSubjects:[], stagesIn, classStop:true };
  // ٢) المواد: كل مادة في خطة شعبتها
  const missingSubjects = []; const ms = {};
  entries.forEach(e=>{ const s = planSubjByName(e.code, e.subj); if(s){ e.sid = s.id; return; }
    const c = classByCode(e.code); const k = planKeyOf(c)+'|'+nzw(e.subj);
    (ms[k] = ms[k] || { pk:planKeyOf(c), name:e.subj, codes:{}, count:0 }); ms[k].codes[e.code] = (ms[k].codes[e.code]||0)+1; });
  Object.values(ms).forEach(m=>{ const counts = Object.values(m.codes); missingSubjects.push({ pk:m.pk, name:m.name, weekly:Math.max(...counts), classes:Object.keys(m.codes) }); });
  if(missingSubjects.length){ missingSubjects.forEach(m=>E('subject', `المادة «${m.name}» غير موجودة في خطة ${planKeyLabel(m.pk)} (${m.classes.map(classLabel).join('، ')})`)); return { errors, missingSubjects, stagesIn, subjStop:true }; }
  // ٣) أوقات موجودة، وتعارض الشعبة والمعلم، وعدم التوفر
  const bySlotC = {}, bySlotT = {};
  entries.forEach(e=>{
    const sc = stageCfg(e.sk);
    if(!sc.days.includes(e.d) || e.p<0 || e.p >= (+sc.ppd[e.d]||0)){ E('slot', `${classLabel(e.code)} «${e.subj}»: ${WEEKDAYS[e.d]||'?'} الحصة ${ar(e.p+1)} غير موجودة في إعدادات ${STAGE_BY_KEY[e.sk].label}`); return; }
    const kc = e.sk+'|'+e.d+'|'+e.p+'|'+e.code; if(bySlotC[kc]) E('class2', `${classLabel(e.code)}: حصتان في ${WEEKDAYS[e.d]} الحصة ${ar(e.p+1)} («${bySlotC[kc].subj}» و«${e.subj}»)`); else bySlotC[kc] = e;
    const t = teacherById(e.tid);
    if(!t){ E('teacher', `معلم غير موجود لحصة ${classLabel(e.code)} «${e.subj}»`); return; }
    const kt = e.sk+'|'+e.d+'|'+e.p+'|'+e.tid; if(bySlotT[kt]) E('teacher2', `${t.name}: في مكانين ${WEEKDAYS[e.d]} الحصة ${ar(e.p+1)} (${classLabel(bySlotT[kt].code)} و${classLabel(e.code)})`); else bySlotT[kt] = e;
    if(((t.unavail||{})[e.sk]||[]).includes(e.d+'-'+e.p)) E('unavail', `${t.name}: غير متوفر ${WEEKDAYS[e.d]} الحصة ${ar(e.p+1)}`);
  });
  // تعارض المعلم بين مرحلتين (بالوقت)، ومع مراحل لم تُستورد
  const byT = {}; entries.forEach(e=>{ (byT[e.tid] = byT[e.tid] || []).push(e); });
  Object.entries(byT).forEach(([tid,list])=>{
    const others = [];
    STAGES.forEach(o=>{ if(stagesIn.includes(o.key) || !stageCfg(o.key) || !stageCfg(o.key).enabled) return;
      const doc = tableDoc(o.key,'draft') || tableDoc(o.key,'approved');
      (doc && doc.lessons || []).forEach(l=>{ if(l.d!=null && l.t===tid) for(let k=0;k<(l.n||1);k++) others.push({ sk:o.key, d:l.d, p:l.p+k, code:l.c }); }); });
    const all = list.concat(others);
    for(let i=0;i<all.length;i++) for(let j=i+1;j<all.length;j++){
      const a = all[i], b = all[j]; if(a.sk===b.sk || a.d!==b.d) continue;
      const ta = slotBusyTime(a.sk,a.d,a.p), tb = slotBusyTime(b.sk,b.d,b.p);
      if(ta && tb && ta.start < tb.end && tb.start < ta.end) E('teacher2', `${teacherName(tid)}: تعارض بين ${STAGE_BY_KEY[a.sk].label} و${STAGE_BY_KEY[b.sk].label} ${WEEKDAYS[a.d]} (${classLabel(a.code)} و${classLabel(b.code)})`);
    }
  });
  // ٤) مادة الشعبة لمعلم واحد
  const asg = {};
  entries.forEach(e=>{ const k = e.code+'|'+e.sid; (asg[k] = asg[k] || new Set()).add(e.tid); });
  Object.entries(asg).forEach(([k,set])=>{ if(set.size>1){ const [code] = k.split('|'); const s = entries.find(e=>e.code+'|'+e.sid===k); E('assign', `${classLabel(code)} «${s.subj}»: مسندة لأكثر من معلم (${[...set].map(teacherName).join('، ')})`); } });
  // ٥) عدد حصص كل مادة = الخطة، والمزدوجة متتالية
  const cnt = {}; entries.forEach(e=>{ const k = e.code+'|'+e.sid; (cnt[k] = cnt[k] || []).push(e); });
  stagesIn.forEach(sk=>stageClasses(sk).forEach(c=>{
    planOf(planKeyOf(c)).forEach(s=>{
      const w = +s.weekly||0, got = (cnt[c.code+'|'+s.id]||[]);
      if(got.length !== w) E('count', `${classLabel(c.code)} «${s.name}»: ${ar(got.length)} حصة والخطة ${ar(w)}`);
      else if(s.consec==='require' && w>=2 && !impPairDoubles(sk, got, w)) E('double', `${classLabel(c.code)} «${s.name}»: الحصص المزدوجة غير متتالية`);
    });
  }));
  // ٦) النصاب: المستورد + مراحل لم تُستورد ≤ النصاب النظامي
  const L = teacherLoads();
  Object.entries(byT).forEach(([tid,list])=>{
    const t = teacherById(tid); if(!t) return;
    let total = list.length; STAGES.forEach(o=>{ if(!stagesIn.includes(o.key)) total += ((L[tid]||{})[o.key]||0); });
    if(total > (+t.quota||0)) E('quota', `${t.name}: نصابه ${ar(total)} يتجاوز نصابه النظامي ${ar(+t.quota||0)}`);
  });
  return { errors, missingSubjects:[], stagesIn };
}
// تقسيم حصص مادة مزدوجة إلى أزواج متتالية (لا تعبر فسحة) + مفردة إن كان العدد فرديًا
function impPairDoubles(sk, list, w){
  const brk = new Set(breakAfterIdx(sk));
  const byDay = {}; list.forEach(e=>{ (byDay[e.d] = byDay[e.d] || []).push(e.p); });
  const pairs = [], singles = [];
  Object.entries(byDay).forEach(([d,ps])=>{ ps.sort((a,b)=>a-b); for(let i=0;i<ps.length;i++){ if(i+1<ps.length && ps[i+1]===ps[i]+1 && !brk.has(ps[i])){ pairs.push({ d:+d, p:ps[i] }); i++; } else singles.push({ d:+d, p:ps[i] }); } });
  const needPairs = Math.floor(w/2), needSingles = w%2;
  if(pairs.length < needPairs) return null;
  // أزواج زائدة تتحول لمفردتين
  while(pairs.length > needPairs){ const x = pairs.pop(); singles.push({ d:x.d, p:x.p }, { d:x.d, p:x.p+1 }); }
  if(singles.length !== needSingles) return null;
  return { pairs, singles };
}

/* ---------- إنشاء المسودة ---------- */
async function impBuild(entries, stagesIn, source){
  if(pendingSaves.size) await flushSaves();
  // ما قبل الاستيراد (للتراجع)
  const undo = { at:Date.now(), by:TT.me.id, source, buildMode: buildMode(), assign: clone(amap()), plans: clone(cfg().plans), stages:{} };
  stagesIn.forEach(sk=>{ const d = tableDoc(sk,'draft'); undo.stages[sk] = d ? clone(d) : null; });
  TT.docs[docIds.impUndo()] = TT.docs[docIds.impUndo()] || { rev:0, data:null };
  TT.docs[docIds.impUndo()].data = undo; markDirty(docIds.impUndo());
  // الإسناد من الجدول: يُستبدل إسناد شعب المراحل المستوردة كاملًا
  const m = amap();
  stagesIn.forEach(sk=>stageClasses(sk).forEach(c=>{ m[c.code] = {}; }));
  entries.forEach(e=>{ m[e.code][e.sid] = e.tid; });
  markDirty(docIds.assign());
  invalidateStage();
  // المسودات: حصص مثبّتة بمعرّفات وحدات المحرك
  stagesIn.forEach(sk=>{
    const lessons = [];
    const units = buildUnits(sk);
    const byCS = {}; entries.filter(e=>e.sk===sk).forEach(e=>{ (byCS[e.code+'|'+e.sid] = byCS[e.code+'|'+e.sid] || []).push(e); });
    Object.entries(byCS).forEach(([k,list])=>{
      const [code, sid] = k.split('|');
      const us = units.filter(u=>u.classCode===code && u.subjectId===sid);
      const dbl = us.filter(u=>u.len===2), sgl = us.filter(u=>u.len===1);
      let slotsD = [], slotsS = list.map(e=>({ d:e.d, p:e.p })).sort((a,b)=>a.d-b.d||a.p-b.p);
      if(dbl.length){ const pr = impPairDoubles(sk, list, list.length); slotsD = pr.pairs; slotsS = pr.singles; }
      dbl.forEach((u,i)=>{ const s = slotsD[i]; if(s) lessons.push({ id:u.id, c:code, s:sid, t:list[0].tid, d:s.d, p:s.p, n:2, pin:true }); });
      sgl.forEach((u,i)=>{ const s = slotsS[i]; if(s) lessons.push({ id:u.id, c:code, s:sid, t:list[0].tid, d:s.d, p:s.p, n:1, pin:true }); });
    });
    const id = docIds.table(sk,'draft');
    const prev = D(id) || {};
    TT.docs[id] = TT.docs[id] || { rev:0, data:null };
    TT.docs[id].data = Object.assign({}, prev, { lessons, generatedAt: Date.now(), importedAt: Date.now(), importSource: source, updatedAt: Date.now() });
    markDirty(id);
  });
  cfg().buildMode = 'ready'; markDirty(docIds.config());
  invalidateStage();
  await flushSaves();
}
async function impUndo(){
  const u = D(docIds.impUndo()); if(!u || !u.at || u.cleared) return;
  const ok = await confirmBox('تراجع عن الاستيراد', 'تعود المسودة والإسناد والخطط إلى ما كانت عليه قبل آخر استيراد ('+new Date(u.at).toLocaleString('ar-SA')+'). الجدول المعتمد لا يتأثر.', 'تراجع', true);
  if(!ok) return;
  TT.docs[docIds.assign()].data = { map: clone(u.assign||{}) }; markDirty(docIds.assign());
  cfg().plans = clone(u.plans||{}); cfg().buildMode = u.buildMode||'ready'; markDirty(docIds.config());
  Object.entries(u.stages||{}).forEach(([sk,d])=>{ const id = docIds.table(sk,'draft'); TT.docs[id] = TT.docs[id] || { rev:0, data:null }; TT.docs[id].data = d ? clone(d) : { lessons:[] }; markDirty(id); });
  TT.docs[docIds.impUndo()].data = { cleared:true, at:u.at }; markDirty(docIds.impUndo());
  invalidateStage(); await flushSaves(); toast('تم التراجع عن الاستيراد'); show('table');
}
/* نافذة النتيجة: أخطاء تمنع (مع «إضافة كمادة») أو مسودة + تنبيهات الرغبات */
async function impCheckAndBuild(entries, source){
  const v = impValidate(entries);
  if(v.errors.length){ impShowErrors(v, entries, source); return false; }
  await impBuild(entries, v.stagesIn, source);
  const warn = [];
  v.stagesIn.forEach(sk=>{ const S = getStageState(sk,'draft'); const rep = TTEngine.evaluate(S.pr, S.st); rep.violations.forEach(x=>warn.push(STAGE_BY_KEY[sk].label+' — '+violationText(x, sk))); });
  modal(`<h2>✔ أُنشئت المسودة</h2><div>${ar(entries.length)} حصة في ${v.stagesIn.map(sk=>STAGE_BY_KEY[sk].label).join(' و')}. الحصص مثبّتة، ويُبنى الإسناد منها. راجعها ثم اعتمدها من قسم «الجدول».</div>

const ORD_KEYS = ['اول','ثاني','ثالث','رابع','خامس','سادس','سابع','ثامن','تاسع','عاشر'];
function periodIdx(v){
  let s = nzw(v).replace(/^حصه\s*/,'').replace(/\s+/g,''); if(!s) return null;
  if(/^\d{1,2}$/.test(s)){ const n=+s; return n>=1 && n<=MAX_PERIODS ? n-1 : null; }
  s = s.replace(/[هي]$/,'').replace(/ي$/,'');
  const i = ORD_KEYS.findIndex(k=>s===k || s===k+'ي' || s===k.replace(/ي$/,''));
  return i>=0 ? i : null;
}
function splitCell(v){
  const t = String(v==null?'':v).trim(); if(!t) return [];
  let parts = t.split(/\r?\n|\/|\||،|,|\s[-–]\s|–/).map(x=>x.trim()).filter(Boolean);
  if(parts.length===1){ const m = /^(\S*\d\S*)\s+(.+)$/.exec(t) || /^(.+?)\s+(\S*\d\S*)$/.exec(t); if(m) parts = [m[1], m[2]]; }
  return parts;
}
function sheetRows(ws){
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', raw:false, blankrows:true });
  (ws['!merges']||[]).forEach(mg=>{ const v = (rows[mg.s.r]||[])[mg.s.c]; for(let r=mg.s.r;r<=mg.e.r;r++){ rows[r] = rows[r]||[]; for(let c=mg.s.c;c<=mg.e.c;c++) if(rows[r][c]==='' || rows[r][c]==null) rows[r][c] = v; } });
  return rows;
}
function classKeyMatch(str){
  const k = nzc(str); if(!k) return '';
  const cls = impStages().flatMap(s=>stageClasses(s.key));
  const hit = cls.filter(c=>[c.code, classLabel(c.code), c.name, (c.name||'')+c.code].some(x=>nzc(x)===k));
  return hit.length===1 ? String(hit[0].code) : '';
}
function teacherNameMatches(str){ const k = nzw(str); return teachers().filter(t=>nzw(t.name)===k); }
// ترتيب جزأي الخانة: أيهما الشعبة (أو المعلم في جدول الشعبة)
function pickParts(parts, kind){
  if(parts.length<2) return null;
  const [a,b] = parts.length>2 ? [parts[0], parts.slice(1).join(' ')] : parts;
  if(kind==='class'){ if(classKeyMatch(a) || (/\d/.test(a) && !/\d/.test(b))) return { cls:a, other:b }; if(classKeyMatch(b) || /\d/.test(b)) return { cls:b, other:a }; return { cls:a, other:b }; }
  if(kind==='teacher'){ if(teacherNameMatches(b).length) return { tch:b, other:a }; if(teacherNameMatches(a).length) return { tch:a, other:b }; return { tch:b, other:a }; }
}
function blockTitle(rows, r){
  for(let k=r-1;k>=Math.max(0,r-3);k--){ const cell = (rows[k]||[]).find(x=>String(x).trim()); if(cell) return String(cell).replace(/^.*?(جدول\s*(المعلم|المعلمه|الفصل|الشعبه|الشعبة|الصف)?\s*[:：]?)/,'').replace(/^(المعلم|الفصل|الشعبة|الصف)\s*[:：]\s*/,'').trim(); }
  return '';
}
// يحوّل ورقة إلى حصص خام {d,p,tStr,tId,cStr,sStr} حسب الشكل والخيارات
function parseSheet(name, rows, layout, o){
  const out = [], bad = { n:0 };
  if(layout==='list'){
    const h = (+o.headerRow||1)-1;
    for(let r=h+1;r<rows.length;r++){ const row = rows[r]||[]; const g = c=>c===''||c==null ? '' : String(row[+c]||'').trim();
      if(!row.some(x=>String(x).trim())) continue;
      const d = dayIdx(g(o.colDay)), p = periodIdx(g(o.colPeriod));
      const rec = { d, p, cStr:g(o.colClass), sStr:g(o.colSubject), tStr:g(o.colTeacher), tId: normDigits(g(o.colId)).trim() };
      if(d==null || p==null || !rec.cStr || (!rec.tStr && !rec.tId)){ bad.n++; continue; } out.push(rec); }
    return { out, bad:bad.n };
  }
  if(layout==='tgrid' || layout==='cgrid'){
    for(let r=0;r<rows.length;r++){
      const row = rows[r]||[];
      const pcols = {}; row.forEach((v,c)=>{ const p = periodIdx(v); if(p!=null) pcols[c] = p; });
      const dcols = {}; row.forEach((v,c)=>{ const d = dayIdx(v); if(d!=null) dcols[c] = d; });
      const isP = Object.keys(pcols).length>=3, isD = Object.keys(dcols).length>=3;
      if(!isP && !isD) continue;
      const title = (o.titleFrom==='sheet' ? name : (blockTitle(rows, r) || name));
      let rr = r+1;
      for(; rr<rows.length; rr++){
        const row2 = rows[rr]||[];
        const lead = row2.slice(0,2).map(x=>String(x).trim()).find(Boolean) || '';
        const k = isP ? dayIdx(lead) : periodIdx(lead);
        if(k==null){ if(row2.some(x=>String(x).trim())) break; else continue; }
        Object.entries(isP ? pcols : dcols).forEach(([c,idx])=>{
          const v = String(row2[c]||'').trim(); if(!v) return;
          const d = isP ? k : idx, p = isP ? idx : k;
          const parts = splitCell(v);
          if(layout==='tgrid'){ const pp = pickParts(parts,'class'); if(!pp){ bad.n++; return; } out.push({ d, p, tStr:title, cStr: o.swap ? pp.other : pp.cls, sStr: o.swap ? pp.cls : pp.other }); }
          else { const pp = pickParts(parts,'teacher'); if(!pp){ bad.n++; return; } out.push({ d, p, cStr:title, tStr: o.swap ? pp.other : pp.tch, sStr: o.swap ? pp.tch : pp.other }); }
        });
      }
      r = rr-1;
    }
    return { out, bad:bad.n };
  }
  if(layout==='master'){
    let dr = -1; for(let r=0;r<Math.min(rows.length,15);r++){ if((rows[r]||[]).filter(v=>dayIdx(v)!=null).length>=3){ dr = r; break; } }
    if(dr<0) return { out, bad:0, err:'لم يُعثر على صف الأيام' };
    const pr = dr+1; const cols = [];
    (rows[dr]||[]).forEach((v,c)=>{ const d = dayIdx(v), p = periodIdx((rows[pr]||[])[c]); if(d!=null && p!=null) cols.push({ c, d, p }); });
    const nameCol = o.colTeacher!=='' && o.colTeacher!=null ? +o.colTeacher : (()=>{ for(let c=0;c<5;c++){ if(cols.some(x=>x.c===c)) continue; if(rows.slice(pr+1,pr+8).some(rw=>String((rw||[])[c]||'').trim() && !/^\d+$/.test(String((rw||[])[c]).trim()))) return c; } return 0; })();
    const idCol = o.colId!=='' && o.colId!=null ? +o.colId : -1;
    for(let r=pr+1;r<rows.length;r++){ const row = rows[r]||[]; const tStr = String(row[nameCol]||'').trim(); if(!tStr) continue;
      const tId = idCol>=0 ? normDigits(String(row[idCol]||'')).trim() : '';
      cols.forEach(x=>{ const v = String(row[x.c]||'').trim(); if(!v) return; const pp = pickParts(splitCell(v),'class'); if(!pp){ bad.n++; return; } out.push({ d:x.d, p:x.p, tStr, tId, cStr: o.swap ? pp.other : pp.cls, sStr: o.swap ? pp.cls : pp.other }); }); }
    return { out, bad:bad.n };
  }
  return { out, bad:0 };
}
function guessLayout(wb, sheets){
  const rows = sheetRows(wb.Sheets[sheets[0]]);
  const kw = r=>(rows[r]||[]).map(nzw);
  for(let r=0;r<Math.min(rows.length,10);r++){ const k = kw(r); if(k.some(x=>x.includes('يوم')) && k.some(x=>x.includes('حصه')) && k.some(x=>/فصل|شعبه|صف/.test(x))) return { layout:'list', headerRow:r+1, cols:k }; }
  for(let r=0;r<Math.min(rows.length,15);r++){ if((rows[r]||[]).filter(v=>dayIdx(v)!=null).length>=3 && (rows[r+1]||[]).filter(v=>periodIdx(v)!=null).length>=3 && rows.length > r+4) return { layout:'master' }; }
  return { layout:'tgrid' };
}
function fileSig(wb, sheets){ const rows = sheetRows(wb.Sheets[sheets[0]]); return nz(rows.slice(0,6).flat().filter(x=>String(x).trim()).slice(0,8).join('|')); }

function impFlexParse(){
  const F = IMP.flex; let raw = [], bad = 0, err = '';

  F.raw = raw; F.bad = bad; F.err = err; return raw;
}

function impFlexInitMap(){
  const F = IMP.flex, M = impMaps();
  const T = {}, C = {}, S = {};
  F.raw.forEach(r=>{
    const tk = r.tId ? 'id:'+r.tId : 'n:'+nzw(r.tStr);
    const t = T[tk] = T[tk] || { key:tk, label:r.tStr||r.tId, tId:r.tId, ctx:{}, n:0 }; t.n++; t.ctx[r.cStr+' '+r.sStr] = 1;
    const ck = nzc(r.cStr); (C[ck] = C[ck] || { key:ck, label:r.cStr, n:0 }).n++;
    const sk = nzw(r.sStr); (S[sk] = S[sk] || { key:sk, label:r.sStr, n:0 }).n++;
  });
  Object.values(T).forEach(t=>{
    let v = M.teachers[t.key] && teacherById(M.teachers[t.key]) ? M.teachers[t.key] : '';
    if(!v && t.tId){ const hit = teachers().find(x=>normDigits(x.nid||'').trim()===t.tId); if(hit) v = hit.id; }
    const nm = teacherNameMatches(t.label); t.dup = nm.length>1;
    if(!v && nm.length===1) v = nm[0].id;
    t.val = v;
  });
  Object.values(C).forEach(c=>{ c.val = (M.classes[c.key] && classByCode(M.classes[c.key])) ? M.classes[c.key] : classKeyMatch(c.label); });
  const subjNames = [...new Set(impStages().flatMap(s=>stageClasses(s.key).flatMap(c=>planOf(planKeyOf(c)).map(x=>x.name))))];
  Object.values(S).forEach(s=>{ const saved = M.subjects[s.key]; s.val = saved && subjNames.some(n=>nzw(n)===nzw(saved)) ? saved : (subjNames.find(n=>nzw(n)===s.key) || ''); });
  F.mapT = T; F.mapC = C; F.mapS = S; F.subjNames = subjNames;
}

    // حفظ الربط
    const M = impMaps();
    Object.values(F.mapT).forEach(t=>{ if(t.val && t.val!=='__new__') M.teachers[t.key] = t.val; });
    Object.values(F.mapC).forEach(c=>{ M.classes[c.key] = c.val; });
    Object.values(F.mapS).forEach(s=>{ if(s.val) M.subjects[s.key] = s.val; });
    markDirty(docIds.impMaps());
    if(Object.values(F.mapT).some(t=>t.val==='__new__')){ F.step='newT'; show('imp'); return; }
    impFlexFinish();
  };
}
function impFlexEntries(){
  const F = IMP.flex;
  return F.raw.map(r=>{
    const t = F.mapT[r.tId ? 'id:'+r.tId : 'n:'+nzw(r.tStr)], c = F.mapC[nzc(r.cStr)], s = F.mapS[nzw(r.sStr)];
    const code = c && c.val; const cl = classByCode(code);
    return { sk: cl ? classStageKey(cl) : null, d:r.d, p:r.p, tid: t ? t.val : '', code: String(code||''), subj: (s && s.val) || r.sStr };
  });
}
function impFlexFinish(){ const entries = impFlexEntries(); IMP.flex = null; impCheckAndBuild(entries, 'flex'); }

/* ---------- المعلم الجديد: يُضاف مباشرة إن كان المستورد المدير، وإلا طلب تعميد للمدير ويتوقف الاستيراد ---------- */
const isPrincipal = ()=>TT.me.role==='schoolAdmin' || TT.me.role==='admin';
const TEACHER_DEFAULT_PERMS = (()=>{ const a = { access:true, edit:true, del:false }, f = { access:true, edit:true, del:true };
  return { 'index.sent':a, 'index.received':a, 'omr.classes':f, 'omr.classes.info':f, 'omr.classes.names':f, 'omr.design':f, 'omr.grade':f, 'omr.results':f, 'omr.worklog':f, 'worksheets.enabled':a }; })();
function genPass(){ const ch='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789'; let s=''; for(let i=0;i<6;i++) s+=ch[Math.floor(Math.random()*ch.length)]; return s; }
function impFlexNewTeachers(body){
  const F = IMP.flex;
  const list = Object.values(F.mapT).filter(t=>t.val==='__new__');
  body.innerHTML = `<div class="card"><h3>٥) المعلمون الجدد (${ar(list.length)})</h3>
    <div class="sub">${isPrincipal()?'يُضافون مباشرة إلى المستخدمين وإلى سجل معلمي الجدول، وتظهر لك كلمات المرور الأولية.':'تُرسل طلبات تعميد إلى مدير المدرسة، و<b>يتوقف الاستيراد حتى يعمّدهم</b>، ثم تكمله من زر «متابعة الاستيراد».'}</div>
    <table class="tbl" style="margin-top:8px"><tr><th>الاسم</th><th>رقم الهوية</th><th>النصاب النظامي</th></tr>
      ${list.map((t,i)=>`<tr><td><input data-nn="${i}" value="${esc(t.label)}"></td><td><input data-ni="${i}" inputmode="numeric" value="${esc(t.tId||'')}" placeholder="أرقام فقط"></td><td><input data-nq="${i}" type="number" min="0" max="40" value="24" style="width:80px"></td></tr>`).join('')}</table>
    <div id="nwAlert"></div>
    <div class="row" style="gap:8px;margin-top:10px"><button class="btn sec" id="nwPrev">→ رجوع</button><span style="flex:1"></span><button class="btn" id="nwOk">${isPrincipal()?'إضافة ومتابعة':'إرسال للتعميد'}</button></div></div>`;
  $('#nwPrev').onclick = ()=>{ F.step='map'; show('imp'); };
  $('#nwOk').onclick = async()=>{
    const recs = list.map((t,i)=>({ t, name:($(`[data-nn="${i}"]`).value||'').trim(), nid:normDigits($(`[data-ni="${i}"]`).value||'').trim(), quota:Math.max(0,Math.min(40,+$(`[data-nq="${i}"]`).value||24)) }));
    const bad = recs.find(r=>!r.name || !/^\d+$/.test(r.nid));
    if(bad){ $('#nwAlert').innerHTML = '<div class="alert err">أدخل الاسم ورقم هوية صحيحًا (أرقام فقط) لكل معلم.</div>'; return; }
    if(recs.some(r=>teachers().some(x=>normDigits(x.nid||'').trim()===r.nid))){ $('#nwAlert').innerHTML = '<div class="alert err">رقم هوية موجود مسبقًا في سجل المعلمين — اربطه بالمعلم الموجود بدل «معلم جديد».</div>'; return; }
    $('#nwOk').disabled = true;
    try{
      const stagesOf = key=>[...new Set(F.raw.filter(r=>(r.tId?'id:'+r.tId:'n:'+nzw(r.tStr))===key).map(r=>{ const c = F.mapC[nzc(r.cStr)]; const cl = c && classByCode(c.val); return cl ? classStageKey(cl) : null; }).filter(Boolean))];
      let tplPerms = TEACHER_DEFAULT_PERMS;
      try{ const rt = await db.collection('schoolData').doc('roleTemplates').get(); const t = rt.exists && (rt.data().templates||{}).teacher; if(t && Object.keys(t).length) tplPerms = t; }catch(e){}
      const created = [], reqIds = [];
      for(const r of recs){
        const tid = uid('t');
        teachers().push({ id:tid, name:r.name, nid:r.nid, stages:stagesOf(r.t.key), quota:r.quota, unavail:{} });
        r.t.val = tid;
        if(isPrincipal()){
          const lr = await UsersAPI.call('loginIdInfo', { loginId: r.nid, schoolId: TT.sid });
          const exists = !!lr.conflictAtSchool;
          if(exists){ created.push(r.name+' ('+r.nid+'): مستخدم موجود مسبقًا — رُبط بالجدول'); continue; }
          const pass = genPass();
          await db.collection('users').add({ loginId:r.nid, username:r.name, role:'teacher', schoolId:TT.sid, assignedClasses:[], permissions:clone(tplPerms), active:true, password:pass, mustChangePassword:false, createdAt:Date.now(), updatedAt:Date.now() });
          created.push(r.name+' ('+r.nid+') — كلمة المرور الأولية: '+pass);
        } else {
          const ref = await db.collection('userRequests').add({ schoolId:TT.sid, period:TT.period, name:r.name, loginId:r.nid, role:'teacher', quota:r.quota, byUserId:TT.me.id, byName:TT.me.name, status:'pending', source:'timetableImport', createdAt:Date.now() });
          reqIds.push(ref.id);
        }
      }
      markDirty(docIds.teachers());
      const entries = impFlexEntries();
      if(isPrincipal()){
        await flushSaves();
        IMP.flex = null;
        modal(`<h2>✔ أُضيف المعلمون الجدد</h2><div class="sub">سلّم كل معلم رقم هويته وكلمة مروره الأولية للتفعيل.</div><div style="line-height:2;margin-top:8px">${created.map(x=>`<div>• ${esc(x)}</div>`).join('')}</div>
          <div class="modal-actions"><button class="btn" id="nwCont">متابعة: الفحص وإنشاء المسودة</button></div>`, 'wide');
        $('#nwCont').onclick = ()=>{ closeModal(); impCheckAndBuild(entries, 'flex'); };
      } else {
        TT.docs[docIds.impJob()] = TT.docs[docIds.impJob()] || { rev:0, data:null };
        TT.docs[docIds.impJob()].data = { status:'awaiting', at:Date.now(), by:TT.me.id, byName:TT.me.name, requests:reqIds, entries };
        markDirty(docIds.impJob()); await flushSaves();
        IMP.flex = null;
        modal(`<h2>⏳ أُرسلت طلبات التعميد</h2><div>أُرسل ${ar(reqIds.length)} طلب إلى مدير المدرسة (من «المستخدمون»). يتوقف الاستيراد حتى يعمّدهم، ثم اضغط «متابعة الاستيراد» في قسم «الجدول».</div>
          <div class="modal-actions"><button class="btn" onclick="closeModal();show('table')">حسنًا</button></div>`);
      }
    }catch(e){ $('#nwOk').disabled = false; $('#nwAlert').innerHTML = '<div class="alert err">'+esc(e.message||String(e))+'</div>'; }
  };
}
// استيراد معلّق بانتظار التعميد
function impJobBanner(){
  const j = D(docIds.impJob()); if(!j || j.status!=='awaiting') return '';
  return `<div class="alert warn" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">⏳ استيراد معلّق بانتظار تعميد المدير لـ${ar((j.requests||[]).length)} معلم جديد (أرسله ${esc(j.byName||'')}).
    <span style="flex:1"></span>${TT.canEdit?'<button class="btn sm" id="jobGo">متابعة الاستيراد</button><button class="btn sm ghost" id="jobCancel">إلغاء</button>':''}</div>`;
}
function impBindJob(){
  if($('#jobCancel')) $('#jobCancel').onclick = async()=>{ if(!await confirmBox('إلغاء الاستيراد المعلّق','يُلغى الاستيراد المعلّق (طلبات التعميد تبقى عند المدير).','إلغاء الاستيراد',true)) return; D(docIds.impJob()).status='cancelled'; markDirty(docIds.impJob()); await flushSaves(); show('table'); };
  if($('#jobGo')) $('#jobGo').onclick = async()=>{
    const j = D(docIds.impJob());
    const sts = await Promise.all((j.requests||[]).map(id=>db.collection('userRequests').doc(id).get().then(s=>s.exists ? s.data().status : 'missing').catch(()=>'unknown')));
    const pend = sts.filter(s=>s==='pending').length, rej = sts.filter(s=>s==='rejected' || s==='missing').length;
    if(rej){ modal(`<h2>رُفض طلب أو أكثر</h2><div>رفض المدير ${ar(rej)} طلبًا. أعد الاستيراد واربط هؤلاء بمعلمين موجودين.</div><div class="modal-actions"><button class="btn" onclick="closeModal()">حسنًا</button></div>`); return; }
    if(pend){ toast('بانتظار تعميد '+ar(pend)+' من '+ar(sts.length)); return; }
    j.status = 'done'; markDirty(docIds.impJob());
    impCheckAndBuild(j.entries, 'flex');
  };
}
</script>
