      if(b=g('data-oc2')){ openCase(b.dataset.oc2); return; }
      if(b=g('data-nc')){ if(!canEdit) return; formModal('فتح دراسة حالة', [{k:'stu',l:'الطالب',t:'student',req:true},{k:'type',l:'نوع الحالة',t:'select',o:CASE_TYPES},{k:'src',l:'سبب الفتح',t:'text'}], {type:CASE_TYPES[0]}, async out=>{ const c = await newCase({seat:out.seat, name:out.name, cls:out.className, type:out.type, src:out.src||'فتح مباشر'}); render(); openCase(c.id); }); return; }
      if(b=g('data-cl')){ printTable('كشف الحالات الفردية', [['الطالب',x=>x.name],['الصف',x=>x.className],['النوع',x=>x.type],['الحالة',x=>(CASE_ST[x.st]||[''])[0]],['المصدر',x=>x.src],['المتابعة القادمة',x=>dshow(x.nextFollow)]], homeCases('cases'), {top:'<div class="cnf">سري</div>'}); return; }
      if(b=g('data-add')){ const p=b.dataset.add.split('|'); crudAdd(p[0],p[1],(SUBS[CUR.tab].find(s=>s[0]===CUR.sub[CUR.tab])||[0,'سجل جديد'])[1]); return; }
      if(b=g('data-ed')){ const p=b.dataset.ed.split('|'); crudEdit(p[0],p[1]); return; }
      if(b=g('data-dl')){ const p=b.dataset.dl.split('|'); const soft = SOFT.includes(p[0]); if(!canEdit || !confirm(soft?'حذف هذا السجل؟ سيبقى ظاهرًا مشطوبًا مع بيان من حذفه.':'حذف هذا السجل نهائيًا؟')) return; try{ if(soft) await softDel(p[0],p[1]); else await del(p[0],p[1]); toast('حُذف السجل'); render(); }catch(er){ fail(er); } return; }
      if(b=g('data-prt')){ const p=b.dataset.prt.split('|'); crudPrint(p[0],p[1],p[2]==='sym'); return; }
      if(b=g('data-hmig')){ if(canEdit){ b.disabled=true; try{ await healthMigrate(); }catch(er){ fail(er); b.disabled=false; } } return; }
      if(b=g('data-hsend')){ if(canEdit){ b.disabled=true; try{ await healthSend(); }catch(er){ fail(er); b.disabled=false; } } return; }
      if(b=g('data-aadd')){ if(canEdit) aidAdd(); return; }
      if(b=g('data-adl')){ if(!canEdit || !confirm('حذف المستحق؟ سيبقى ظاهرًا مشطوبًا مع بيان من حذفه.')) return; try{ const dd = {deleted:true, deletedAt:Date.now(), deletedBy:env.me.id, deletedByName:env.me.name}; await sa.collection('aid').doc(b.dataset.adl).set(dd, {merge:true}); const ax = AIDS.find(x=>x.id===b.dataset.adl); if(ax) Object.assign(ax, dd); toast('حُذف'); render(); }catch(er){ fail(er); } return; }
      if(b=g('data-aprt')){ printTable('كشف الإعانة والمكافأة', [['الطالب',x=>x.name],['الصف',x=>x.className],['النوع',x=>x.type],['التاريخ',x=>x.dateH]], live(AIDS).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)), {land:false}); return; }
      if(b=g('data-sadd')){ sessAdd(b.dataset.sadd); return; }
      if(b=g('data-sed')){ sessEdit(b.dataset.sed); return; }
      if(b=g('data-sdl')){ if(!canEdit || !confirm('حذف الجلسة؟ ستبقى ظاهرة مشطوبة مع بيان من حذفها وتخرج من الإحصاءات.')) return; try{ await softDel('sessions', b.dataset.sdl); toast('حُذفت الجلسة'); render(); }catch(er){ fail(er); } return; }
      if(b=g('data-sp')){ const s=D.sessions.find(x=>x.id===b.dataset.sp); if(s) sessPrint(s); return; }
      if(b=g('data-sat')){ const s=D.sessions.find(x=>x.id===b.dataset.sat); if(s) attPrint(s); return; }
      if(b=g('data-rp')){ repPrint(b.dataset.rp); return; }
    });

    $('#body').addEventListener('input', e=>{
      if(!['sfq','sff','sft'].includes(e.target.id)) return;
      const kind = CUR.sub.sess || 'indiv', f = sfOf(kind);
      f.q = $('#sfq').value; f.from = $('#sff').value; f.to = $('#sft').value;
      const el = $('#sessList'); if(el) el.outerHTML = sessListHtml(kind);
    });
    try{ await loadAll(); }catch(e){ console.error(e); toast('تعذّر تحميل بعض البيانات'); }
    render();
    /* مزامنة اطلاع أعضاء اللجنة: قائمة المحالين (cmRefs) ووسم cmRef على ملفات المحالين */
    async function syncCm(){
      if(!canEdit || mgrOnly) return;
      const items = inboxItems().filter(i=>i.grp==='b' && i.seat);
      for(const it of items){
        const seat = String(it.seat);
        try{
          if(!CMRS.some(x=>String(x.seat)===seat)){ const rec = {period, seat, name:it.name, className:it.cls||'', why:it.title||'', at:it.at||Date.now(), by:env.me.id, byName:env.me.name, from:'agent'}; await sa.collection('cmRefs').doc(period+'__'+seat).set(rec, {merge:true}); CMRS.push(rec); }
          for(const col of ['caseFiles','sessions','stRec']){ for(const x of D[col].filter(y=>String(y.seat)===seat && !y.cmRef)){ await base.collection(col).doc(x.id).set({cmRef:true}, {merge:true}); x.cmRef = true; } }
          for(const c of CS.filter(y=>String(y.seat)===seat && !y.cmRef)){ await base.collection('cases').doc(c.id).set({cmRef:true}, {merge:true}); c.cmRef = true; }
        }catch(e){ console.warn(e); }
      }
    }
    syncCm();
  }
});
</script>
</body>
</html>
