<!DOCTYPE html>
<!-- إصدار: 2026-10-29.1 · الاختبار -->
<!-- [ADMIN-TOOLS] صفحة مستقلة بالكامل — تُحذف عند إزالة الأدوات الإدارية (انظر ADMIN-TOOLS-LOG.md) -->
<html lang="ar" dir="rtl">
<head>
<script src="fb-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدولي</title>
<meta name="theme-color" content="#3f6659">
<link rel="stylesheet" href="theme.css?v=2026-10-05.1">
<script src="mn-dialog.js?v=2026-10-06.1"></script>
<script src="theme.js?v=2026-10-05.1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7f6; --surface:#ffffff; --surface-2:#eef4f3; --surface-3:#e3ecea;
  --brand:#0f766e; --brand-2:#0b5a54; --brand-l:#d5ece9;
  --ink:#15242b; --muted:#5b6f76; --line:#d8e2e0;
  --danger:#c0392b; --warn:#b7791f; --ok:#1f9d55;
  --r:14px; --shadow:0 1px 2px rgba(16,40,40,.06),0 8px 24px rgba(16,40,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Tajawal',"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none}
.hidden{display:none !important}
.boot{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);text-align:center;padding:20px}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.topbar{position:sticky;top:0;z-index:40;background:var(--brand);color:var(--fg-ffffff,#fff);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:17px;font-weight:800;white-space:nowrap}
.tb-badge{background:rgba(255,255,255,.15);padding:5px 12px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap}
.tb-spacer{flex:1}
.tb-btn{background:rgba(255,255,255,.17);color:var(--fg-ffffff,#fff);padding:7px 14px;border-radius:10px;font-weight:700;font-size:13px;white-space:nowrap}
.tb-btn:hover{background:rgba(255,255,255,.27)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:16px}
.sub{color:var(--muted);font-size:12.5px}
/* شبكة أيام × حصص — مطابقة لـ«جدول معلم» في أداة الجدول */
.tt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg-ffffff,#fff);margin-bottom:16px;-webkit-overflow-scrolling:touch}
table.tt{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
table.tt th,table.tt td{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center}
table.tt tr:last-child td{border-bottom:none}
table.tt thead th{background:var(--surface-2);font-weight:800}
table.tt th.pn{height:34px;min-width:84px;font-size:13px}
table.tt th.pn .tm{display:block;font-size:9.5px;font-weight:500;color:var(--muted)}
table.tt th.brk,table.tt td.brk{min-width:16px;width:16px;background:repeating-linear-gradient(45deg,var(--bg-f3f6f5,#f3f6f5),var(--bg-f3f6f5,#f3f6f5) 4px,var(--bg-e9efee,#e9efee) 4px,var(--bg-e9efee,#e9efee) 8px);font-size:9.5px;color:var(--muted);writing-mode:vertical-rl}
table.tt .dn{position:sticky;right:0;z-index:2;background:var(--surface-2);font-weight:800;min-width:70px;font-size:13px;box-shadow:-2px 0 0 var(--line)}
table.tt td.cell{height:58px;padding:4px 3px;line-height:1.3;vertical-align:middle}
table.tt td.cell.lesson{background:var(--bg-f7fbfa,#f7fbfa)}
table.tt td.cell .c{display:block;font-weight:800;font-size:12.5px}
table.tt td.cell .s{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
table.tt td.cell.off{background:var(--bg-f3f3f3,#f3f3f3)}
table.tt td.cell.wait{background:var(--bg-fff7e6,#fff7e6)}
table.tt td.cell.wait .c{color:var(--fg-8a4a00,#8a4a00)}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.empty .e-emoji{display:block;font-size:34px;margin-bottom:10px}
</style>
<script src="nav-back.js?v=2026-10-28.1" defer></script>
</head>
<body>
<div id="bootView" class="boot"><span class="spin"></span><div id="bootMsg">جارٍ التحميل…</div></div>

<div id="app" class="hidden">
  <div class="topbar">
    <h1>📅 جدولي</h1>
    <span class="tb-badge" id="tbSchool">—</span>
    <span class="tb-spacer"></span>
    <button class="tb-btn" id="tbBack">→ الرئيسية</button>
  </div>
  <main id="main"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
<script>
'use strict';
/* =========================================================================
   جدولي — عرض شخصي للموظف لحصصه هو فقط، مصدرها أداة «بناء الجدول المدرسي»
   قراءة فقط بالكامل؛ لا تعديل على بيانات الجدول من هنا إطلاقًا.
   خصوصية كالتعاميم: لا صلاحية لأدمن النظام ولا للحساب الفردي — أداة مدرسية بحتة.
   ========================================================================= */
const firebaseConfig = window.FB_CONFIG;
let db = null;
const WEEKDAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

/* ---------- أدوات عامة ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fatal(msg){
  $('#bootView').innerHTML = `<div class="card" style="max-width:460px;text-align:center"><h3>${esc(msg)}</h3>
    <button class="tb-btn" style="background:var(--brand);color:var(--fg-ffffff,#fff)" onclick="location.href='index.html'">العودة للرئيسية</button></div>`;
}

const MS = { session:null, sid:null, me:null, period:'first', seenSig:'' };
(function start(){
  let s=null; try{ s = JSON.parse(localStorage.getItem('cls_session')||'null'); }catch(e){}
  if(!s || !s.userId){ location.replace('index.html'); return; }
  if(s.role==='soloTeacher' || s.role==='admin'){ fatal('هذه الأداة خاصة بموظفي المدرسة ولا صلاحية لأدمن النظام أو الحساب الفردي عليها.'); return; }
  if(!s.schoolId){ fatal('لا يمكن تحديد المدرسة.'); return; }
  MS.session = s; MS.sid = s.schoolId; MS.period = s.period || 'first';
  try{ firebase.initializeApp(firebaseConfig); db = firebase.firestore(); }
  catch(e){ fatal('تعذّر الاتصال بقاعدة البيانات.'); return; }
  firebase.auth().onAuthStateChanged(async au=>{
    if(!au){ try{ localStorage.removeItem('cls_session'); }catch(e){} location.replace('index.html'); return; }
    try{ await boot(au); }catch(e){ console.error(e); fatal('تعذّر تحميل جدولك: '+(e.message||e)); }
  });
})();

async function boot(au){
  const us = await db.collection('users').doc(MS.session.userId).get();
  if(!us.exists || us.data().authUid !== au.uid){ await firebase.auth().signOut(); location.replace('index.html'); return; }
  const u = us.data();
  if(u.active===false){ fatal('حسابك موقوف.'); return; }
  MS.me = { id: us.id, name: u.username||MS.session.username||'', role: u.role };
  if(u.role!=='schoolAdmin'){
    const ctx = (u.schools||{})[MS.sid];
    if(!ctx || ctx.active===false){ fatal('ليست لديك صلاحية الوصول لهذه المدرسة.'); return; }
    MS.seenSig = ((ctx.schedSeenSig||{})[MS.period]) || '';
  } else if(!(u.adminSchools||[]).includes(MS.sid)){
    fatal('لا يمكن الوصول لهذه المدرسة.'); return;
  }
  $('#tbSchool').textContent = MS.sid;
  try{
    const sd = await db.collection('schoolData').doc(MS.sid).get();
    if(sd.exists) $('#tbSchool').textContent = sd.data().name || MS.sid;
  }catch(e){}
  $('#tbBack').onclick = ()=>location.href='index.html';
  $('#bootView').classList.add('hidden'); $('#app').classList.remove('hidden');
  await renderSchedule();
}

// يُقرأ من النسخة المنشورة فقط ({period}_published) — يكتبها زر «نشر» في أداة الجدول، مفهرسة بحساب كل مستخدم.
// الاعتماد وحده لا يظهر هنا حتى يُنشَر.
async function loadMySchedule(){
  const res = { published:false, publishedAt:0, sig:'', lessons:[] };
  const snap = await db.collection('timetables').doc(MS.sid).collection('data').doc(MS.period+'_published').get();
  if(!snap.exists) return res;
  let data = null; try{ data = JSON.parse(snap.data().value||'null'); }catch(e){}
  if(!data) return res;
  res.published = true; res.publishedAt = data.publishedAt || 0;
  const mine = (data.byUser||{})[MS.me.id];
  if(mine){ res.sig = mine.sig || ''; res.lessons = mine.lessons || []; }
  res.layouts = data.layouts || {};
  // حصص الانتظار المنشورة (تبويب «حصص الانتظار» بأداة الجدول): تظهر «انتظار» فقط بلا رقمها
  res.waits = [];
  try{
    const ws = await db.collection('timetables').doc(MS.sid).collection('data').doc(MS.period+'_waitpub').get();
    if(ws.exists){ const wd = JSON.parse(ws.data().value||'null'); res.waits = (wd && wd.byUser && wd.byUser[MS.me.id]) || []; }
  }catch(e){}
  return res;
}
// ما شاهده المستخدم آخر مرة: في مستنده (schools.{sid}.schedSeenSig.{period})، ولمدير المدرسة في المتصفح
// (مستنده مستقل بلا خريطة schools[sid] ولا يعدّله بنفسه)
const seenKey = ()=>'injaz_schedSeen_'+MS.me.id+'_'+MS.sid+'_'+MS.period;
async function markSeen(sig){
  if(MS.me.role==='schoolAdmin'){ try{ localStorage.setItem(seenKey(), sig); }catch(e){} return; }
  if(sig===MS.seenSig) return;
  try{
    await db.collection('users').doc(MS.me.id).update({ ['schools.'+MS.sid+'.schedSeenSig.'+MS.period]: sig, _editCtx: MS.sid, updatedAt: Date.now() });
    MS.seenSig = sig;
  }catch(e){}
}

async function renderSchedule(){
  $('#main').innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  let sched; try{ sched = await loadMySchedule(); }catch(e){ sched = { published:false, lessons:[], sig:'' }; }
  if(sched.published) await markSeen(sched.sig);   // تسجيل الاطّلاع فورًا فيختفي الإشعار

  if(!sched.lessons.length && !(sched.waits||[]).length){
    $('#main').innerHTML = `<div class="empty"><span class="e-emoji">📅</span>${sched.published?'لا توجد لك حصص في الجدول المنشور لهذا الفصل الدراسي.':'لم يُنشر الجدول بعد لهذا الفصل الدراسي.'}</div>`;
    return;
  }
  // شبكة لكل مرحلة يدرّس فيها (المعلم المشترك: جدول لكل مرحلة بأوقاتها)
  const stages = [...new Set(sched.lessons.map(l=>l.st).concat((sched.waits||[]).map(w=>w.st)))];
  const multi = stages.length > 1;
  $('#main').innerHTML = (sched.publishedAt ? `<div class="sub" style="margin-bottom:10px">آخر نشر: ${esc(new Date(sched.publishedAt).toLocaleString('ar-SA'))}</div>` : '')
    + stages.map(sk=>gridHTML(sk, sched.lessons.filter(l=>l.st===sk), sched.layouts[sk], multi, (sched.waits||[]).filter(w=>w.st===sk))).join('');
}
const arN = n=>String(n).replace(/\d/g, d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function gridHTML(sk, L, lay, multi, WT){
  WT = WT || [];
  const wset = new Set(WT.map(w=>w.d+'|'+w.p));
  // نسخة نُشرت قبل حفظ شكل الشبكة: تُشتق الأيام والحصص من الحصص نفسها (بلا فسح) حتى يُعاد النشر
  if(!lay){
    const days = [...new Set([0,1,2,3,4].concat(L.map(l=>l.d)))].sort((a,b)=>a-b);
    const mp = Math.max(1, ...L.map(l=>l.p + (l.n||1)), ...WT.map(w=>w.p+1));
    const ppd = {}; days.forEach(w=>ppd[w]=mp);
    lay = { label: (L[0]||{}).sl || '', days, ppd, cols: Array.from({length:mp}, (_,p)=>({ k:'p', p, t:'' })) };
  }
  const at = {};   // "يوم|حصة" ← الحصة (المزدوجة تملأ خانتيها)
  L.forEach(l=>{ for(let k=0;k<(l.n||1);k++) at[l.d+'|'+(l.p+k)] = l; });
  let h = `${multi?`<h3 style="margin:14px 0 8px;font-size:16px">${esc(lay.label||'')}</h3>`:''}<div class="tt-wrap"><table class="tt"><thead><tr><th class="dn"></th>`;
  lay.cols.forEach(c=>{
    h += c.k==='p' ? `<th class="pn">${arN(c.p+1)}${c.t?`<span class="tm" dir="ltr">${esc(c.t)}</span>`:''}</th>`
                   : `<th class="brk">${c.type==='prayer'?'صلاة':'فسحة'}</th>`;
  });
  h += '</tr></thead><tbody>';
  lay.days.forEach(w=>{
    h += `<tr><td class="dn">${esc(WEEKDAYS[w]||'')}</td>`;
    lay.cols.forEach(c=>{
      if(c.k!=='p'){ h += '<td class="brk"></td>'; return; }
      if(c.p >= (+lay.ppd[w]||0)){ h += '<td class="cell off"></td>'; return; }
      const l = at[w+'|'+c.p];
      h += l ? `<td class="cell lesson"><span class="c">${esc(l.s)}</span><span class="s">${esc(l.cl||l.c)}</span></td>`
        : wset.has(w+'|'+c.p) ? '<td class="cell wait"><span class="c">انتظار</span></td>' : '<td class="cell"></td>';
    });
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}
</script>

<script>try{ SemGuard.start(); }catch(e){}</script>
</body>
