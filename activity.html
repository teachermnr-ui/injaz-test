<script>
(function(){
const { esc, arN, $, $$, CLUBS_DEFAULT, DOMAINS, GENERAL_TEMPLATE, DAYS, PLAN_ST, ST_CLS } = ACT;
const N = arN;
const S = { env:null, canEdit:false, isSA:false, isCoord:false, tab:'quick', qaSub:'i', clubId:null, clubTab:'members', genTab:'events', marks:[], signs:{}, sigImg:{},
  cfg:null, council:null, meetings:[], clubs:[], events:[], general:[], broadcast:null, assigns:[], opens:[], staff:null, roster:null };

/* ====================== التحميل ====================== */
const CONF = ()=>ACT.keyOf(S.env.sid, S.env.period);
async function load(parts){
  const e = S.env, all = !parts, has = k=>all || parts.includes(k);
  const jobs = [];
  if(has('cfg')) jobs.push(ACT.getDoc(e,'activityConfig',CONF()).then(v=>{ S.cfg=v; }));
  if(has('council')) jobs.push(ACT.getDoc(e,'activityCouncil',CONF()).then(v=>{ S.council=v; }));
  if(has('meetings')) jobs.push(ACT.list(e,'activityMeetings').then(v=>{ S.meetings=v.sort((a,b)=>(a.meetingNumber||0)-(b.meetingNumber||0)); }));
  if(has('clubs')) jobs.push(ACT.list(e,'activityClubs').then(v=>{ S.clubs=v.sort((a,b)=>(a.order||0)-(b.order||0)||(a.name||'').localeCompare(b.name||'','ar')); }));
  if(has('events')) jobs.push(ACT.list(e,'activityEvents').then(v=>{ S.events=v; }));
  if(has('general')) jobs.push(ACT.list(e,'activityGeneralEvents').then(v=>{ S.general=v.filter(x=>x.templateId!=='school_broadcast').sort((a,b)=>(a.expectedDate||'9').localeCompare(b.expectedDate||'9')); }));
  if(has('broadcast')) jobs.push(ACT.getDoc(e,'activityBroadcast',CONF()).then(v=>{ S.broadcast=v; }));
  if(has('assigns')) jobs.push(ACT.list(e,'actAssignments').then(v=>{ S.assigns=v; }));
  if(has('opens')) jobs.push(ACT.list(e,'actOpenEvents').then(v=>{ S.opens=v; }));
  if(has('marks')) jobs.push(ACT.list(e,'actOpenMarks').then(v=>{ S.marks=v; }));
  if(has('signs')) jobs.push(ACT.sigPointers(e).then(async v=>{ S.signs=v; S.sigImg={}; for(const k of Object.keys(v)){ S.sigImg[k]=await ACT.sigVerData(e, v[k].verId); } }).catch(()=>{ S.signs={}; S.sigImg={}; }));
  await Promise.all(jobs);
}
async function ensurePeople(){
  if(!S.staff) S.staff = await ACT.loadStaff(S.env);
  if(!S.roster) S.roster = await ACT.loadRoster(S.env);
}
const clubById = id=>S.clubs.find(c=>c.id===id);
const activeClubs = ()=>S.clubs.filter(c=>c.status!=='inactive');
const E = h=>S.canEdit ? h : '';            // عناصر التحرير
const P = h=>S.isSA ? h : '';                // عناصر المدير فقط
const approvedEvents = ()=>S.events.filter(x=>x.approvalStatus==='approved' && x.status!=='cancelled');
const pendingDocs = ()=>S.events.filter(x=>x.approvalStatus==='pending' && (x.sourceType==='assignment'||x.sourceType==='open'||(x.sourceType==='club'&&x.viaTeacher)));
const pendingAssigns = ()=>S.assigns.filter(a=>a.status==='pending');
const chip = (t,c)=>'<span class="dh-chip '+(c||'')+'">'+esc(t)+'</span>';
const fmtD = k=>k?(ACT.hijri(k)+' <span class="dh-sub">('+N(k)+')</span>'):'—';
const staffName = id=>((S.staff||[]).find(s=>s.id===id)||{}).name||'';

/* ====================== الهيكل والتبويبات ====================== */
function tabsDef(){
  const bClubs = S.isSA ? pendingAssigns().length : 0;          // اعتماد التكليفات صار داخل بطاقة «التكليفات الرسمية»
  const bDocs = S.canEdit ? pendingDocs().length : 0;
  const pb = S.isSA ? submittedCount() : 0;
  return [['quick','الوصول السريع'],['council','مجلس النشاط'],['clubs','التكليفات والأندية',bClubs],['general','الأنشطة والمسار العام'],['plan','الخطة العامة',pb],['docs','التوثيقات',bDocs],['broadcast','الإذاعة'],['reports','التقارير']];
}
function barHtml(){
  return tabsDef().map(x=>'<button class="ac-tab'+(S.tab===x[0]?' on':'')+'" data-a="tab" data-v="'+x[0]+'">'+x[1]+(x[2]?'<span class="n">'+N(x[2])+'</span>':'')+'</button>').join('');
}
function shell(){
  return '<div class="ac-tabs" id="acMainBar">'+barHtml()+'</div>'
    +(S.canEdit?'':(S.isSA?'<div class="dh-card" style="background:#eef6f8;border-color:#cfe2e8">أنت تطّلع على المنصة؛ ويبقى لك: تشكيل مجلس النشاط، واعتماد الخطط، واعتماد التكليفات. وبقية الأعمال لرائد النشاط.</div>':'<div class="dh-card" style="background:#fff8e6;border-color:#f0d9a0">وضع الاطلاع: لديك صلاحية العرض فقط دون التعديل.</div>'))
    +'<div id="acBody"></div>';
}
function saveUi(){ ACT.saveState(S.env,'main',{ tab:S.tab, clubId:S.clubId, clubTab:S.clubTab, genTab:S.genTab }); }
function paint(){
  /* شريط التبويبات الرئيسي يُرسم مرة واحدة ثم يُحدَّث موضعه فقط، فلا يرجع إلى بدايته */
  let bar = document.getElementById('acMainBar');
  if(!bar || !S.env.main.contains(bar)){ S.env.main.innerHTML = shell(); bar = document.getElementById('acMainBar'); S._ctab = null; }
  else { const sl = bar.scrollLeft; bar.innerHTML = barHtml(); bar.scrollLeft = sl; }
  if(S._ctab !== S.tab){ ACT.centerTab(bar, S._ctab !== null); S._ctab = S.tab; }
  const body = $('#acBody');
  if(!S.cfg || !S.cfg.active){ body.innerHTML = activationView(); return; }
  const fn = { quick:vQuick, summary:vSummary, council:vCouncil, clubs:vClubs, plan:vPlan, general:vGeneral, docs:aDocs, broadcast:vBroadcast, reports:vReports }[S.tab];
  body.innerHTML = fn();
  $$('#acBody .ac-tabs').forEach(b=>ACT.centerTab(b,false));
  if(S.tab==='clubs' && S.clubId) afterClubPaint();
  if(S.tab==='reports') ACT.pickInit(document,'rp_att_p');
  saveUi();
}
async function refresh(parts){ await load(parts); paint(); }

function activationView(){
  const c = S.council;
  const cardCouncil = '<div class="dh-card"><div class="ac-row sb"><h3 style="margin:0">مجلس النشاط</h3>'+(c?chip('مُشكَّل','ok'):chip('لم يُشكَّل','warn'))+'</div>'
    +(c?'<div class="dh-sub" style="margin-top:6px">رئيس المجلس: '+esc(c.chairName)+' — رائد النشاط (المقرر): <b>'+esc(c.secretaryName||'—')+'</b></div>':'')
    +P('<div class="ac-row" style="margin-top:8px"><button class="ac-btn" data-a="council-form">'+(c?'✏ تعديل التشكيل':'تشكيل مجلس النشاط')+'</button></div>')+'</div>';
  if(S.isSA) return '<div class="dh-card dh-soon"><div class="ic">🎯</div><h2>تفعيل منصة النشاط المدرسي</h2><p>الخطوة الأولى: شكّل مجلس النشاط وحدّد رائد النشاط (مقرر المجلس). يحصل رائد النشاط تلقائيًا على كامل صلاحيات المنصة ويفعّلها وينشئ الأندية، وتبقى لك الاعتمادات: الخطة العامة والتكليفات.</p></div>'+cardCouncil;
  if(!S.canEdit) return '<div class="dh-card dh-soon"><div class="ic">🎯</div><h2>لم تُفعَّل المنصة بعد</h2><p>لم يفعّل رائد النشاط منصة النشاط لهذا الفصل الدراسي بعد.</p></div>';
  if(!c) return '<div class="dh-card dh-soon"><div class="ic">🏛️</div><h2>بانتظار تشكيل مجلس النشاط</h2><p>يشكّل قائد المدرسة مجلس النشاط ويحدّد رائد النشاط أولًا، ثم تُفعَّل المنصة.</p></div>';
  return '<div class="dh-card dh-soon"><div class="ic">🎯</div><h2>تفعيل منصة النشاط المدرسي</h2><p>عند التفعيل تُنشأ الأندية الوزارية السبعة لهذا الفصل الدراسي، وتظهر معها بطاقة «التكليفات الرسمية» في أول القائمة، وبعدها يمكنك إضافة أندية جديدة أو تعديل الأندية أو حذف ما لا تحتاجه المدرسة.</p>'
    +'<button class="ac-btn" data-a="activate">تفعيل المنصة وإنشاء الأندية السبعة</button></div>';
}

/* ====================== الملخص ====================== */
function planStats(){
  let total=0, done=0; const per = [];
  activeClubs().forEach(c=>{ const it=(c.plan||[]).filter(x=>x.status!=='cancelled'); const d=it.filter(x=>x.status==='executed').length; total+=it.length; done+=d; per.push({club:c, total:it.length, done:d}); });
  return { total, done, per, pct: total?done/total:0 };
}
/* حالة اعتماد الخطط: لكل نادٍ planState، وللمسار العام cfg.generalState */
const clubPS = c=>c.planState||'draft';
const genPS = ()=>(S.cfg&&S.cfg.generalState)||'draft';
const genItems = ()=>S.general.filter(g=>g.status!=='cancelled');
const submittedCount = ()=>activeClubs().filter(c=>clubPS(c)==='submitted').length + (genPS()==='submitted'?1:0);
const PS_NAME = {draft:'مسودة',submitted:'مُقدَّمة للاعتماد',approved:'مُعتمدة',returned:'أُعيدت للتعديل'};
const PS_CLS = {draft:'',submitted:'warn',approved:'ok',returned:'bad'};
const psChip = (st,ret)=>chip(PS_NAME[ret?'returned':st]||'مسودة', PS_CLS[ret?'returned':st]);

/* معلمو التوثيق المعتمد: الموثِّق + المشاركون المعلمون (يبقى بعد الاعتماد المؤكِّدون فقط) — كلهم يُحسب لهم التوثيق بالصيغة نفسها */
function evTeachers(x){
  const out = [{ uid:x.documentedBy, name:x.documentedByName||'' }];
  (x.participants||[]).filter(p=>p.type==='staff' && p.uid && p.uid!==x.documentedBy).forEach(p=>out.push({ uid:p.uid, name:p.name||'' }));
  return out;
}
function vSummary(){
  const ac = activeClubs(), ps = planStats();
  const students = ac.reduce((n,c)=>n+stuMembers(c).length,0);
  const evs = approvedEvents().length;
  // ملخص الأنشطة الموثّقة: باسم النشاط وعدد المعلمين
  const grp = {};
  S.events.filter(x=>(x.sourceType==='assignment'||x.sourceType==='open') && x.approvalStatus==='approved').forEach(x=>{
    const k = (x.title||'').trim(); evTeachers(x).forEach(u=>{ (grp[k]=grp[k]||new Set()).add(u.uid); });
  });
  const docs = Object.keys(grp).map(k=>[k,grp[k].size]).sort((a,b)=>b[1]-a[1]);
  const todayK = ACT.today(), in14 = ACT.addDays(todayK,14);
  const alerts = [];
  ac.filter(c=>!(c.plan||[]).length).forEach(c=>alerts.push('⚠ '+c.name+' بدون خطة فصلية'));
  ac.forEach(c=>(c.plan||[]).filter(x=>x.status==='planned' && x.expectedDate && x.expectedDate<=in14).forEach(x=>alerts.push((x.expectedDate<todayK?'⏰ متأخرة: ':'📅 قادمة: ')+x.title+' — '+c.name+' ('+ACT.hijri(x.expectedDate)+')')));
  if(S.isSA && pendingAssigns().length) alerts.push('📝 '+N(pendingAssigns().length)+' تكليف بانتظار اعتمادك');
  if(S.isSA && submittedCount()) alerts.push('📋 '+N(submittedCount())+' من الخطط بانتظار اعتمادك (تبويب الخطة العامة)');
  if(S.canEdit && pendingDocs().length) alerts.push('🗂 '+N(pendingDocs().length)+' توثيق بانتظار اعتماد رائد النشاط');
  if(!S.council) alerts.push('⚠ لم يُشكَّل مجلس النشاط بعد');
  return '<div class="dh-stats">'
    +'<div class="dh-stat"><b>'+N(ac.length)+'</b><span>نادٍ مفعّل</span></div>'
    +'<div class="dh-stat"><b>'+N(students)+'</b><span>طالب مسجّل بالأندية</span></div>'
    +'<div class="dh-stat"><b>'+N(evs)+'</b><span>فعالية معتمدة</span></div></div>'
    +'<div class="dh-card"><h3>نسبة تنفيذ الخطة: '+N(Math.round(ps.pct*100))+'٪</h3><div class="ac-bar"><i style="width:'+Math.round(ps.pct*100)+'%"></i></div><div class="dh-sub" style="margin-top:4px">'+N(ps.done)+' من '+N(ps.total)+' بنود منفَّذة</div></div>'
    +'<div class="dh-grid"><div class="dh-card"><h3>التنبيهات</h3><div class="dh-list">'+(alerts.length?alerts.map(a=>'<div class="dh-item">'+esc(a)+'</div>').join(''):'<div class="dh-empty">لا توجد تنبيهات.</div>')+'</div></div>'
    +'<div class="dh-card"><h3>الأنشطة الموثّقة</h3><div class="dh-list">'+(docs.length?docs.map(d=>'<div class="dh-item"><span>'+esc(d[0])+'</span>'+chip('وثّقه '+N(d[1])+' معلم')+'</div>').join(''):'<div class="dh-empty">لا توجد توثيقات بعد.</div>')+'</div><div class="dh-sub" style="margin-top:6px">تفاصيل المعلمين في تبويب التقارير.</div></div></div>';
}


/* ====================== الوصول السريع ====================== */
function qaCards(){
  const ac = activeClubs(), ps = planStats();
  const goT = (t,fn)=>()=>{ S.tab=t; S.clubId = t==='clubs'?S.clubId:null; if(fn) fn(); paint(); };
  const pendEv = S.events.filter(x=>x.approvalStatus==='pending').length;
  return [
    {t:'مجلس النشاط', n:S.council ? 2+(S.council.members||[]).length : 0, l:'الإجمالي', go:goT('council')},
    {t:'التكليفات والأندية', n:ac.length, p:S.isSA?pendingAssigns().length:null, l:'بانتظار الاعتماد', go:goT('clubs')},
    {t:'الأنشطة والمسار العام', n:S.events.length, p:pendEv, l:'بانتظار', go:goT('general'), tabs:[['الأنشطة',goT('general',()=>{S.genTab='events';})],['المتاح للمعلمين',goT('general',()=>{S.genTab='open';})]]},
    {t:'الخطة العامة', n:ps.total, p:S.isSA?submittedCount():null, l:'بانتظار الاعتماد', go:goT('plan')},
    {t:'التوثيقات', n:S.events.length, p:S.canEdit?pendingDocs().length:null, l:'بانتظار الاعتماد', go:goT('docs')},
    {t:'الإذاعة', n:((S.broadcast&&S.broadcast.weeks)||[]).length, l:'الإجمالي', go:goT('broadcast')},
    {t:'التقارير', n:'—', l:'', go:goT('reports')}
  ];
}
let QA_CUR = [];
function vQuick(){
  QA.css();
  QA_CUR = qaCards();
  return '<div class="ac-tabs sub"><button class="ac-tab'+(S.qaSub==='i'?' on':'')+'" data-a="qa-sub" data-v="i">المؤشرات</button><button class="ac-tab'+(S.qaSub==='q'?' on':'')+'" data-a="qa-sub" data-v="q">الوصول السريع</button></div>'
    + (S.qaSub==='q' ? QA.html('bar', QA_CUR) : vSummary());
}

/* ====================== مجلس النشاط ====================== */
function vCouncil(){
  const c = S.council;
  if(!c) return '<div class="dh-card dh-soon"><div class="ic">🏛️</div><h2>مجلس النشاط</h2><p>لم يُشكَّل المجلس بعد.</p>'+P('<button class="ac-btn" data-a="council-form">تشكيل مجلس النشاط</button>')+(S.isSA?'':'<p class="dh-sub">تشكيل المجلس من صلاحية قائد المدرسة.</p>')+'</div>';
  return '<div class="dh-card"><div class="ac-row sb"><h3 style="margin:0">مجلس النشاط</h3><div class="ac-row"><button class="ac-btn sec sm" data-a="print-council">🖨 طباعة القرار</button>'+P('<button class="ac-btn sm" data-a="council-form">✏ تعديل التشكيل</button>')+'</div></div>'
    +'<div class="dh-list" style="margin-top:8px"><div class="dh-item"><span>الرئيس</span><b>'+esc(c.chairName)+'</b>'+chip('قائد المدرسة')+'</div>'
    +'<div class="dh-item"><span>المقرر</span><b>'+esc(c.secretaryName||'—')+'</b>'+chip('رائد النشاط')+'</div>'
    +(c.members||[]).map(m=>'<div class="dh-item"><span>عضو</span><b>'+esc(m.name)+'</b>'+chip(m.role||'عضو')+'</div>').join('')+'</div></div>'
    +'<div class="dh-card"><div class="ac-row sb"><h3 style="margin:0">محاضر الاجتماعات</h3>'+E('<button class="ac-btn sm" data-a="meeting-add">+ إضافة اجتماع</button>')+'</div>'
    +(S.meetings.length?meetingGroups().map(gr=>'<h4 style="margin:14px 0 2px;color:#17475e">'+esc(gr.title||'بدون عنوان')+' <span class="dh-sub">('+N(gr.list.length)+' اجتماع)</span></h4>'+gr.list.map(m=>'<div class="dh-card" style="margin:8px 0 0"><div class="ac-row sb"><b>الاجتماع '+N(m.meetingNumber)+' — '+fmtD(m.date)+'</b><div class="ac-row"><button class="ac-btn sec sm" data-a="meeting-print" data-id="'+m.id+'">🖨 طباعة المحضر</button>'+E('<button class="ac-btn sec sm" data-a="meeting-edit" data-id="'+m.id+'">تعديل</button>')+'</div></div>'
      +'<p style="margin:6px 0">'+esc(m.summary)+'</p>'
      +((m.decisions||[]).length?'<ol style="margin:0 18px">'+(m.decisions||[]).map(d=>'<li>'+esc(d)+'</li>').join('')+'</ol>':'')
      +'<div class="dh-sub">الحضور: '+N((m.attendees||[]).length)+' من '+N((m.attendees||[]).length+(m.absentees||[]).length)+'</div></div>').join('')).join(''):'<div class="dh-empty">لا توجد محاضر بعد.</div>')+'</div>'
    +sigCard();
}
/* الاجتماعات مجمَّعة تحت عنوانها (العنوان الواحد يضم أكثر من اجتماع)، والترقيم متسلسل للمجلس */
function meetingGroups(){
  const map = new Map();
  S.meetings.forEach(m=>{ const k=(m.title||'').trim(); if(!map.has(k)) map.set(k,[]); map.get(k).push(m); });
  return Array.from(map, ([title,list])=>({ title, list:list.sort((a,b)=>(a.meetingNumber||0)-(b.meetingNumber||0)) }))
    .sort((a,b)=>Math.max(...b.list.map(m=>m.meetingNumber||0))-Math.max(...a.list.map(m=>m.meetingNumber||0)));
}
/* الختم والتوقيعان: لكل مدرسة ثلاث خانات؛ تُنسخ لحظة الاعتماد فتبقى النماذج القديمة ثابتة */
function sigCard(){
  const p = S.signs||{}, img = S.sigImg||{}, c = S.council;
  const isSecretary = !!(c && c.secretaryId===S.env.me.id);
  const rows = [['coord',isSecretary,'يرفعه رائد النشاط من حسابه'],['principal',S.isSA,'يرفعه قائد المدرسة من حسابه'],['stamp',S.isSA,'يرفعه قائد المدرسة']].map(([k,can,hint])=>{
    let x = p[k], stale = false;
    if(k==='coord' && x && c && x.uid!==c.secretaryId){ stale = true; }
    if(k==='principal' && x && c && c.chairId && x.uid!==c.chairId){ stale = true; }
    const ok = x && !stale && img[k];

/* تغيير رائد النشاط: تُلغى صلاحية «منصة النشاط المدرسي» الخاصة عن السابق وتُفعَّل للجديد (بقية صلاحياته كما هي).
   الكتابة بحساب قائد المدرسة على سياق مدرسته فقط (schools.{sid}.permissions مع _editCtx) — كما في شاشة الصلاحيات. */
async function coordPerms(oldId, newId){
  const sid = S.env.sid, bad = [];
  const setP = async (uid, val)=>{
    if(!uid) return;
    try{
      const ref = S.env.db.collection('users').doc(uid), d = await ref.get(); if(!d.exists) throw new Error('no user');
      const ctx = ((d.data().schools||{})[sid]); if(!ctx) throw new Error('no ctx');
      const perms = Object.assign({}, ctx.permissions||{}); perms['tools.activity'] = val;
      await ref.update({ ['schools.'+sid+'.permissions']:perms, _editCtx:sid, updatedAt:Date.now() });
    }catch(e){ console.warn('coordPerms', uid, e); bad.push(staffName(uid)||uid); }
  };
  if(oldId && oldId!==newId) await setP(oldId, { access:false, edit:false });
  if(newId) await setP(newId, { access:true, edit:true });
  return bad;
}

const isStaffM = m=>m.type==='staff';

/* المعلم المسؤول: respUids (كل بنود غير ملغاة) للقراءة، وrespMap (بنود مخططة فقط: بند←معلم) لصلاحية التوثيق */
const respFields = plan=>{
  const it = (plan||[]).filter(x=>x.status!=='cancelled' && x.responsibleId), map = {};
  it.filter(x=>x.status==='planned').forEach(x=>{ map[x.id]=x.responsibleId; });
  return { respUids:Array.from(new Set(it.map(x=>x.responsibleId))), respMap:map };
};
const sameArr = (a,b)=>JSON.stringify((a||[]).slice().sort())===JSON.stringify((b||[]).slice().sort());
const sameMap = (a,b)=>JSON.stringify(Object.keys(a||{}).sort().map(k=>[k,a[k]]))===JSON.stringify(Object.keys(b||{}).sort().map(k=>[k,b[k]]));
/* توثيق معلم مسؤول قيد الاعتماد لبند: يُغلق على الرائد حتى يُعتمد أو يُعاد */
const teacherPending = (cid,pid)=>S.events.find(x=>x.sourceType==='club' && x.viaTeacher && x.clubId===cid && x.planItemId===pid && x.approvalStatus==='pending');
/* ترحيل بيانات قديمة: يُكتب respUids/respMap للأندية التي خططها قبل هذه الميزة */
async function backfillResp(){
  if(!S.canEdit) return;
  let n = 0;
  for(const c of S.clubs){
    const f = respFields(c.plan);
    if(!sameArr(f.respUids,c.respUids) || !sameMap(f.respMap,c.respMap)){ try{ await ACT.patch(S.env,'activityClubs',c.id,f); Object.assign(c,f); n++; }catch(e){ console.warn('backfill', e); } }
  }
  return n;
}

/* أثر التنفيذ المعتمد لفعالية نادٍ (من الرائد مباشرة أو بعد اعتماد توثيق المعلم المسؤول):
   حضور تلقائي لأعضاء النادي المذكورين في التوثيق، وتحويل بند الخطة إلى «مُنفَّذ» */
async function clubExecuted(cid, pid, evId, ev){
  const cur = (await ACT.getDoc(S.env,'activityClubs',cid)) || clubById(cid); if(!cur) return;
  const stuP = new Set((ev.participants||[]).filter(p=>p.type==='student').map(p=>p.uid));
  const stfP = new Set((ev.participants||[]).filter(p=>p.type==='staff').map(p=>p.uid).concat((ev.executors||[]).map(e=>e.uid)));
  const att = Object.assign({}, ev.attendance||{});
  (cur.members||[]).forEach(m=>{
    if(isStaffM(m) ? stfP.has(m.uid) : stuP.has(m.seat)) att[m.seat] = { name:m.name, class:m.classCode||'', type:isStaffM(m)?'staff':'student', status:'present', auto:true };
  });
  await ACT.patch(S.env,'activityEvents',evId,{ attendance:att, attendanceBy:S.env.me.id });
  if(pid){
    const plan = (cur.plan||[]).map(x=>x.id===pid?Object.assign({},x,{status:'executed',evId}):x);
    await ACT.patch(S.env,'activityClubs',cid,Object.assign({ plan, locked:true }, respFields(plan)));
  }
}

/* ====================== التكليفات (داخل بطاقة «التكليفات الرسمية») ====================== */
const asStChip = a=>({pending:chip('بانتظار اعتماد قائد المدرسة','warn'),approved:chip('معتمد','ok'),cancelled:chip('ملغى','bad'),returned:chip('أعاده قائد المدرسة للتعديل','bad')})[a.status]||'';
function progDone(a, idx){ return S.events.find(x=>x.assignmentId===a.id && x.programIdx===idx && x.approvalStatus!=='returned'); }
/* تاريخ انتهاء برنامج التكليف (endDate)؛ التكليفات القديمة ذات الموعد النصي (timeline) لا تنتهي */
const progExpired = p=>!!(p && p.endDate && p.endDate < ACT.today());
const progAll = (a,i)=>S.events.find(x=>x.assignmentId===a.id && x.programIdx===i);              // أي توثيق (حتى المعاد)
const progApproved = (a,i)=>{ const d = progDone(a,i); return !!(d && d.approvalStatus==='approved'); };
const asgAllApproved = a=>(a.programs||[]).length>0 && (a.programs||[]).every((p,i)=>progApproved(a,i));
function asgProgLine(a,p,i){
  const d = progDone(a,i);
  const when = p.endDate ? 'تاريخ انتهاء التكليف: '+ACT.hijri(p.endDate) : (p.timeline ? 'الموعد: '+esc(p.timeline) : '');
  const st = d ? (d.approvalStatus==='approved' ? chip('وُثِّق واعتُمد','ok') : chip('وُثِّق — بانتظار اعتماد رائد النشاط','warn'))
    : (a.status==='approved' ? (progExpired(p) ? chip('منتهي — لم يُوثَّق','bad') : chip('لم يُوثَّق','bad')) : '');
  const acts = d ? '<button class="ac-btn sec sm" data-a="ev-print" data-id="'+d.id+'">معاينة</button>'
      +(S.canEdit && d.approvalStatus==='pending' ? '<button class="ac-btn sm" data-a="ev-approve" data-id="'+d.id+'">اعتماد</button><button class="ac-btn bad sm" data-a="ev-return" data-id="'+d.id+'">إعادة للتعديل</button>' : '') : '';
  return '<div class="dh-item" style="margin-top:4px;flex-wrap:wrap;gap:6px"><div><b>'+N(i+1)+'. '+esc(p.name)+'</b> '+st
    +'<div class="dh-sub">'+[p.target?'الفئة: '+esc(p.target):'', when].filter(Boolean).join(' — ')+'</div></div>'+(acts?'<div class="ac-row">'+acts+'</div>':'')+'</div>';
}
function aAssign(){
  /* بطاقة لكل معلم باسمه، وتحتها تكليفاته من كل الأندية قابلة للطي؛ وفي رأسها «مطلوب اعتماده» */
  const byT = {};
  S.assigns.forEach(a=>{ (byT[a.teacherId] = byT[a.teacherId] || { id:a.teacherId, name:a.teacherName, list:[] }).list.push(a); });
  const ts = Object.values(byT).sort((x,y)=>(x.name||'').localeCompare(y.name||'','ar'));
  const needOf = t=>t.list.reduce((n,a)=>n+(a.status==='pending'?1:0)+(a.programs||[]).filter((p,i)=>{ const d = progDone(a,i); return d && d.approvalStatus==='pending'; }).length,0);
  const card = t=>{
    const need = needOf(t), open = (S.asgOpen && t.id in S.asgOpen) ? S.asgOpen[t.id] : need>0;

    }).join('');

  };
  return '<div class="ac-row sb" style="margin-bottom:8px"><h3 style="margin:0">تكليفات المعلمين</h3>'+E('<button class="ac-btn sm" data-a="asg-add">+ تكليف جديد</button>')+'</div>'

/* شروط اعتماد توثيق نشاط متاح فيه معلمون مشاركون: لا ينتظر أحد ردًّا، أو انتهى آخر موعد للتوثيق */
function approveGate(x){
  if(x.sourceType!=='open') return { ok:true };
  const stf = (x.participants||[]).filter(p=>p.type==='staff');
  if(!stf.length) return { ok:true };
  const byU = {}; S.marks.filter(m=>m.openEventId===x.openEventId && (m.role||'owner')==='participant' && m.evId===x.id).forEach(m=>{ byU[m.uid]=m; });
  const waiting = stf.filter(p=>{ const m = byU[p.uid]; return !m || m.confirm==='invited'; });
  /* يتفعّل الاعتماد من يوم «آخر موعد للتوثيق» نفسه (لا ينتظر اليوم التالي) */
  const o = S.opens.find(v=>v.id===x.openEventId), expired = !!(o && o.deadline && o.deadline <= ACT.today());
  return { ok: !waiting.length || expired, waiting, expired };
}

  const o = x.sourceType==='open' ? S.opens.find(v=>v.id===x.openEventId) : null, dl = o && o.deadline ? ACT.hijri(o.deadline) : '';

    +'<div class="ac-row" style="margin-top:6px"><button class="ac-btn sec sm" data-a="ev-print" data-id="'+x.id+'">معاينة النموذج</button>'
    +(S.canEdit && x.approvalStatus==='pending' ? (approveGate(x).ok ? '<button class="ac-btn sm" data-a="ev-approve" data-id="'+x.id+'">اعتماد</button>' : '<button class="ac-btn sm" disabled style="opacity:.45;cursor:not-allowed">اعتماد</button>')+'<button class="ac-btn bad sm" data-a="ev-return" data-id="'+x.id+'">إعادة للتعديل</button>':'')+'</div>'

/* إحصاء توثيقات المعلمين (تقارير المعلمين):
   - التكليفات = التكليفات الرسمية المعتمدة من قائد المدرسة + بنود خطط الأندية المسندة للمعلم:
     معتمدة ← «موثّق»؛ مرسَلة بانتظار الاعتماد ← لا تُعدّ (تظهر ⏳)؛ غير مرسَلة أو معادة أو انتهت ← «تكليف غير موثّق».
   - الأنشطة المتاحة اختيارية: المعتمد (موثِّقًا أو مشاركًا مؤكِّدًا) ← «موثّق»؛ والمهمَل فقط ← «تكليف غير موثّق»
     (مدعو لم يؤكد حتى انتهى الموعد، أو توثيق أُعيد للتعديل ولم يُعد إرساله حتى انتهى الموعد). */
function teacherStats(){
  const T = {}, tOf = (id,name)=>{ const t = T[id] = T[id] || { id, name:name||'', asg:[], club:[], open:[] }; if(!t.name && name) t.name = name; return t; };
  const stOf = ev=>!ev ? 'miss' : ev.approvalStatus==='approved' ? 'ok' : ev.approvalStatus==='pending' ? 'wait' : 'miss';
  S.assigns.filter(a=>a.status==='approved').forEach(a=>(a.programs||[]).forEach((p,i)=>{
    const ev = progDone(a,i); let st = stOf(ev); if(st==='miss' && progExpired(p)) st = 'exp';
    tOf(a.teacherId,a.teacherName).asg.push({ t:p.name, sub:a.clubName||'', ev, st });
  }));
  activeClubs().forEach(c=>(c.plan||[]).forEach(it=>{
    if(!it.responsibleId || it.status==='cancelled') return;
    const ev = S.events.find(x=>x.sourceType==='club' && x.clubId===c.id && x.planItemId===it.id && x.viaTeacher && x.documentedBy===it.responsibleId);
    if(it.status==='executed' && !ev) return;             // نفّذه رائد النشاط بنفسه: لا يُحسب على المعلم
    tOf(it.responsibleId,it.responsible).club.push({ t:it.title, sub:c.name||'', ev, st:stOf(ev) });
  }));
  S.events.filter(x=>x.sourceType==='open' && x.approvalStatus==='approved').forEach(x=>evTeachers(x).forEach(u=>tOf(u.uid,u.name).open.push({ t:x.title, ev:x, st:'ok' })));
  S.opens.filter(o=>isExpired(o)).forEach(o=>{
    S.marks.filter(m=>m.openEventId===o.id && m.role==='participant' && (m.confirm==='invited'||m.confirm==='released')).forEach(m=>tOf(m.uid,m.name).open.push({ t:o.title, sub:'لم يؤكد مشاركته', ev:null, st:'exp' }));
    S.events.filter(x=>x.openEventId===o.id && x.approvalStatus==='returned').forEach(x=>tOf(x.documentedBy,x.documentedByName).open.push({ t:o.title, sub:'أُعيد ولم يُرسَل', ev:x, st:'exp' }));
  });
  return Object.values(T).map(t=>{
    const all = t.asg.concat(t.club, t.open);
    t.done = all.filter(x=>x.st==='ok').length; t.wait = all.filter(x=>x.st==='wait').length; t.miss = all.filter(x=>x.st==='miss'||x.st==='exp').length;
    return t;
  }).filter(t=>t.asg.length||t.club.length||t.open.length).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));
}

      const sec = (h,arr,empty)=>'<div style="margin-top:8px"><b>'+h+'</b></div>'+(arr.length?arr.map(line).join(''):'<div class="dh-empty">'+empty+'</div>');

        +sec('الأنشطة المتاحة',t.open,'لا توجد أنشطة متاحة معتمدة أو مهملة.')+'</div></details>';
    }).join(''):'<div class="dh-empty">لا توجد تكليفات أو توثيقات بعد.</div>')+'</div>';

/* كتابة حالة الخطط: المفتاح c:<id> لنادٍ، وgen للمسار العام */
async function planWrite(keys, mode, note){
  const me = S.env.me, now = Date.now();
  for(const k of keys){
    const isGen = k==='gen';
    let d;
    if(mode==='submitted') d = isGen ? { generalState:'submitted', generalReturnNote:'', generalSubmittedAt:now } : { planState:'submitted', planReturnNote:'', planSubmittedAt:now };
    else if(mode==='approved') d = isGen ? { generalState:'approved', generalApprovedBy:me.id, generalApprovedByName:me.name, generalApprovedAt:now, generalReturnNote:'' } : { planState:'approved', planApprovedBy:me.id, planApprovedByName:me.name, planApprovedAt:now, planReturnNote:'' };
    else if(mode==='returned') d = isGen ? { generalState:'draft', generalReturnNote:note||'', generalReturnedAt:now } : { planState:'draft', planReturnNote:note||'', planReturnedAt:now };
    else d = isGen ? { generalState:'draft', generalReturnNote:'' } : { planState:'draft', planReturnNote:'' };
    if(isGen) await ACT.patch(S.env,'activityConfig',CONF(),d); else await ACT.patch(S.env,'activityClubs',k.slice(2),d);
  }
  ACT.toast(mode==='approved'?'تم الاعتماد':mode==='submitted'?'تم التقديم للاعتماد':mode==='returned'?'أُعيدت للتعديل':'تم');
  await refresh(['clubs','cfg']);
}
/* اعتماد/إعادة توثيق معلم: يحدّث علامته، وأول اعتماد لنشاط من المسار العام يجعله «مُنفَّذًا» تلقائيًا */
async function reviewDoc(id, st, note){
  const x = S.events.find(v=>v.id===id); if(!x) return;
  const me = S.env.me;
  if(st==='approved'){
    if(!approveGate(x).ok){ ACT.toast('لا يمكن الاعتماد قبل رد المشاركين أو حلول آخر موعد للتوثيق'); return; }
    // المشاركون المعتمدون: المؤكِّدون فقط؛ يُحذف من اعتذر أو لم يؤكد من النموذج ويتحدّث عند الجميع دون إشعار
    let extra = {};
    if(x.sourceType==='open' && (x.partUids||[]).length){
      const conf = new Set(S.marks.filter(m=>m.openEventId===x.openEventId && (m.role||'owner')==='participant' && m.evId===id && m.confirm==='confirmed').map(m=>m.uid));
      const keep = (x.participants||[]).filter(p=>p.type!=='staff' || conf.has(p.uid));
      extra = { participants:keep, partUids:keep.filter(p=>p.type==='staff').map(p=>p.uid) };
      for(const m of S.marks.filter(m=>m.openEventId===x.openEventId && (m.role||'owner')==='participant' && m.evId===id && m.confirm==='invited')){
        try{ await S.env.db.collection('actOpenMarks').doc(m.id).update({ confirm:'released', updatedAt:Date.now() }); }catch(err){ console.warn('release mark', err); }
      }
    }
    const stamp = await ACT.approvalStamp(S.env, S.council);
    await ACT.patch(S.env,'activityEvents',id,Object.assign({ approvalStatus:'approved', approvedBy:me.id, approvedByName:me.name, approvedAt:Date.now(), returnNote:'' }, stamp, extra));
    /* فعالية نادٍ وثّقها المعلم المسؤول: عند الاعتماد يتحقق ما يتحقق عند تنفيذ الرائد (حضور تلقائي + بند الخطة مُنفَّذ) */
    if(x.sourceType==='club') await clubExecuted(x.clubId, x.planItemId, id, x);
  }
  else await ACT.patch(S.env,'activityEvents',id,{ approvalStatus:'returned', returnNote:note||'' });
  if(x.sourceType==='open' && x.openEventId){
    for(const m of S.marks.filter(m=>m.openEventId===x.openEventId && (m.role||'owner')==='participant' && m.evId===id && m.confirm==='confirmed')){
      try{ await S.env.db.collection('actOpenMarks').doc(m.id).update({ state:st, updatedAt:Date.now() }); }catch(err){ console.warn('part mark', err); }
    }
    await S.env.db.collection('actOpenMarks').doc(x.openEventId+'_'+x.documentedBy).set({ schoolId:S.env.sid, period:S.env.period, openEventId:x.openEventId, uid:x.documentedBy, name:x.documentedByName||'', state:st, updatedAt:Date.now() },{ merge:true });
    const o = S.opens.find(v=>v.id===x.openEventId), g = o && o.generalEventId ? S.general.find(v=>v.id===o.generalEventId) : null;
    if(st==='approved' && g && g.status!=='executed') await ACT.patch(S.env,'activityGeneralEvents',g.id,{ status:'executed', executionEventId:id });
  }
  await refresh(['events','marks','general','clubs']);
}

  'open-toggle': async el=>{ const o=S.opens.find(x=>x.id===el.dataset.id); await ACT.patch(S.env,'actOpenEvents',o.id,{status:o.status==='open'?'closed':'open'}); await refresh(['opens']); },
  'ev-approve': async el=>{ await reviewDoc(el.dataset.id,'approved'); },
  'ev-return': async el=>{ const n = await (window.mnPrompt?window.mnPrompt('سبب الإعادة للمعلم (يظهر له):',''):Promise.resolve('')); if(n===null) return; await reviewDoc(el.dataset.id,'returned',n); },
  'bc-add': bcAdd, 'bc-edit': el=>bcEdit(Number(el.dataset.w),Number(el.dataset.d)),
  'bc-delweek': async el=>{ if(!await ACT.confirmBox('حذف هذا الأسبوع من جدول الإذاعة؟')) return; const w=S.broadcast.weeks.slice(); w.splice(Number(el.dataset.w),1); w.forEach((x,i)=>x.weekNumber=i+1); await saveBroadcast(w); }
};
function bind(){
  S.env.main.addEventListener('click', async e=>{
    const el = e.target.closest('[data-a]'); if(!el || !S.env.main.contains(el)) return;
    const f = H[el.dataset.a]; if(!f) return;
    el.disabled = true;
    try{ await f(el); }catch(err){ console.error(err); ACT.toast(err&&err.message?err.message:'تعذّر تنفيذ العملية'); }
    el.disabled = false;
  });
  /* تذكّر فتح/طي البطاقات المجمَّعة بين إعادات الرسم */
  S.env.main.addEventListener('toggle', e=>{ const t = e.target; if(t && t.id==='docsApr') S.docsAprOpen = t.open; else if(t && t.dataset && t.dataset.asgT) (S.asgOpen = S.asgOpen||{})[t.dataset.asgT] = t.open; }, true);
  S.env.main.addEventListener('change', async e=>{
    if(e.target.id==='attSel'){ S.attEv = e.target.value; paint(); }
    if(e.target.id==='rp_att_club'){ $('#rp_att_host').innerHTML = attEvPick(e.target.value); ACT.pickInit(document,'rp_att_p'); }
  });
}

Dash.boot({
  title:'منصة النشاط المدرسي',
  allow:()=>true,
  render: async env=>{
    ACT.injectCss();
    S.env = env; S.isSA = !!env.isSA;
    const p = ((env.ctx&&env.ctx.permissions)||{})['tools.activity']||{};
    env.main.innerHTML = '<div class="dh-empty">جارٍ التحميل...</div>';
    /* رائد النشاط = مقرر مجلس النشاط، ويُعرف من وثيقة المجلس (قراءتها متاحة لموظفي المدرسة) */
    await load(['council']);
    S.isCoord = !!(S.council && S.council.secretaryId === env.me.id);
    S.canEdit = !S.isSA && (S.isCoord || p.edit===true);
    if(!S.isSA && !S.isCoord && p.access!==true && p.edit!==true){ env.main.innerHTML = '<div class="dh-card dh-soon"><div class="ic">🔒</div><h2>ليست لديك صلاحية «منصة النشاط المدرسي»</h2><p>تُمنح الصلاحية لرائد النشاط (مقرر المجلس) أو بتفويض من قائد المدرسة.</p></div>'; return; }
    if(!S.canEdit) env.main.classList.add('ac-ro');
    await load();
    await ensurePeople().catch(()=>{});
    await backfillResp();
    const u = ACT.loadState(env,'main');
    /* ترحيل الحالة المحفوظة: تبويب «التكليف والتوثيق» القديم */
    if(u.tab==='assign'){ if(u.asTab==='docs'){ u.tab='docs'; } else { u.tab='clubs'; u.clubId='__asg'; } }
    if(u.tab && tabsDef().some(t=>t[0]===u.tab)) S.tab = u.tab;
    if(u.clubTab && CT.some(t=>t[0]===u.clubTab)) S.clubTab = u.clubTab;
    if(['events','open'].includes(u.genTab)) S.genTab = u.genTab;
    if(S.tab==='clubs' && u.clubId && (u.clubId==='__asg' || S.clubs.some(c=>c.id===u.clubId))) S.clubId = u.clubId;
    bind(); paint();
    window.__ACT = S;
  }
});
})();
</script>
